<!--
  PROTOTYPE, throwaway. Design directions for the basket page, switchable with
  ?variant= or the bar at the bottom (← → keys work too). The bar cycles round
  2; round 1's A, C and D stay reachable by URL.

  Round 3 (what the bar cycles): different metaphors, not different layouts.
    B  Schap        — the reference the user liked for readability
    I  Tassen       — two shopping bags; tap an item to move it to the other
    J  Vertrekbord  — split-flap departures board; prices flip into place
    K  Eén voor één — one item at a time, the two shops split the screen
    L  Plattegrond  — a store floor plan; items are pins along a walking route

  Round 2, all in B's readable idiom, each testing one question:
    B  Schap        — the baseline the user leaned towards
    E  Licht schap  — light palette; winner in full, the other chain a strip
    F  Prijslijst   — B's type as a dense table: does it hold at 30+ items?
    G  Twee winkels — split by where each item is cheapest: is a 2nd shop worth it?
    H  Folder       — offers on your list first, like the weekly flyer

  Round 1:

    A  Kassabon   — the list as a till receipt, both chains in two columns
    B  Schap      — every item a shelf with the two chains' price labels on it
    C  Weegschaal — a head-to-head: where the savings actually come from
    D  Briefje    — in-store mode: pick a chain, tick things off a note

  Same real catalogue and resolution as basket.html; state is in memory only.
  Open from disk after `node scripts/catalogue-from-db.ts`.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mealdeal · design prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&family=Nunito:wght@600;700;800;900&family=Roboto+Mono:wght@700&family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&family=Space+Grotesk:wght@400;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ── Switcher: deliberately not part of any design ─────────────────── */
  .proto-bar {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 50; display: flex; align-items: center; gap: 4px;
    background: #111; color: #fff; border-radius: 999px; padding: 5px;
    font: 500 13px/1 ui-sans-serif, system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  .proto-bar button { background: #2a2a2a; color: #fff; border: 0; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 15px; }
  .proto-bar button:hover { background: #444; }
  .proto-bar span { padding: 0 12px; white-space: nowrap; }

  /* ════════════════════════════════════════════════════════════════════
     A · KASSABON
     ════════════════════════════════════════════════════════════════════ */
  body[data-v="A"] {
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.35), transparent 40%),
      repeating-linear-gradient(90deg, #cfc6b4 0 2px, #d4cbb9 2px 5px);
    font-family: "Courier Prime", "Courier New", monospace; color: #23201b;
    padding: 40px 16px 110px;
  }
  .rcpt {
    width: min(460px, 100%); margin: 0 auto; background: #fffdf6;
    padding: 34px 26px 30px; position: relative;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 18px 40px -18px rgba(60,40,10,.45);
    --tooth: 9px;
    -webkit-mask:
      conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/calc(var(--tooth)*2) var(--tooth) repeat-x,
      conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top/calc(var(--tooth)*2) var(--tooth) repeat-x,
      linear-gradient(#000 0 0) center/100% calc(100% - 2*var(--tooth)) no-repeat;
            mask:
      conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/calc(var(--tooth)*2) var(--tooth) repeat-x,
      conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top/calc(var(--tooth)*2) var(--tooth) repeat-x,
      linear-gradient(#000 0 0) center/100% calc(100% - 2*var(--tooth)) no-repeat;
  }
  .rcpt .c { text-align: center; }
  .rcpt .logo { font-weight: 700; font-size: 26px; letter-spacing: .32em; margin: 0; }
  .rcpt .sub { font-size: 12px; letter-spacing: .14em; margin: 4px 0 0; }
  .rcpt .meta { font-size: 12px; line-height: 1.5; margin: 14px 0 0; color: #5d564b; }
  .rcpt hr { border: 0; border-top: 1px dashed #8d8577; margin: 14px 0; }
  .rcpt hr.dbl { border-top: 3px double #23201b; }
  .rcpt .cols, .rcpt .it .row1 { display: grid; grid-template-columns: 1fr 64px 64px; gap: 6px; align-items: baseline; }
  .rcpt .cols { font-size: 12px; font-weight: 700; letter-spacing: .1em; }
  .rcpt .cols span:not(:first-child), .rcpt .p { text-align: right; }
  .rcpt .it { padding: 6px 0; position: relative; }
  .rcpt .it .name { text-transform: uppercase; font-weight: 700; font-size: 14px; }
  .rcpt .it .qty { font-weight: 400; color: #5d564b; }
  .rcpt .p { font-size: 14px; font-variant-numeric: tabular-nums; }
  .rcpt .p.win { font-weight: 700; }
  .rcpt .p.win::after { content: "*"; position: absolute; margin-left: 1px; }
  .rcpt .p.none { color: #a33; }
  .rcpt .sku { font-size: 11.5px; color: #6b6458; line-height: 1.35; margin-top: 2px; padding-left: 12px; }
  .rcpt .sku b { font-weight: 400; color: #23201b; }
  .rcpt .tag { display: inline-block; border: 1px solid #23201b; padding: 0 4px; font-size: 10.5px; margin-left: 4px; }
  .rcpt .x {
    position: absolute; left: -22px; top: 7px; width: 18px; height: 18px; border: 0; background: none;
    color: #b0a898; cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
  }
  .rcpt .x:hover { color: #a33; }
  .rcpt .staple { background: none; border: 0; padding: 0; cursor: pointer; font-size: 11px; color: #8d8577; letter-spacing: .08em; }
  .rcpt .staple[aria-pressed="true"] { color: #23201b; font-weight: 700; }
  .rcpt .tot { display: grid; grid-template-columns: 1fr auto; font-size: 15px; gap: 2px 10px; }
  .rcpt .tot .lead { font-weight: 700; }
  .rcpt .save { margin: 14px 0 0; font-size: 21px; font-weight: 700; text-align: center; letter-spacing: .02em; }
  .rcpt .save small { display: block; font-size: 12px; font-weight: 400; letter-spacing: .1em; color: #5d564b; }
  .rcpt .warn { color: #a33; font-size: 12.5px; text-align: center; margin: 10px 0 0; }
  .rcpt form { display: flex; gap: 8px; align-items: center; margin: 4px 0 0; }
  .rcpt form label { font-weight: 700; }
  .rcpt form input {
    flex: 1; min-width: 0; border: 0; border-bottom: 1px dashed #8d8577; background: transparent;
    padding: 6px 2px; outline: none; font-size: 14px; caret-color: #a33;
  }
  .rcpt form input:focus { border-bottom-style: solid; border-bottom-color: #23201b; }
  .rcpt form button { border: 1.5px solid #23201b; background: #23201b; color: #fffdf6; padding: 5px 12px; cursor: pointer; font-weight: 700; letter-spacing: .1em; }
  .rcpt .barcode {
    height: 46px; margin: 18px auto 6px; width: 78%;
    background: repeating-linear-gradient(90deg, #23201b 0 2px, transparent 2px 4px, #23201b 4px 5px, transparent 5px 8px, #23201b 8px 11px, transparent 11px 12px);
  }
  .rcpt .thanks { font-size: 12px; letter-spacing: .2em; }
  @media (max-width: 520px) { .rcpt { padding-inline: 18px; } .rcpt .x { left: auto; right: -4px; top: -2px; } }

  /* ════════════════════════════════════════════════════════════════════
     B · SCHAP
     ════════════════════════════════════════════════════════════════════ */
  body[data-v="B"] {
    background: #1d2321; color: #f2efe6; font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    padding: 0 0 110px;
  }
  .aisle-head { padding: 28px clamp(16px, 4vw, 48px) 8px; display: flex; flex-wrap: wrap; gap: 18px 40px; align-items: end; }
  .aisle-head h1 { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: clamp(40px, 7vw, 76px); line-height: .9; margin: 0; letter-spacing: .01em; text-transform: uppercase; }
  .aisle-head h1 em { font-style: normal; color: #ffcf3a; }
  .signs { display: flex; gap: 12px; flex-wrap: wrap; }
  .sign {
    background: #f2efe6; color: #1d2321; padding: 10px 16px 12px; min-width: 170px; position: relative;
    border-top: 8px solid #6c7a74; box-shadow: 0 10px 0 -4px rgba(0,0,0,.35);
  }
  .sign.best { border-top-color: #ffcf3a; }
  .sign .k { font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 14px; }
  .sign .v { font-family: Anton, Impact, sans-serif; font-size: 44px; line-height: 1; }
  .sign .s { font-size: 15px; font-weight: 600; color: #4a5551; }
  .sign .s.bad { color: #b4321e; }
  .aisle-add { padding: 14px clamp(16px, 4vw, 48px) 26px; }
  .aisle-add form { display: flex; max-width: 640px; }
  .aisle-add input {
    flex: 1; min-width: 0; background: #2b3330; border: 2px solid #3c4743; border-right: 0; color: #f2efe6;
    padding: 12px 14px; font-size: 20px; font-weight: 600; outline: none;
  }
  .aisle-add input::placeholder { color: #8b9792; }
  .aisle-add input:focus { border-color: #ffcf3a; }
  .aisle-add button { background: #ffcf3a; color: #1d2321; border: 0; padding: 0 22px; font-family: Anton, Impact, sans-serif; font-size: 20px; letter-spacing: .06em; cursor: pointer; }
  .shelf {
    display: grid; grid-template-columns: 220px 1fr; gap: 0 22px; align-items: end;
    padding: 18px clamp(16px, 4vw, 48px) 0; position: relative;
  }
  .shelf::after { /* the rail the labels clip onto */
    content: ""; grid-column: 1 / -1; height: 16px; margin-top: 0;
    background: linear-gradient(#9aa7a1, #6c7a74 45%, #4a5551); box-shadow: 0 8px 14px -6px rgba(0,0,0,.6);
  }
  .shelf .what { padding-bottom: 10px; }
  .shelf .what .q { font-size: 15px; font-weight: 700; letter-spacing: .14em; color: #ffcf3a; }
  .shelf .what .n { font-size: 30px; font-weight: 700; line-height: 1; text-transform: uppercase; }
  .shelf .what .acts { margin-top: 8px; display: flex; gap: 6px; }
  .shelf .what .acts button { background: none; border: 1.5px solid #4a5551; color: #c9d0cc; padding: 2px 9px; cursor: pointer; font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .shelf .what .acts button:hover { border-color: #f2efe6; color: #f2efe6; }
  .shelf .what .acts button[aria-pressed="true"] { background: #f2efe6; color: #1d2321; border-color: #f2efe6; }
  .labels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .lbl {
    background: #fff; color: #111; position: relative; padding: 10px 12px 9px; min-height: 128px;
    display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto; gap: 2px 10px;
    border-bottom: 5px solid #ccd3cf;
  }
  .lbl .ch { font-weight: 700; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #6c7a74; }
  .lbl .pr { grid-row: 1 / 3; grid-column: 2; text-align: right; font-family: Anton, Impact, sans-serif; font-size: 46px; line-height: .95; }
  .lbl .pr small { display: block; font-family: "Barlow Condensed", sans-serif; font-size: 15px; font-weight: 700; color: #6c7a74; }
  .lbl .pn { font-size: 17px; font-weight: 600; line-height: 1.1; align-self: start; }
  .lbl .pk { grid-column: 1 / -1; font-size: 15px; font-weight: 500; color: #4a5551; display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid #e3e7e4; padding-top: 4px; }
  .lbl.win { border-bottom-color: #ffcf3a; }
  .lbl .sticker {
    position: absolute; top: -12px; right: -8px; transform: rotate(6deg);
    background: #ffcf3a; color: #1d2321; font-weight: 700; font-size: 14px; padding: 3px 9px; letter-spacing: .04em;
    box-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  .lbl .offer { position: absolute; top: -12px; left: 10px; transform: rotate(-3deg); background: #e8452c; color: #fff; font-weight: 700; font-size: 14px; padding: 3px 9px; }
  .lbl.empty { background: repeating-linear-gradient(-45deg, #2b3330 0 10px, #252c29 10px 20px); color: #8b9792; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; border-bottom-color: #3c4743; }
  @media (max-width: 760px) {
    .shelf { grid-template-columns: 1fr; }
    .labels { grid-template-columns: 1fr 1fr; gap: 10px; }
    .lbl .pr { font-size: 34px; }
    .lbl .pn { font-size: 15px; }
  }

  /* ════════════════════════════════════════════════════════════════════
     C · WEEGSCHAAL
     ════════════════════════════════════════════════════════════════════ */
  body[data-v="C"] {
    --paper: #f6f1e7; --ink: #1a1a1a; --left: #1f4fb8; --right: #d2462a; --mute: #6f6a60; --rule: #d9d1c0;
    background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    padding: 0 16px 120px;
  }
  .duel { max-width: 980px; margin: 0 auto; }
  .duel .mast { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid var(--ink); padding: 22px 0 8px; gap: 12px; flex-wrap: wrap; }
  .duel .mast b { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 22px; letter-spacing: -.01em; }
  .duel .mast span { font-size: 12px; color: var(--mute); letter-spacing: .08em; text-transform: uppercase; }
  .duel h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(34px, 6vw, 64px); line-height: 1.02; letter-spacing: -.025em; margin: 26px 0 8px; max-width: 16ch; }
  .duel h1 .l { color: var(--left); } .duel h1 .r { color: var(--right); }
  .duel .dek { color: var(--mute); max-width: 60ch; margin: 0 0 22px; font-size: 15px; }
  .scale { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .scale > div { padding: 14px 0; }
  .scale > div + div { border-left: 1px solid var(--ink); padding-left: 18px; text-align: right; padding-right: 0; }
  .scale .who { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  .scale .amt { font-family: Fraunces, Georgia, serif; font-size: clamp(30px, 5vw, 46px); font-weight: 600; letter-spacing: -.02em; }
  .scale .l .amt { color: var(--left); } .scale .r .amt { color: var(--right); }
  .scale .cov { font-size: 13px; color: var(--mute); }
  .scale .cov.bad { color: var(--right); font-weight: 600; }
  .duel form { display: flex; gap: 0; margin: 22px 0 6px; border: 1.5px solid var(--ink); background: #fffdf8; }
  .duel form input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 13px 14px; font-size: 16px; outline: none; }
  .duel form button { border: 0; background: var(--ink); color: var(--paper); padding: 0 18px; cursor: pointer; font-weight: 600; }
  .duel .sortbar { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 4px; font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: .1em; gap: 10px; flex-wrap: wrap; }
  .duel .sortbar button { background: none; border: 0; border-bottom: 1px solid currentColor; padding: 0; cursor: pointer; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: var(--ink); }
  .bout { display: grid; grid-template-columns: 1fr minmax(150px, 210px) 1fr; align-items: center; border-bottom: 1px solid var(--rule); padding: 10px 0; gap: 12px; }
  .bout .side { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .bout .side.l { justify-content: flex-end; text-align: right; }
  .bout .side .txt { min-width: 0; flex: 0 1 auto; }
  .bout .side .p { font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bout .side .pn { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26ch; }
  .bout .side.l .p { color: var(--left); } .bout .side.r .p { color: var(--right); }
  .bout .side.lose .p { color: var(--mute); font-weight: 400; }
  .bout .bar { height: 10px; flex: 0 0 auto; border-radius: 1px; }
  .bout .side.l .bar { background: var(--left); } .bout .side.r .bar { background: var(--right); }
  .bout .mid { text-align: center; }
  .bout .mid .n { font-weight: 600; font-size: 15px; line-height: 1.2; }
  .bout .mid .q { font-size: 12px; color: var(--mute); }
  .bout .mid .d { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .bout .mid .x { background: none; border: 0; color: var(--mute); cursor: pointer; font-size: 12px; padding: 2px 4px; text-decoration: underline; }
  .bout .none { font-size: 13px; color: var(--right); font-style: italic; }
  @media (max-width: 640px) {
    .bout { grid-template-columns: 1fr 1fr; grid-template-areas: "mid mid" "l r"; row-gap: 6px; }
    .bout .mid { grid-area: mid; }
    .bout .side.l { grid-area: l; } .bout .side.r { grid-area: r; }
    .bout .side .pn { max-width: 18ch; }
  }

  /* ════════════════════════════════════════════════════════════════════
     D · BRIEFJE
     ════════════════════════════════════════════════════════════════════ */
  body[data-v="D"] {
    background: #3b5249; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #26302c;
    padding: 28px 14px 130px;
  }
  .note {
    width: min(480px, 100%); margin: 0 auto; background: #fbf8ef; position: relative;
    box-shadow: 0 30px 50px -30px rgba(0,0,0,.6), 0 2px 0 rgba(0,0,0,.08);
    transform: rotate(-.6deg);
  }
  .note::before { /* tape */
    content: ""; position: absolute; top: -14px; left: 50%; width: 110px; height: 28px; transform: translateX(-50%) rotate(2deg);
    background: rgba(255, 244, 196, .75); box-shadow: 0 1px 2px rgba(0,0,0,.15);
  }
  .note .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-bottom: 2px solid #26302c; }
  .note .pick button {
    border: 0; background: transparent; padding: 16px 14px 12px; text-align: left; cursor: pointer; position: relative;
  }
  .note .pick button + button { border-left: 2px solid #26302c; }
  .note .pick button[aria-pressed="true"] { background: #26302c; color: #fbf8ef; }
  .note .pick .ch { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  .note .pick .t { font-size: 28px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .note .pick .s { font-size: 12.5px; opacity: .8; }
  .note .pick .badge { position: absolute; top: 10px; right: 10px; font-family: Caveat, cursive; font-size: 20px; font-weight: 700; color: #c2412b; transform: rotate(-6deg); }
  .note .pick button[aria-pressed="true"] .badge { color: #ffd36b; }
  .note .paper {
    --line: 44px;
    background:
      linear-gradient(90deg, transparent 52px, rgba(194, 65, 43, .55) 52px 54px, transparent 54px),
      repeating-linear-gradient(#fbf8ef 0 calc(var(--line) - 1px), #c9d6dd calc(var(--line) - 1px) var(--line));
    padding: 6px 0 var(--line);
  }
  .note form { display: flex; align-items: center; height: var(--line); padding-left: 66px; padding-right: 12px; }
  .note form input { flex: 1; min-width: 0; border: 0; background: transparent; font-family: Caveat, cursive; font-size: 27px; outline: none; color: #1f3e8a; }
  .note form input::placeholder { color: #9aa6ad; }
  .note form button { border: 0; background: none; font-family: Caveat, cursive; font-size: 24px; color: #1f3e8a; cursor: pointer; font-weight: 700; }
  .ln { display: grid; grid-template-columns: 52px 1fr auto; align-items: start; min-height: calc(var(--line) * 2); }
  .ln .tick {
    margin: 10px 0 0 14px; width: 26px; height: 26px; border: 2px solid #26302c; border-radius: 48% 52% 45% 55%;
    background: transparent; cursor: pointer; position: relative; padding: 0;
  }
  .ln.done .tick::after { content: "✓"; position: absolute; inset: -9px 0 0 3px; font-family: Caveat, cursive; font-size: 34px; color: #1f3e8a; font-weight: 700; }
  .ln .body { padding: 2px 0 0 14px; min-width: 0; }
  .ln .hand { font-family: Caveat, cursive; font-size: 29px; line-height: var(--line); height: var(--line); color: #1f3e8a; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; }
  .ln .hand .q { font-size: 22px; color: #5b6f95; }
  .ln .grab { font-size: 12.5px; line-height: var(--line); height: var(--line); color: #4f5c57; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ln .grab .o { background: #ffd36b; padding: 0 5px; font-weight: 600; color: #26302c; }
  .ln .grab .w { color: #a35a12; font-weight: 600; }
  .ln .grab .miss { color: #c2412b; font-weight: 600; }

<script src="catalogue.js"></script>
<script>
  if (!window.CATALOGUE) {
    document.getElementById("root").textContent = "Run node scripts/catalogue-from-db.ts first: catalogue.js is missing.";
    throw new Error("no catalogue");
  }
  const data = window.CATALOGUE;
  const chains = data.chains;

  // ── Shared core: copied from basket.html, so every variant prices the same ──
  const euro = (c) => "€" + (c / 100).toFixed(2).replace(".", ",");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const per = { kg: "/kg", l: "/l", piece: "/st" };

  function stem(w) {
    let b; do { b = w; if (w.length > 4) w = w.replace(/(jes|je|en|e|s)$/, ""); } while (w !== b); return w;
  }
  const wordsOf = (noun) => noun.toLowerCase().split(/[^\p{L}]+/u).filter((w) => w.length > 1).map(stem);
  const products = {}, searchable = {};
  for (const c of chains) {
    products[c.id] = {};
    searchable[c.id] = data.catalogue[c.id].map((r) => {
      const id = c.id + "-" + r[0];
      products[c.id][id] = { id, name: r[1], packaging: r[2], packQuantity: r[3], packUnit: r[4], comparisonUnit: r[5],
        shelfPriceCents: r[6], offerPriceCents: r[7], unitPriceCents: r[8], offerWording: r[9], offerUpcoming: r[10] === 1 };
      return { id, unit: r[5], words: r[1].toLowerCase().split(/[^\p{L}]+/u).filter(Boolean).map(stem) };
    });
  }
  const matching = (cid, unit, words) => searchable[cid].filter((p) =>
    (unit === null || p.unit === unit) && words.every((w) => p.words.some((n) => n.endsWith(w))));

  const UNITS = { g: ["kg", .001], gr: ["kg", .001], gram: ["kg", .001], kg: ["kg", 1], kilo: ["kg", 1], ml: ["l", .001], cl: ["l", .01],
    l: ["l", 1], liter: ["l", 1], x: ["piece", 1], "×": ["piece", 1], st: ["piece", 1], stuk: ["piece", 1], stuks: ["piece", 1] };
  function parse(text) {
    const t = text.trim().replace(/\s+/g, " "); if (!t) return null;
    let quantity = null, unit = null, noun = t;
    const m = t.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
    if (m) {
      quantity = Number(m[1].replace(",", ".")); noun = m[2];
      const [first, ...rest] = noun.split(" "); const u = UNITS[first.toLowerCase().replace(/\.$/, "")];
      if (u && rest.length) { unit = u[0]; quantity *= u[1]; noun = rest.join(" "); }
    }
    if (!noun || UNITS[noun.toLowerCase()] || !(quantity === null || quantity > 0)) return null;
    let guessed = false;
    if (unit === null) {
      const tally = { kg: 0, l: 0, piece: 0 };
      for (const c of chains) for (const p of matching(c.id, null, wordsOf(noun))) tally[p.unit]++;
      if (quantity !== null && tally.piece > 0) unit = "piece";
      else { unit = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0]; if (!tally[unit]) unit = "piece"; guessed = true; }
      if (quantity === null) { quantity = 1; guessed = true; }
    }
    return { text: t, noun, quantity: Math.round(quantity * 1000) / 1000, unit, guessed };
  }
  const resolved = {};
  function line(cid, item) {
    const key = cid + "|" + item.unit + "|" + item.noun;
    resolved[key] ??= matching(cid, item.unit, wordsOf(item.noun)).map((s) => products[cid][s.id])
      .sort((a, b) => a.unitPriceCents - b.unitPriceCents || a.shelfPriceCents - b.shelfPriceCents)[0] || null;
    const p = resolved[key]; if (!p) return null;
    const offer = (p.offerPriceCents !== null || p.offerWording) && !p.offerUpcoming ? (p.offerWording || "actie") : null;
    const price = offer && p.offerPriceCents ? p.offerPriceCents : p.shelfPriceCents;
    const known = p.packQuantity > 0 && p.packUnit === item.unit;
    const packs = known ? Math.max(1, Math.ceil(item.quantity / p.packQuantity)) : 1;
    return { p, offer, packs, cost: packs * price, over: known ? p.packQuantity / item.quantity : 1 };
  }
  const qtyText = (i) => i.unit === "piece" ? i.quantity + "×" : (i.unit === "kg" && i.quantity < 1 ? i.quantity * 1000 + " g"
    : i.unit === "l" && i.quantity < 1 ? i.quantity * 1000 + " ml" : i.quantity + " " + i.unit);

  // ── In-memory state (prototype: no persistence) ──
  let nid = 0;
  let list = ["1 kg kruimige aardappelen", "250 g champignons", "2 courgettes", "500 g rundergehakt", "400 g broccoli",
    "1 komkommer", "1 l halfvolle melk", "1 kg uien", "350 g pindakaas", "400 g spinazie", "6 eieren", "500 g wortelen"]
    .map((t) => ({ id: "i" + nid++, staple: false, ...parse(t) }));
  list[6].staple = list[10].staple = true;
  const done = new Set();
  let shopAt = null; // D: chosen chain
  let sortBySaving = true; // C

  function snapshot() {
    const rows = list.map((item) => {
      const by = Object.fromEntries(chains.map((c) => [c.id, line(c.id, item)]));
      return { item, by };
    });
    const totals = chains.map((c) => {
      let cost = 0, filled = 0;
      for (const r of rows) if (r.by[c.id]) { filled++; cost += r.by[c.id].cost; }
      return { chain: c, cost, filled, total: rows.length };
    });
    const full = totals.filter((t) => t.filled === t.total).sort((a, b) => a.cost - b.cost);
    const allFull = full.length === totals.length && rows.length > 0;
    return { rows, totals, best: allFull ? full[0] : null, worst: allFull ? full[full.length - 1] : null };
  }
  const cheapestFor = (r) => {
    const ls = chains.map((c) => [c.id, r.by[c.id]]).filter(([, l]) => l).sort((a, b) => a[1].cost - b[1].cost);
    return ls.length === chains.length && ls[0][1].cost < ls[1][1].cost ? ls[0][0] : null;
  };

  // ════════════════════════════════════════════════════════════════════
  const V = {};

  V.A = { name: "Kassabon", render(s) {
    const d = new Date(chains[0].observedAt + "T12:00:00");
    const items = s.rows.map((r) => {
      const win = cheapestFor(r);
      const cols = chains.map((c) => {
        const l = r.by[c.id];
        return l ? '<span class="p' + (win === c.id ? " win" : "") + '">' + euro(l.cost).slice(1) + "</span>"
          : '<span class="p none">--</span>';
      }).join("");
      const skus = chains.map((c) => {
        const l = r.by[c.id]; if (!l) return "";
        return '<div class="sku">' + c.name.slice(0, 1) + ": <b>" + esc(l.p.name) + "</b>" + (l.packs > 1 ? " ×" + l.packs : "") +
          (l.offer ? '<span class="tag">' + esc(l.offer) + "</span>" : "") + (l.over >= 2 ? '<span class="tag">' + Math.round(l.over * 10) / 10 + "× NODIG</span>" : "") + "</div>";
      }).join("");
      return '<div class="it">' +
        '<div class="row1"><span class="name">' + esc(r.item.noun) + ' <span class="qty">' + qtyText(r.item) + "</span></span>" + cols + "</div>" +
        skus + '<div class="sku"><button class="staple" data-act="staple" data-id="' + r.item.id + '" aria-pressed="' + r.item.staple + '">' +
        (r.item.staple ? "■ VASTE BOODSCHAP" : "□ vaste boodschap") + '</button> · <button class="staple" data-act="remove" data-id="' + r.item.id + '">✕ schrappen</button></div></div>';
    }).join("");
    const tots = s.totals.map((t) => '<span class="' + (s.best && s.best.chain.id === t.chain.id ? "lead" : "") + '">TOTAAL ' +
      t.chain.name.toUpperCase() + "</span><span>" + (t.filled < t.total ? "≥ " : "") + euro(t.cost) + "</span>").join("");
    const saving = s.best ? '<p class="save"><small>U BESPAART BIJ ' + s.best.chain.name.toUpperCase() + "</small>" + euro(s.worst.cost - s.best.cost) + "</p>"
      : s.rows.length ? '<p class="warn">Niet alles te koop bij elke keten — totalen zijn een ondergrens, geen prijs.</p>' : "";
    return '<div class="rcpt">' +
      '<div class="c"><p class="logo">MEALDEAL</p><p class="sub">BOODSCHAPPENLIJST</p>' +
      '<p class="meta">' + chains.map((c) => c.name.toUpperCase() + " · " + (c.store || "LANDELIJK").toUpperCase()).join("<br>") +
      "<br>PRIJZEN VAN " + d.toLocaleDateString("nl-NL", { day: "2-digit", month: "2-digit", year: "numeric" }) + "</p></div>" +
      "<hr>" + '<div class="cols"><span>ARTIKEL</span>' + chains.map((c) => "<span>" + c.name.toUpperCase() + "</span>").join("") + "</div><hr>" +
      items +
      '<hr><form class="add"><label for="q">+</label><input id="q" name="q" placeholder="500 g rundergehakt" autocomplete="off"><button>OK</button></form>' +
      '<hr class="dbl"><div class="tot">' + tots + "<span>ARTIKELEN</span><span>" + s.rows.length + "</span></div>" + saving +
      '<p class="c" style="font-size:11px;color:#6b6458;margin-top:12px">* = goedkoopst voor dit artikel</p>' +
      '<div class="barcode"></div><p class="c thanks">BEDANKT EN TOT ZIENS</p></div>';
  } };

  V.B = { name: "Schap", render(s) {
    const winner = s.best;
    const signs = s.totals.map((t) => {
      const best = winner && winner.chain.id === t.chain.id;
      const miss = t.total - t.filled;
      return '<div class="sign' + (best ? " best" : "") + '"><div class="k">' + esc(t.chain.name) + (best ? " · goedkoopst" : "") + "</div>" +
        '<div class="v">' + (miss ? "≥" : "") + euro(t.cost) + "</div>" +
        '<div class="s' + (miss ? " bad" : "") + '">' + (miss ? miss + " van " + t.total + " niet te koop" : "alle " + t.total + " te koop") + "</div></div>";
    }).join("");
    const shelves = s.rows.map((r) => {
      const win = cheapestFor(r);
      const labels = chains.map((c) => {
        const l = r.by[c.id];
        if (!l) return '<div class="lbl empty">' + esc(c.name) + " · niet op voorraad</div>";
        return '<div class="lbl' + (win === c.id ? " win" : "") + '">' +
          (win === c.id ? '<span class="sticker">' + (win && r.by[chains.find((x) => x.id !== c.id).id] ?
            "−" + euro(r.by[chains.find((x) => x.id !== c.id).id].cost - l.cost) : "goedkoopst") + "</span>" : "") +
          (l.offer ? '<span class="offer">' + esc(l.offer) + "</span>" : "") +
          '<span class="ch">' + esc(c.name) + "</span>" +
          '<span class="pr">' + euro(l.p.unitPriceCents) + "<small>" + per[l.p.comparisonUnit] + "</small></span>" +
          '<span class="pn">' + esc(l.p.name) + "</span>" +
          '<span class="pk"><span>' + (l.packs > 1 ? l.packs + " × " : "") + [l.p.packaging ? esc(l.p.packaging) : "", l.over >= 2 ? Math.round(l.over * 10) / 10 + "× nodig" : ""].filter(Boolean).join(" · ") +
          "</span><b>" + euro(l.cost) + "</b></span></div>";
      }).join("");
      return '<section class="shelf"><div class="what"><div class="q">' + qtyText(r.item) + '</div><div class="n">' + esc(r.item.noun) + "</div>" +
        '<div class="acts"><button data-act="staple" data-id="' + r.item.id + '" aria-pressed="' + r.item.staple + '">vast</button>' +
        '<button data-act="remove" data-id="' + r.item.id + '">weg</button></div></div><div class="labels">' + labels + "</div></section>";
    }).join("");
    return '<header class="aisle-head"><h1>Gang <em>1</em><br>jouw lijst</h1><div class="signs">' + signs + "</div></header>" +
      '<div class="aisle-add"><form class="add"><input name="q" placeholder="Zet iets op de lijst — 500 g rundergehakt" autocomplete="off"><button>+ ERBIJ</button></form></div>' +
      shelves;
  } };

  V.C = { name: "Weegschaal", render(s) {
    const [L, R] = chains;
    const tl = s.totals[0], tr = s.totals[1];
    let headline;
    if (s.best) {
      const diff = s.worst.cost - s.best.cost;
      const cls = s.best.chain.id === L.id ? "l" : "r";
      headline = '<span class="' + cls + '">' + esc(s.best.chain.name) + "</span> is " + euro(diff) + " cheaper for this list.";
    } else headline = "Neither chain can fill this whole list yet.";
    const rows = s.rows.map((r) => {
      const a = r.by[L.id], b = r.by[R.id];
      const diff = a && b ? b.cost - a.cost : 0; // >0: left cheaper
      return { r, a, b, diff };
    });
    if (sortBySaving) rows.sort((x, y) => Math.abs(y.diff) - Math.abs(x.diff));
    const maxD = Math.max(1, ...rows.map((x) => Math.abs(x.diff)));
    const side = (cls, l, wins, d) => {
      if (!l) return '<div class="side ' + cls + '"><span class="none">not stocked</span></div>';
      const w = wins ? Math.max(2, Math.round(Math.abs(d) / maxD * 42)) : 0;
      const txt = '<div class="txt"><div class="p">' + euro(l.cost) + '</div><div class="pn" title="' + esc(l.p.name) + '">' +
        (l.offer ? "▲ " + esc(l.offer) + " · " : "") + esc(l.p.name) + "</div></div>";
      const bar = '<span class="bar" style="width:' + w + '%"></span>';
      return '<div class="side ' + cls + (wins ? "" : " lose") + '">' + (cls === "l" ? txt + bar : bar + txt) + "</div>";
    };
    const bouts = rows.map(({ r, a, b, diff }) => '<div class="bout">' +
      side("l", a, diff > 0, diff) +
      '<div class="mid"><div class="n">' + esc(r.item.noun) + '</div><div class="q">' + qtyText(r.item) + "</div>" +
      (a && b && diff ? '<div class="d" style="color:var(--' + (diff > 0 ? "left" : "right") + ')">' + (diff > 0 ? "← " : "") + euro(Math.abs(diff)) + (diff < 0 ? " →" : "") + "</div>"
        : a && b ? '<div class="d" style="color:var(--mute)">even</div>' : "") +
      '<button class="x" data-act="remove" data-id="' + r.item.id + '">remove</button></div>' +
      side("r", b, diff < 0, diff) + "</div>").join("");
    const cov = (t) => '<div class="cov' + (t.filled < t.total ? " bad" : "") + '">' + t.filled + " of " + t.total + " items" + (t.filled < t.total ? " — total is a floor" : "") + "</div>";
    return '<div class="duel"><div class="mast"><b>mealdeal</b><span>Prices of ' + esc(L.observedAt) + " · " + esc(L.name) + " " + esc(L.store || "national") + " vs " + esc(R.name) + " " + esc(R.store || "national") + "</span></div>" +
      "<h1>" + headline + "</h1>" +
      '<p class="dek">Each bar points at the chain that is cheaper for that item, and its length is how much cheaper. The long bars are where the choice of shop actually matters.</p>' +
      '<div class="scale"><div class="l"><div class="who" style="color:var(--left)">' + esc(L.name) + '</div><div class="amt">' + (tl.filled < tl.total ? "≥ " : "") + euro(tl.cost) + "</div>" + cov(tl) + "</div>" +
      '<div class="r"><div class="who" style="color:var(--right)">' + esc(R.name) + '</div><div class="amt">' + (tr.filled < tr.total ? "≥ " : "") + euro(tr.cost) + "</div>" + cov(tr) + "</div></div>" +
      '<form class="add"><input name="q" placeholder="Add to this week’s list: 500 g rundergehakt" autocomplete="off"><button>Add</button></form>' +
      '<div class="sortbar"><span>' + s.rows.length + " items</span><button data-act=\"sort\">" + (sortBySaving ? "Sorted by difference · show list order" : "List order · sort by difference") + "</button></div>" +
      bouts + "</div>";
  } };

  V.D = { name: "Briefje", render(s) {
    if (!shopAt || !chains.some((c) => c.id === shopAt)) shopAt = (s.best || s.totals.slice().sort((a, b) => b.filled - a.filled || a.cost - b.cost)[0]).chain.id;
    const here = s.totals.find((t) => t.chain.id === shopAt);
    const pick = s.totals.map((t) => {
      const best = s.best && s.best.chain.id === t.chain.id;
      const save = best ? "bespaar " + euro(s.worst.cost - s.best.cost) : "";
      return '<button data-act="shop" data-id="' + t.chain.id + '" aria-pressed="' + (t.chain.id === shopAt) + '">' +
        (best ? '<span class="badge">' + save + "</span>" : "") +
        '<div class="ch">' + esc(t.chain.name) + '</div><div class="t">' + (t.filled < t.total ? "≥" : "") + euro(t.cost) + "</div>" +
        '<div class="s">' + (t.filled < t.total ? t.total - t.filled + " niet te koop" : "alles te koop") + "</div></button>";
    }).join("");
    let leftCost = 0, inCart = 0;
    const lines = s.rows.map((r) => {
      const l = r.by[shopAt]; const isDone = done.has(r.item.id);
      if (l && !isDone) leftCost += l.cost; if (isDone) inCart++;
      const grab = l
        ? (l.offer ? '<span class="o">' + esc(l.offer) + "</span> " : "") + (l.over >= 2 ? '<span class="w">' + Math.round(l.over * 10) / 10 + "× te veel</span> " : "") +
          (l.packs > 1 ? l.packs + "× " : "") + esc(l.p.name) + (l.p.packaging ? " · " + esc(l.p.packaging) : "")
        : '<span class="miss">niet bij ' + esc(chains.find((c) => c.id === shopAt).name) + "</span>";
      return '<div class="ln' + (isDone ? " done" : "") + (l ? "" : " away") + '">' +
        '<button class="tick" data-act="tick" data-id="' + r.item.id + '" aria-label="In de kar" aria-pressed="' + isDone + '"></button>' +
        '<div class="body"><div class="hand">' + esc(r.item.noun) + ' <span class="q">' + qtyText(r.item) + "</span></div>" +
        '<div class="grab">' + grab + "</div></div>" +
        '<div class="side"><div class="pr">' + (l ? euro(l.cost) : "—") + "</div>" +
        '<div class="ops"><button data-act="staple" data-id="' + r.item.id + '" aria-pressed="' + r.item.staple + '" title="Vaste boodschap">📌</button>' +
        '<button data-act="remove" data-id="' + r.item.id + '" title="Weg">✕</button></div></div></div>';
    }).join("");
    const pct = s.rows.length ? Math.round(inCart / s.rows.length * 100) : 0;
    return '<div class="note"><div class="pick">' + pick + '</div><div class="paper">' +
      '<form class="add"><input name="q" placeholder="schrijf erbij…" autocomplete="off"><button>+</button></form>' + lines + "</div></div>" +
      '<div class="trolley"><div><div class="big">' + euro(leftCost) + ' <span class="small">nog te pakken</span></div>' +
      '<div class="small">' + inCart + " van " + s.rows.length + " in de kar · " + esc(here.chain.name) + "</div></div>" +
      '<div class="meter"><i style="width:' + pct + '%"></i></div>' +
      (inCart ? '<button data-act="finish">Klaar</button>' : "") + "</div>";
  } };

  // ════════════════════════════════════════════════════════════════════
  // ROUND 2 — B's idiom, four different questions
  // ════════════════════════════════════════════════════════════════════
  const other = (cid) => chains.find((c) => c.id !== cid);
  const totalsLine = (t) => t.filled < t.total ? (t.total - t.filled) + " van " + t.total + " niet te koop" : "alle " + t.total + " te koop";
  const overText = (l) => l.over >= 2 ? Math.round(l.over * 10) / 10 + "× wat je nodig hebt" : "";
  const acts = (item, a = "vast", b = "weg") =>
    '<button data-act="staple" data-id="' + item.id + '" aria-pressed="' + item.staple + '">' + a + "</button>" +
    '<button data-act="remove" data-id="' + item.id + '">' + b + "</button>";

  V.E = { name: "Licht schap", render(s) {
    const tots = s.totals.map((t) => {
      const best = s.best && s.best.chain.id === t.chain.id;
      return '<div class="e-tot' + (best ? " best" : "") + '"><div class="k">' + esc(t.chain.name) + (best ? " · goedkoopst" : "") + "</div>" +
        '<div class="v">' + (t.filled < t.total ? "≥" : "") + euro(t.cost) + '</div><div class="s' + (t.filled < t.total ? " bad" : "") + '">' + totalsLine(t) + "</div></div>";
    }).join("");
    const items = s.rows.map((r) => {
      // The cheaper chain gets the full label; with only one stocking it, that one.
      const ls = chains.map((c) => [c, r.by[c.id]]).filter(([, l]) => l).sort((a, b) => a[1].cost - b[1].cost);
      let card;
      if (!ls.length) card = '<div class="e-card"><div class="e-none">Bij geen van beide te koop</div></div>';
      else {
        const [[wc, wl], second] = ls;
        const best = ls.length === chains.length && second && wl.cost < second[1].cost;
        const tags = (wl.offer ? '<span class="tagx o">' + esc(wl.offer) + "</span>" : "") + (overText(wl) ? '<span class="tagx w">' + overText(wl) + "</span>" : "");
        const otherLine = second
          ? '<div class="e-other"><span class="ell"><b>' + esc(second[0].name) + "</b> " + euro(second[1].p.unitPriceCents) + per[second[1].p.comparisonUnit] + " · " + esc(second[1].p.name) + "</span>" +
            '<span class="more">' + (second[1].cost > wl.cost ? "+" + euro(second[1].cost - wl.cost) : "even duur") + "</span></div>"
          : '<div class="e-other"><span><b>' + esc(other(wc.id).name) + "</b> heeft dit niet</span></div>";
        card = '<div class="e-card' + (best ? " best" : "") + '"><div class="e-win">' +
          '<span class="ch">' + esc(wc.name) + (best ? " · goedkoopst" : "") + "</span>" +
          '<span class="pr">' + euro(wl.p.unitPriceCents) + "<small>" + per[wl.p.comparisonUnit] + "</small></span>" +
          '<span class="pn">' + esc(wl.p.name) + "</span>" +
          '<span class="pk">' + [wl.p.packaging ? esc(wl.p.packaging) : "", wl.packs > 1 ? wl.packs + " stuks pakken" : ""].filter(Boolean).join(" · ") + "</span>" +
          '<div class="pay"><span>Je betaalt' + tags + "</span><span>" + euro(wl.cost) + "</span></div></div>" + otherLine + "</div>";
      }
      return '<div class="e-item"><div class="what"><div class="q">' + qtyText(r.item) + '</div><div class="n">' + esc(r.item.noun) + '</div><div class="acts">' + acts(r.item) + "</div></div>" + card + "</div>";
    }).join("");
    return '<header class="e-top"><div class="row"><h1>Jouw lijst<span>Per artikel de goedkoopste, de ander eronder</span></h1><div class="e-tots">' + tots + "</div></div>" +
      '<form class="add e-add"><input name="q" placeholder="Zet iets op de lijst — 500 g rundergehakt" autocomplete="off"><button>+ ERBIJ</button></form></header>' +
      '<div class="e-list">' + items + "</div>";
  } };

  V.F = { name: "Prijslijst", render(s) {
    const cols = s.totals.map((t) => {
      const best = s.best && s.best.chain.id === t.chain.id;
      return '<div class="chain' + (best ? " best" : "") + '"><div><div class="k">' + esc(t.chain.name) + '</div><div class="s' + (t.filled < t.total ? " bad" : "") + '">' + totalsLine(t) + "</div></div>" +
        '<div class="v">' + (t.filled < t.total ? "≥" : "") + euro(t.cost) + "</div></div>";
    }).join("");
    const rows = s.rows.map((r) => {
      const win = cheapestFor(r);
      const cells = chains.map((c) => {
        const l = r.by[c.id];
        if (!l) return '<div class="f-cell none">niet te koop</div>';
        const chips = (l.offer ? '<span class="chip o">' + esc(l.offer) + "</span>" : "") + (l.over >= 2 ? '<span class="chip w">' + Math.round(l.over * 10) / 10 + "×</span>" : "");
        return '<div class="f-cell' + (win === c.id ? " win" : "") + '"><span class="pn" title="' + esc(l.p.name) + '">' + esc(l.p.name) + "</span>" +
          '<span class="pr">' + euro(l.p.unitPriceCents) + "<small>" + per[l.p.comparisonUnit] + "</small></span>" +
          '<span class="pk"><b>' + euro(l.cost) + "</b>" + (l.packs > 1 ? " · " + l.packs + " stuks" : "") + chips + "</span></div>";
      }).join("");
      return '<div class="f-grid f-row"><div class="what"><span class="n">' + esc(r.item.noun) + '</span><span class="q">' + qtyText(r.item) + '</span><span class="acts">' + acts(r.item) + "</span></div>" + cells + "</div>";
    }).join("");
    return '<div class="f-wrap"><div class="f-head"><div class="top"><h1>Prijs<em>lijst</em></h1>' +
      '<form class="add"><input name="q" placeholder="500 g rundergehakt" autocomplete="off"><button>+ ERBIJ</button></form></div>' +
      '<div class="f-grid f-cols"><div class="lbl">' + s.rows.length + " artikelen</div>" + cols + "</div></div>" + rows + "</div>";
  } };

  V.G = { name: "Twee winkels", render(s) {
    // Split: every item from wherever it is cheapest. Only items both stock can be compared.
    const groups = Object.fromEntries(chains.map((c) => [c.id, []]));
    const neither = [];
    let split = 0;
    for (const r of s.rows) {
      const ls = chains.map((c) => [c, r.by[c.id]]).filter(([, l]) => l).sort((a, b) => a[1].cost - b[1].cost);
      if (!ls.length) { neither.push(r); continue; }
      const [[wc, wl], second] = ls;
      split += wl.cost;
      groups[wc.id].push({ r, l: wl, gap: second ? second[1].cost - wl.cost : null });
    }
    const single = s.totals.filter((t) => t.filled === t.total).sort((a, b) => a.cost - b.cost)[0];
    const extra = single ? single.cost - split : null;
    const opts = s.totals.map((t) =>
      '<div class="g-opt' + (single && single.chain.id === t.chain.id && extra < 300 ? " pick" : "") + '"><div class="k">Alles bij ' + esc(t.chain.name) + '</div><div class="v">' + (t.filled < t.total ? "≥" : "") + euro(t.cost) + '</div><div class="s' + (t.filled < t.total ? " bad" : "") + '">' + totalsLine(t) + "</div></div>").join("") +
      '<div class="g-opt' + (!single || extra >= 300 ? " pick" : "") + '"><div class="k">Allebei bezoeken</div><div class="v">' + euro(split) + '</div><div class="s">' +
      chains.map((c) => groups[c.id].length + " bij " + esc(c.name)).join(" · ") + "</div></div>";
    const verdict = single
      ? extra <= 0 ? "Eén winkel is al het goedkoopst: alles bij " + esc(single.chain.name) + "."
        : "Twee winkels scheelt " + euro(extra) + " ten opzichte van alles bij " + esc(single.chain.name) + ". " +
          (extra < 300 ? "Waarschijnlijk niet de extra rit waard." : "Dat is de moeite van een tweede winkel.")
      : "Geen van beide heeft alles — met twee winkels kom je het verst.";
    const col = (c) => {
      const g = groups[c.id].sort((a, b) => (b.gap ?? 0) - (a.gap ?? 0));
      const sum = g.reduce((n, x) => n + x.l.cost, 0);
      return '<div class="g-col"><h2>' + esc(c.name) + " <small>" + g.length + " artikelen · " + euro(sum) + "</small></h2>" +
        (g.length ? g.map(({ r, l, gap }) => {
          const tiny = gap !== null && gap < 25;
          return '<div class="g-it' + (tiny ? " tiny" : "") + '"><span class="n">' + esc(r.item.noun) + '<span class="q">' + qtyText(r.item) + "</span></span>" +
            '<span class="pr">' + euro(l.cost) + '</span><span class="pn">' + esc(l.p.name) + (l.offer ? " · " + esc(l.offer) : "") + "</span>" +
            '<span class="gap' + (tiny ? " tiny" : "") + '">' + (gap === null ? "alleen hier" : gap === 0 ? "even duur" : euro(gap) + " goedkoper") + "</span>" +
            '<span class="acts">' + acts(r.item) + "</span></div>";
        }).join("") : '<div class="g-it"><span class="pn">Niets is hier goedkoper.</span></div>') + "</div>";
    };
    return '<div class="g-wrap"><h1 class="g-q">Eén winkel of twee?</h1><div class="g-ans">' + opts + '</div><p class="g-verdict">' + verdict + "</p>" +
      '<form class="add g-add"><input name="q" placeholder="Zet iets op de lijst — 500 g rundergehakt" autocomplete="off"><button>+ ERBIJ</button></form>' +
      '<div class="g-cols">' + chains.map(col).join("") + "</div>" +
      (neither.length ? '<div class="g-none">Nergens te koop: ' + neither.map((r) => esc(r.item.noun)).join(", ") + "</div>" : "") + "</div>";
  } };

  let folderNextWeek = false;
  V.H = { name: "Folder", render(s) {
    // An Offer on the Product each Chain resolved to. Upcoming ones only when asked.
    const tiles = [];
    for (const r of s.rows) for (const c of chains) {
      const l = r.by[c.id]; if (!l) continue;
      const p = l.p, has = p.offerPriceCents !== null || p.offerWording;
      if (!has || (p.offerUpcoming && !folderNextWeek)) continue;
      const o = r.by[other(c.id).id];
      const price = p.offerPriceCents ?? p.shelfPriceCents;
      tiles.push({ r, c, l, p, o, price });
    }
    const tileHtml = tiles.map(({ r, c, l, p, o, price }) => {
      const cost = l.packs * price;
      const vs = o ? (o.cost > cost ? '<span class="vs good">' + euro(o.cost - cost) + " goedkoper dan " + esc(other(c.id).name) + "</span>"
        : o.cost < cost ? '<span class="vs bad">' + esc(other(c.id).name) + " is nog " + euro(cost - o.cost) + " goedkoper</span>" : '<span class="vs">even duur als ' + esc(other(c.id).name) + "</span>")
        : '<span class="vs">alleen bij ' + esc(c.name) + "</span>";
      return '<div class="h-tile' + (p.offerUpcoming ? " soon" : "") + '"><span class="h-burst">' + (p.offerUpcoming ? "VOLGENDE WEEK · " : "") + esc(p.offerWording || "ACTIE") + "</span>" +
        '<span class="ch">' + esc(c.name) + '</span><span class="n">' + esc(r.item.noun) + "</span>" +
        '<span class="pn">' + esc(p.name) + (p.packaging ? " · " + esc(p.packaging) : "") + "</span>" + vs +
        '<div class="foot"><span class="pr">' + euro(cost) + "</span>" + (p.offerPriceCents && p.offerPriceCents < p.shelfPriceCents ? '<span class="was">' + euro(l.packs * p.shelfPriceCents) + "</span>" : "") + "</div></div>";
    }).join("");
    const rest = s.rows.map((r) => {
      const win = cheapestFor(r);
      return '<div class="h-r"><span class="n">' + esc(r.item.noun) + '<span class="q">' + qtyText(r.item) + "</span></span>" +
        chains.map((c) => { const l = r.by[c.id]; return '<span class="p' + (win === c.id || (!win && l) ? " win" : "") + '"><small>' + esc(c.name) + "</small>" + (l ? euro(l.cost) : "—") + "</span>"; }).join("") +
        '<span class="acts">' + acts(r.item, "vast", "weg") + "</span></div>";
    }).join("");
    const tots = s.totals.map((t) => {
      const best = s.best && s.best.chain.id === t.chain.id;
      return '<div class="h-tot' + (best ? " best" : "") + '"><div class="k">' + esc(t.chain.name) + '</div><div class="v">' + (t.filled < t.total ? "≥" : "") + euro(t.cost) + '</div><div class="s">' + totalsLine(t) + "</div></div>";
    }).join("");
    return '<div class="h-band"><div class="in"><h1>Deze week<br>op jouw lijst<small>' + tiles.length + " aanbieding" + (tiles.length === 1 ? "" : "en") + " bij wat je al koopt</small></h1>" +
      '<div class="h-tots">' + tots + "</div></div></div>" +
      '<div class="h-main"><form class="add h-add"><input name="q" placeholder="Zet iets op de lijst — 500 g rundergehakt" autocomplete="off"><button>+ ERBIJ</button></form>' +
      '<div class="h-sec"><h2>In de aanbieding</h2><span>alleen op producten van je lijst</span><button class="h-toggle" data-act="nextweek" aria-pressed="' + folderNextWeek + '">ook volgende week</button></div>' +
      (tileHtml ? '<div class="h-tiles">' + tileHtml + "</div>" : '<p class="h-empty">Niets op je lijst is deze week in de aanbieding.</p>') +
      '<div class="h-sec"><h2>De rest van je lijst</h2><span>vetgedrukt = goedkoopst</span></div><div class="h-rest">' + rest + "</div></div>";
  } };

  // ════════════════════════════════════════════════════════════════════
  // ROUND 3 — different metaphors
  // ════════════════════════════════════════════════════════════════════
  const choice = {}; // itemId -> chainId the user put it at (I and K share it)
  function chainFor(r) {
    const c = choice[r.item.id];
    if (c && r.by[c]) return c;
    const ls = chains.filter((ch) => r.by[ch.id]).sort((a, b) => r.by[a.id].cost - r.by[b.id].cost);
    return ls.length ? ls[0].id : null;
  }
  const cheapestId = (r) => {
    const ls = chains.filter((ch) => r.by[ch.id]).sort((a, b) => r.by[a.id].cost - r.by[b.id].cost);
    return ls.length ? ls[0].id : null;
  };
  const nameOf = (cid) => chains.find((c) => c.id === cid).name;

  // ── I · Tassen ──
  V.I = { name: "Tassen", render(s) {
    const mode = s.rows.length && s.rows.every((r) => !choice[r.item.id]) ? "cheap"
      : chains.find((c) => s.rows.every((r) => !r.by[c.id] || choice[r.item.id] === c.id))?.id || "mixed";
    const bags = chains.map((c, ci) => {
      const mine = s.rows.filter((r) => chainFor(r) === c.id);
      const total = mine.reduce((n, r) => n + r.by[c.id].cost, 0);
      const toks = mine.sort((a, b) => b.by[c.id].cost - a.by[c.id].cost).map((r) => {
        const l = r.by[c.id], o = other(c.id), ol = r.by[o.id];
        const fs = Math.round(14 + Math.min(12, l.cost / 40));
        const forced = cheapestId(r) !== c.id;
        const meta = !ol ? "alleen bij " + esc(c.name)
          : ol.cost > l.cost ? esc(o.name) + " +" + euro(ol.cost - l.cost)
          : ol.cost < l.cost ? '<span class="move">bij ' + esc(o.name) + " " + euro(l.cost - ol.cost) + " goedkoper</span>" : "even duur";
        return '<button class="tok' + (forced ? " forced" : "") + '" data-act="move" data-id="' + r.item.id + '" title="' + esc(l.p.name) + '" style="font-size:' + fs + 'px">' +
          '<span class="n">' + esc(r.item.noun) + ' <span style="font-weight:600;color:#7a6a58">' + qtyText(r.item) + "</span></span>" +
          '<span class="p">' + euro(l.cost) + '</span><span class="m">' + meta + "</span></button>";
      }).join("");
      return '<section class="bag b' + ci + '"><div class="bh"><span class="nm">' + esc(c.name) + '</span><span class="tt">' + euro(total) + "</span></div>" +
        '<div class="bs">' + mine.length + " artikel" + (mine.length === 1 ? "" : "en") + "</div>" +
        '<div class="toks">' + (toks || '<div class="empty">Leeg — tik een artikel in de andere tas om het hierheen te halen.</div>') + "</div></section>";
    }).join("");
    const nowhere = s.rows.filter((r) => !chainFor(r));
    const split = s.rows.reduce((n, r) => { const c = chainFor(r); return n + (c ? r.by[c].cost : 0); }, 0);
    const used = chains.filter((c) => s.rows.some((r) => chainFor(r) === c.id));
    const sum = used.length > 1 && s.best
      ? "Twee tassen samen <b>" + euro(split) + "</b> · alles in één tas bij " + esc(s.best.chain.name) + " kost " + euro(s.best.cost - split) + " meer"
      : "Alles in één tas: <b>" + euro(split) + "</b>";
    return '<div class="i-wrap"><div class="i-head"><div><h1>Wat gaat in welke tas?</h1><p>Elk artikel ligt in de tas van de winkel waar het het goedkoopst is.</p></div>' +
      '<form class="add i-add"><input name="q" placeholder="500 g rundergehakt" autocomplete="off"><button>Erbij</button></form></div>' +
      '<div class="i-modes"><button data-act="mode" data-id="cheap" aria-pressed="' + (mode === "cheap") + '">Goedkoopst per artikel</button>' +
      chains.map((c) => '<button data-act="mode" data-id="' + c.id + '" aria-pressed="' + (mode === c.id) + '">Alles bij ' + esc(c.name) + "</button>").join("") + "</div>" +
      '<div class="i-bags">' + bags + "</div>" +
      (nowhere.length ? '<div class="i-tray">Past in geen tas: ' + nowhere.map((r) => esc(r.item.noun)).join(", ") + "</div>" : "") +
      '<p class="i-sum">' + sum + '</p><p class="i-hint">Tik op een artikel om het naar de andere tas te verplaatsen. Gestippeld = niet de goedkoopste keus.</p></div>';
  } };

  // ── J · Vertrekbord ──
  const jPrev = {};
  const W = { item: 13, qty: 6, price: 6, adv: 6 };
  const flaps = (text, n, cls = "") => {
    // Spaces stay as tiles (a board has no gaps), drawn blank.
    const t = (text + " ".repeat(n)).slice(0, n).toUpperCase();
    return '<span class="j-cell ' + cls + '">' + [...t].map((ch, i) =>
      '<span class="fl' + (ch === " " ? " sp" : "") + '" style="--i:' + i + '">' + (ch === " " ? "·" : esc(ch)) + "</span>").join("") + "</span>";
  };
  const money = (c) => (c / 100).toFixed(2).replace(".", ",");
  V.J = { name: "Vertrekbord", render(s) {
    const head = '<div class="j-row j-hd">' + [["ARTIKEL", W.item], ["AANTAL", W.qty], ...chains.map((c) => [c.name.toUpperCase(), W.price]), ["ADVIES", W.adv]]
      .map(([t, n]) => '<span' + (t === "AANTAL" ? ' class="j-q"' : "") + ' style="width:calc(var(--f) * .82 * ' + n + " + " + (n - 1) * 2 + 'px)">' + t + "</span>").join("") + "</div>";
    const rows = s.rows.map((r) => {
      const win = cheapestFor(r), cheapest = cheapestId(r);
      const cells = [flaps(r.item.noun, W.item), flaps(qtyText(r.item).replace("×", "X"), W.qty, "dim j-q"),
        ...chains.map((c) => r.by[c.id] ? flaps(money(r.by[c.id].cost).padStart(W.price), W.price, win === c.id ? "win" : "")
          : flaps("  --  ", W.price, "dim")),
        flaps(cheapest ? (win || !r.by[other(cheapest).id] ? nameOf(cheapest) : "GELIJK") : "GEEN", W.adv, "adv" + (cheapest ? "" : " none"))];
      const key = r.item.id, txt = r.item.noun + "|" + chains.map((c) => r.by[c.id]?.cost).join("|");
      const flip = jPrev[key] !== txt; jPrev[key] = txt;
      return '<div class="j-row' + (flip ? " flip" : "") + '">' + cells.join("") + '<button class="j-x" data-act="remove" data-id="' + r.item.id + '" aria-label="Weg">✕</button></div>';
    }).join("");
    const totTxt = s.totals.map((t) => t.cost).join("|");
    const flipT = jPrev.__tot !== totTxt; jPrev.__tot = totTxt;
    const tot = '<div class="j-row j-tot' + (flipT ? " flip" : "") + '">' + flaps("TOTAAL", W.item) + flaps("", W.qty, "j-q") +
      s.totals.map((t) => flaps(money(t.cost).padStart(W.price), W.price, s.best && s.best.chain.id === t.chain.id ? "win" : "")).join("") +
      flaps(s.best ? s.best.chain.name : "?", W.adv, "adv" + (s.best ? "" : " none")) + "</div>";
    const d = new Date(chains[0].observedAt + "T12:00:00").toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" });
    return '<div class="j-board"><div class="j-top"><h1>BOODSCHAPPEN</h1><span>PRIJZEN ' + esc(d.toUpperCase()) + "</span></div>" + head + rows + tot +
      '<form class="add j-add"><input name="q" placeholder="typ om toe te voegen · 500 g gehakt" autocomplete="off"><button>OK</button></form></div>' +
      '<p class="j-note">Geel = goedkoopst voor dat artikel. Advies = waar je het haalt.</p>';
  } };

  // ── K · Eén voor één ──
  let kIdx = 0;
  V.K = { name: "Eén voor één", render(s) {
    if (!s.rows.length) return '<div class="k-item"><h1>Lege lijst</h1><form class="add k-add"><input name="q" placeholder="Wat moet er in huis komen?" autocomplete="off"><button>Erbij</button></form></div>';
    kIdx = Math.max(0, Math.min(kIdx, s.rows.length - 1));
    const r = s.rows[kIdx], at = chainFor(r), cheapest = cheapestId(r);
    const sides = chains.map((c, ci) => {
      const l = r.by[c.id];
      if (!l) return '<div class="k-side s' + ci + ' none"><span class="ch">' + esc(c.name) + '</span><span class="pn">Niet te koop bij ' + esc(c.name) + "</span></div>";
      const o = r.by[other(c.id).id];
      const flags = [l.offer ? '<span class="o">' + esc(l.offer) + "</span>" : "", l.over >= 2 ? "<span>pak is " + Math.round(l.over * 10) / 10 + "× wat je nodig hebt</span>" : "",
        l.packs > 1 ? "<span>" + l.packs + " stuks pakken</span>" : ""].join("");
      return '<button class="k-side s' + ci + (at === c.id ? " on" : "") + '" data-act="choose" data-id="' + c.id + '">' +
        (cheapest === c.id && o && o.cost > l.cost ? '<span class="cheaper">' + euro(o.cost - l.cost) + " goedkoper</span>" : "") +
        '<span class="ch">' + esc(c.name) + '</span><span class="pay">' + euro(l.cost) + '</span><span class="pn">' + esc(l.p.name) + "</span>" +
        '<span class="meta">' + [l.p.packaging ? esc(l.p.packaging) : "", euro(l.p.unitPriceCents) + per[l.p.comparisonUnit]].filter(Boolean).join(" · ") + "</span>" +
        '<span class="flags">' + flags + '</span><span class="pick"><i>' + (at === c.id ? "✓" : "") + "</i>" + (at === c.id ? "Hier halen" : "Hier halen?") + "</span></button>";
    }).join("");
    const sums = chains.map((c) => {
      const mine = s.rows.filter((x) => chainFor(x) === c.id);
      return esc(c.name) + " " + mine.length + "× · " + euro(mine.reduce((n, x) => n + x.by[c.id].cost, 0));
    }).join(" &nbsp;·&nbsp; ");
    const total = s.rows.reduce((n, x) => { const c = chainFor(x); return n + (c ? x.by[c].cost : 0); }, 0);
    const chips = s.rows.map((x, i) => {
      const c = chainFor(x), ci = chains.findIndex((ch) => ch.id === c);
      return '<button class="' + (c ? "c" + ci : "cn") + (i === kIdx ? " cur" : "") + '" data-act="jump" data-id="' + i + '">' + esc(x.item.noun) + "</button>";
    }).join("");
    return '<div class="k-top"><span class="count">Artikel ' + (kIdx + 1) + " van " + s.rows.length + '</span><span class="nav">' +
      '<button data-act="kprev" aria-label="Vorige"' + (kIdx === 0 ? " disabled" : "") + ">‹</button>" +
      '<button data-act="knext" aria-label="Volgende"' + (kIdx === s.rows.length - 1 ? " disabled" : "") + ">›</button></span></div>" +
      '<div class="k-item"><h1>' + esc(r.item.noun) + '</h1><div class="q">' + qtyText(r.item) +
      '<span class="acts">' + acts(r.item, "vaste boodschap", "van de lijst") + "</span></div></div>" +
      '<div class="k-split">' + sides + "</div>" +
      '<div class="k-strip"><div class="sum"><span>' + sums + "</span><span>Samen <b>" + euro(total) + "</b></span></div>" +
      '<div class="k-chips">' + chips + "</div>" +
      '<form class="add k-add"><input name="q" placeholder="Iets vergeten? 500 g rundergehakt" autocomplete="off"><button>Erbij</button></form></div>';
  } };

  // ── L · Plattegrond ──
  const DEPTS = [
    { id: "agf", name: "Groente & fruit", c: "#3f8f4e", area: "1 / 2", keys: ["aardappel", "champignon", "courgette", "broccoli", "komkommer", "uien", "ui", "wortel", "spinazie", "tomat", "appel", "banaan", "sla", "paprika", "prei", "peer", "citroen"] },
    { id: "brood", name: "Brood", c: "#c08a2e", area: "1 / 3", keys: ["brood", "croissant", "beschuit"] },
    { id: "houd", name: "Houdbaar", c: "#7a5bb0", area: "2 / 3", keys: ["pindakaas", "rijst", "pasta", "saus", "olie", "koffie", "thee", "hagelslag", "jam", "soep", "bonen"] },
    { id: "zuivel", name: "Zuivel & eieren", c: "#3b6fb6", area: "2 / 2", keys: ["melk", "eier", "ei", "kaas", "yoghurt", "boter", "room", "vla", "kwark"] },
    { id: "vlees", name: "Vlees & vis", c: "#b33a2c", area: "2 / 1", keys: ["gehakt", "kip", "vlees", "worst", "vis", "zalm", "spek", "biefstuk", "ham"] },
    { id: "diep", name: "Diepvries", c: "#2aa3b8", area: "3 / 1", keys: ["diepvries", "ijs", "friet"] },
    { id: "rest", name: "Overig", c: "#6b7780", area: "3 / 2", keys: [] },
  ];
  const deptOf = (item) => {
    const ws = item.noun.toLowerCase().split(/[^\p{L}]+/u);
    return DEPTS.find((d) => d.keys.some((k) => ws.some((w) => w === k || (k.length > 2 && (w.startsWith(k) || w.endsWith(k)))))) || DEPTS[DEPTS.length - 1];
  };
  let lChain = null;
  V.L = { name: "Plattegrond", render(s) {
    if (!lChain) lChain = (s.best || s.totals.slice().sort((a, b) => b.filled - a.filled || a.cost - b.cost)[0]).chain.id;
    const seg = s.totals.map((t) => '<button data-act="lchain" data-id="' + t.chain.id + '" aria-pressed="' + (t.chain.id === lChain) + '"><span class="k">' +
      esc(t.chain.name) + (s.best && s.best.chain.id === t.chain.id ? " · goedkoopst" : "") + '</span><span class="v">' + (t.filled < t.total ? "≥" : "") + euro(t.cost) + "</span></button>").join("");
    let n = 0;
    const byDept = DEPTS.map((d) => ({ d, rows: s.rows.filter((r) => deptOf(r.item) === d).map((r) => ({ r, no: 0 })) }));
    for (const g of byDept) for (const x of g.rows) x.no = ++n;
    const tiles = byDept.map(({ d, rows }) => '<div class="dept' + (rows.length ? " has" : "") + '" data-dept="' + d.id + '" style="--c:' + d.c + ";grid-area:" + d.area + '">' +
      '<div class="dn"><i></i>' + d.name + '</div><div class="pins">' + rows.map(({ r, no }) => '<span class="pin' + (r.by[lChain] ? "" : " miss") + '" title="' + esc(r.item.noun) + '">' + no + "</span>").join("") + "</div></div>").join("") +
      '<div class="dept door" data-dept="door" style="grid-area:1 / 1">INGANG</div><div class="dept till" data-dept="till" style="grid-area:3 / 3">KASSA</div>';
    const here = nameOf(lChain), there = other(lChain);
    const list = byDept.filter((g) => g.rows.length).map(({ d, rows }) => '<div class="l-sec" style="--c:' + d.c + '">' + d.name + "</div>" + rows.map(({ r, no }) => {
      const l = r.by[lChain], o = r.by[there.id];
      const alt = o ? '<span class="alt' + (!l || o.cost < l.cost ? " cheaper" : "") + '">' + esc(there.name) + " " + euro(o.cost) + "</span>" : '<span class="alt"></span>';
      return '<div class="l-it" style="--c:' + d.c + '"><span class="pin' + (l ? "" : " miss") + '">' + no + '</span><span class="n">' + esc(r.item.noun) + '<span class="q">' + qtyText(r.item) + "</span></span>" +
        '<span class="p">' + (l ? euro(l.cost) : "—") + '</span><span class="pn">' + (l ? esc(l.p.name) + (l.offer ? " · " + esc(l.offer) : "") : "niet bij " + esc(here)) + "</span>" + alt +
        '<span class="acts">' + acts(r.item, "vast", "weg") + "</span></div>";
    }).join("")).join("");
    return '<div class="l-wrap"><div class="l-head"><h1>Jouw route door de winkel<small>Genummerd in looproute. Rood omrand = hier niet te koop.</small></h1><div class="l-seg">' + seg + "</div></div>" +
      '<div class="l-body"><div><div class="l-plan"><svg id="route"></svg><div class="l-grid">' + tiles + "</div></div>" +
      '<form class="add l-add"><input name="q" placeholder="500 g rundergehakt" autocomplete="off"><button>Erbij</button></form></div>' +
      '<div class="l-list">' + (list || '<p style="padding:14px 16px">Lege lijst.</p>') + "</div></div></div>";
  }, after() {
    // Dashed walking route through the department centres.
    const plan = root.querySelector(".l-plan"), svg = root.querySelector("#route");
    if (!plan || !svg) return;
    const box = plan.getBoundingClientRect();
    const pts = ["door", "agf", "brood", "houd", "zuivel", "vlees", "diep", "rest", "till"].map((id) => {
      const r = plan.querySelector('[data-dept="' + id + '"]').getBoundingClientRect();
      return (r.left + r.width / 2 - box.left) + "," + (r.top + r.height / 2 - box.top);
    });
    svg.setAttribute("viewBox", "0 0 " + box.width + " " + box.height);
    svg.innerHTML = '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#182026" stroke-width="4" stroke-dasharray="1 10" stroke-linecap="round" opacity=".6"/>';
  } };

  // ── Wiring ──
  // Round 3 is what the bar cycles, with B as the reference; earlier rounds stay reachable by ?variant=.
  const keys = ["B", "I", "J", "K", "L"];
  const root = document.getElementById("root");
  let current = new URLSearchParams(location.search).get("variant");
  if (!V[current]) current = "B";

  function render() {
    document.body.dataset.v = current;
    document.getElementById("vlabel").textContent = current + " · " + V[current].name;
    const focused = document.activeElement && document.activeElement.name === "q";
    root.innerHTML = V[current].render(snapshot());
    V[current].after?.();
    if (focused) root.querySelector("input[name=q]")?.focus();
  }
  function go(step) {
    current = keys[(keys.indexOf(current) + step + keys.length) % keys.length];
    const u = new URL(location.href); u.searchParams.set("variant", current);
    try { history.replaceState(null, "", u); } catch { /* file:// in some browsers */ }
    render();
  }
  document.getElementById("prev").onclick = () => go(-1);
  document.getElementById("next").onclick = () => go(1);
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea, [contenteditable]")) return;
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
  });

  root.addEventListener("submit", (e) => {
    e.preventDefault();
    const input = e.target.querySelector("input[name=q]");
    const parsed = parse(input.value);
    if (!parsed) { input.value = ""; input.placeholder = "Niet gelezen — probeer “500 g rundergehakt”"; return; }
    list.push({ id: "i" + nid++, staple: false, ...parsed });
    input.value = "";
    render();
  });
  root.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id, item = list.find((i) => i.id === id);
    switch (b.dataset.act) {
      case "remove": list = list.filter((i) => i.id !== id); done.delete(id); break;
      case "staple": if (item) item.staple = !item.staple; break;
      case "tick": done.has(id) ? done.delete(id) : done.add(id); break;
      case "shop": shopAt = id; break;
      case "sort": sortBySaving = !sortBySaving; break;
      case "nextweek": folderNextWeek = !folderNextWeek; break;
      case "move": {
        const r = snapshot().rows.find((x) => x.item.id === id), to = r && other(chainFor(r));
        if (to && r.by[to.id]) choice[id] = to.id;
        break;
      }
      case "mode":
        for (const i of list) { if (id === "cheap") delete choice[i.id]; else choice[i.id] = id; }
        break;
      case "choose": choice[list[kIdx].id] = id; break;
      case "jump": kIdx = Number(id); break;
      case "kprev": kIdx--; break;
      case "knext": kIdx++; break;
      case "lchain": lChain = id; break;
      case "finish": list = list.filter((i) => i.staple || !done.has(i.id)); done.clear(); break;
    }
    render();
  });

  render();
</script>
