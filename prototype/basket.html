<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mealdeal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
  /* ── Tokens ───────────────────────────────────────────────────────────
     Kraft is the light theme and the base. Donker, the dark one, redefines
     only tokens: behind prefers-color-scheme (unless the page is set to
     light) and behind data-theme="dark" (when it is set to dark). No
     component reads a literal colour, so both themes come for free.
     Chain colours are ours, never a chain's brand colours. */
  :root {
    color-scheme: light;
    --paper: #f3e7d6; --paper-2: #ead9c1; --card: #fffaf2;
    --ink: #2b2118; --ink-2: #6b5a48; --ink-3: #9a8771; --line: #dcc8ab; --on-ink: #f3e7d6;
    --good: #2f7a3f; --good-wash: #d9ecd9; --bad: #b8432f; --bad-wash: #f6dcd4;
    --offer: #ffe9a3; --offer-ink: #2b2118; --scrim: rgba(30, 20, 10, .45);
    --bag-shade: rgba(0, 0, 0, .12); --lift: 0 14px 24px -16px rgba(60, 30, 0, .6);
    --c0: #2f6b57; --c1: #8a3b5c; --c2: #3b6aa0; --c3: #c0772b; --c4: #5b4a9e; --c5: #2b8a8a; --c6: #7a6a2a; --c7: #a8452f;
    --r: 16px;
    --font: Nunito, ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #1c1611; --paper-2: #2b2219; --card: #29211a;
      --ink: #f3e7d6; --ink-2: #cdbba4; --ink-3: #917f6b; --line: #3e3328; --on-ink: #1c1611;
      --good: #72c28e; --good-wash: rgba(114, 194, 142, .16); --bad: #f08c75; --bad-wash: rgba(240, 140, 117, .16);
      --offer: rgba(255, 214, 102, .18); --offer-ink: #ffd666; --scrim: rgba(0, 0, 0, .6);
      --bag-shade: rgba(0, 0, 0, .22); --lift: 0 14px 26px -14px rgba(0, 0, 0, .7);
      --c0: #3f8f71; --c1: #b4557c; --c2: #4f80bd; --c3: #c4853a; --c4: #7b68bd; --c5: #3a9a99; --c6: #a08a3a; --c7: #c0604a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #1c1611; --paper-2: #2b2219; --card: #29211a;
    --ink: #f3e7d6; --ink-2: #cdbba4; --ink-3: #917f6b; --line: #3e3328; --on-ink: #1c1611;
    --good: #72c28e; --good-wash: rgba(114, 194, 142, .16); --bad: #f08c75; --bad-wash: rgba(240, 140, 117, .16);
    --offer: rgba(255, 214, 102, .18); --offer-ink: #ffd666; --scrim: rgba(0, 0, 0, .6);
    --bag-shade: rgba(0, 0, 0, .22); --lift: 0 14px 26px -14px rgba(0, 0, 0, .7);
    --c0: #3f8f71; --c1: #b4557c; --c2: #4f80bd; --c3: #c4853a; --c4: #7b68bd; --c5: #3a9a99; --c6: #a08a3a; --c7: #c0604a;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; }
  body.locked { overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* ── Shell: top tabs on a desktop, a bottom bar on a phone ─────────── */
  .top { max-width: 1080px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px 0; display: flex; align-items: center; gap: 18px; }
  .brand { font-weight: 900; font-size: 24px; letter-spacing: -.02em; }
  .brand i { display: inline-block; width: 22px; height: 18px; margin-right: 6px; vertical-align: -2px; background: var(--ink); border-radius: 3px 3px 7px 7px; position: relative; }
  .brand i::before { content: ""; position: absolute; left: 5px; right: 5px; top: -7px; height: 9px; border: 2.5px solid var(--ink); border-bottom: 0; border-radius: 8px 8px 0 0; }
  .tabs { display: flex; gap: 4px; background: var(--paper-2); border-radius: 999px; padding: 4px; }
  .tabs button { border: 0; background: transparent; border-radius: 999px; padding: 8px 16px; font-weight: 800; cursor: pointer; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
  .tabs button[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
  .tabs .n { font-size: 12px; background: var(--bag-shade); border-radius: 999px; padding: 1px 7px; }
  .tabs .ic { display: none; }
  .theme { margin-left: auto; border: 0; background: var(--paper-2); color: var(--ink-2); border-radius: 999px; height: 38px; padding: 0 14px; font-weight: 800; cursor: pointer; }
  main { max-width: 1080px; margin: 0 auto; padding: 18px 16px 120px; }
  h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 900; letter-spacing: -.025em; line-height: 1.02; margin: 4px 0 6px; }
  .lede { color: var(--ink-2); margin: 0 0 18px; }
  .note { color: var(--ink-3); font-size: 13px; margin: 22px 0 0; }
  @media (max-width: 720px) {
    .top .tabs { display: none; }
    .tabs.bottom {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; border-radius: 0; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      background: var(--card); box-shadow: 0 -1px 0 var(--line), 0 -8px 24px rgba(0, 0, 0, .1); justify-content: space-around;
    }
    .tabs.bottom button { flex: 1; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 12.5px; border-radius: 12px; }
    .tabs.bottom .ic { display: block; font-size: 20px; line-height: 1; }
  }
  @media (min-width: 721px) { .tabs.bottom { display: none; } }

  /* ── Shared pieces ────────────────────────────────────────────────── */
  .ct { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; white-space: nowrap; }
  .ct::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
  .delta { font-weight: 800; font-size: 14px; border-radius: 999px; padding: 2px 9px; background: var(--bad-wash); color: var(--bad); white-space: nowrap; }
  .delta.zero { background: var(--good-wash); color: var(--good); }
  .o { background: var(--offer); color: var(--offer-ink); border-radius: 6px; padding: 0 6px; font-weight: 800; }
  .add { display: flex; background: var(--card); border-radius: 999px; padding: 5px; box-shadow: 0 2px 0 var(--line); }
  .add input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 16px; font-size: 17px; font-weight: 700; outline: none; }
  .add button { border: 0; background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 0 20px; font-weight: 800; cursor: pointer; }
  .hint { color: var(--ink-3); font-size: 14px; margin: 8px 4px 0; min-height: 1.4em; }
  .hint.warn { color: var(--bad); font-weight: 700; }
  .sec { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 26px 0 10px; }
  .sec h2 { margin: 0; font-size: 20px; font-weight: 900; }
  .sec span { color: var(--ink-3); font-size: 14px; font-weight: 700; }
  .btn { border: 0; background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 10px 16px; font-weight: 900; cursor: pointer; }
  .btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 2px currentColor; }

  /* The price line: one dot per chain, placed by what the item costs there. */
  .pl { position: relative; height: 26px; margin: 0 10px; }
  .pl::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 3px; border-radius: 3px; background: var(--line); }
  .pl .dot { position: absolute; top: 6px; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2.5px var(--card); }
  .pl .dot.min { width: 19px; height: 19px; top: 4px; margin-left: -9.5px; box-shadow: 0 0 0 2.5px var(--card), 0 0 0 4.5px var(--ink); }
  .pl.mini { height: 14px; margin: 0 6px; }
  .pl.mini::before { top: 6px; height: 2px; }
  .pl.mini .dot { top: 3px; width: 9px; height: 9px; margin-left: -4.5px; box-shadow: 0 0 0 1.5px var(--card); }
  .pl.mini .dot.min { width: 11px; height: 11px; top: 2px; margin-left: -5.5px; box-shadow: 0 0 0 1.5px var(--card), 0 0 0 3px var(--ink); }
  .pl-ends { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--ink-2); }
  .pl-ends .lo { color: var(--good); }

  /* A bag: the chain's colour, a handle, white text. Recipe cards borrow the handle. */
  .bag { position: relative; background: var(--c); color: #fff; border-radius: 10px 10px 22px 22px; box-shadow: inset 0 -8px 0 var(--bag-shade), var(--lift); }
  .bag::before { content: ""; position: absolute; left: 50%; top: -22px; width: 40%; max-width: 200px; height: 30px; transform: translateX(-50%); border: 7px solid var(--c); border-bottom: 0; border-radius: 40px 40px 0 0; }

  /* ── Lijst ────────────────────────────────────────────────────────── */
  .banner { margin: 0 0 14px; background: var(--card); border-radius: var(--r); padding: 12px 14px; box-shadow: 0 2px 0 var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .banner b { font-weight: 900; }
  .banner .btn { background: var(--good); color: var(--on-ink); }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .it { background: var(--card); border-radius: var(--r); padding: 12px 14px 10px; box-shadow: 0 2px 0 var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .it .nm { font-weight: 900; font-size: 18px; line-height: 1.15; }
  .it .q { border: 0; background: var(--paper-2); color: var(--ink-2); border-radius: 8px; padding: 1px 7px; margin-left: 6px; font-weight: 800; font-size: 14px; cursor: pointer; }
  .it .q:hover { color: var(--ink); }
  .it .ops { display: flex; gap: 2px; align-items: start; }
  .it .ops button { border: 0; background: transparent; border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; color: var(--ink-3); }
  .it .ops button:hover { background: var(--paper); color: var(--ink); }
  .it .ops button[aria-pressed="true"] { color: var(--ink); background: var(--paper-2); }
  .it .guess { grid-column: 1 / -1; font-size: 13px; color: var(--bad); font-weight: 700; }
  .it .best { grid-column: 1 / -1; font-size: 14px; color: var(--ink-2); font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .it .best b { color: var(--ink); font-weight: 900; }
  .it .best .none { color: var(--bad); font-weight: 800; }
  .it .pl { grid-column: 1 / -1; margin-top: 4px; }
  .foot {
    margin-top: 22px; background: var(--ink); color: var(--on-ink); border-radius: var(--r); padding: 14px 16px;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
  }
  .foot b { font-size: 22px; font-weight: 900; }
  .foot .btn { background: var(--on-ink); color: var(--ink); }
  .foot .btn.ghost { background: transparent; color: var(--on-ink); }

  /* ── Vergelijk ────────────────────────────────────────────────────── */
  .rack { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 30px 14px; margin-top: 34px; }
  .bagc { border: 0; text-align: left; cursor: pointer; padding: 18px 16px 14px; display: grid; gap: 4px; }
  .bagc .rank { position: absolute; top: 12px; right: 14px; font-weight: 900; font-size: 13px; background: rgba(255,255,255,.22); border-radius: 999px; padding: 2px 9px; }
  .bagc .nm { font-weight: 900; font-size: 19px; padding-right: 40px; }
  .bagc .tt { font-weight: 900; font-size: 34px; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .bagc .tt small { font-size: 18px; opacity: .85; margin-right: 2px; }
  .bagc .df { justify-self: start; font-weight: 900; font-size: 15px; background: #fff; color: #b8432f; border-radius: 999px; padding: 2px 10px; }
  .bagc .df.zero { color: #2f7a3f; }
  .bagc .cov { display: flex; gap: 2px; margin-top: 8px; }
  .bagc .cov i { flex: 1; height: 6px; border-radius: 2px; background: rgba(255,255,255,.85); }
  .bagc .cov i.miss { background: rgba(0,0,0,.28); }
  .bagc .cv { font-size: 13px; font-weight: 700; opacity: .9; }
  .bagc .pick { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
  .bagc .pick i { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid #fff; display: grid; place-items: center; font-style: normal; font-size: 13px; }
  .bagc[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 4px; }
  .bagc[aria-pressed="true"] .pick i { background: #fff; color: #2b2118; }
  .bagc.combo { background: linear-gradient(90deg, var(--c1x) 0 50%, var(--c2x) 50% 100%); }
  .bagc.combo::before { border-color: var(--ink); }
  @media (max-width: 720px) {
    .rack { grid-template-columns: 1fr; gap: 26px; }
    .bagc { grid-template-columns: 1fr auto; align-items: center; padding: 14px 14px 12px; }
    .bagc .nm { grid-column: 1; padding-right: 0; } .bagc .tt { grid-column: 2; grid-row: 1 / 3; text-align: right; font-size: 30px; }
    .bagc .df { grid-column: 1; } .bagc .cov, .bagc .cv, .bagc .pick { grid-column: 1 / -1; }
    .bagc .rank { display: none; }
  }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink-2); margin: 6px 0 12px; }
  .diffs { display: grid; gap: 8px; }
  .df-row { background: var(--card); border-radius: var(--r); box-shadow: 0 2px 0 var(--line); }
  .df-row > button { width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; padding: 12px 14px 10px; display: grid; grid-template-columns: minmax(130px, 220px) 1fr auto; gap: 4px 16px; align-items: center; }
  .df-row .nm { font-weight: 900; font-size: 17px; line-height: 1.15; }
  .df-row .nm .q { display: block; font-weight: 700; color: var(--ink-3); font-size: 14px; }
  .df-row .spread { font-weight: 900; font-size: 15px; text-align: right; white-space: nowrap; }
  .df-row .spread small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 700; }
  .df-row .open { border-top: 1px dashed var(--line); padding: 8px 14px 12px; display: grid; gap: 6px; }
  .df-row .pr { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 10px; align-items: center; font-size: 15px; }
  .df-row .pr .pn { color: var(--ink-2); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .df-row .pr .v { font-weight: 900; font-variant-numeric: tabular-nums; text-align: right; }
  .df-row .pr .fix { border: 0; background: transparent; color: var(--ink-2); text-decoration: underline; font-weight: 800; font-size: 13px; cursor: pointer; padding: 0; }
  @media (max-width: 720px) {
    .df-row > button { grid-template-columns: 1fr auto; }
    .df-row > button .plw { grid-column: 1 / -1; grid-row: 2; }
    .df-row .pr { grid-template-columns: auto 1fr auto auto; } .df-row .pr .pn { grid-column: 1 / -1; grid-row: 2; }
  }

  /* ── Winkelen ─────────────────────────────────────────────────────── */
  .plan { background: var(--ink); color: var(--on-ink); border-radius: var(--r); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; }
  .plan b { font-size: 20px; font-weight: 900; }
  .plan button { border: 0; background: transparent; color: var(--on-ink); text-decoration: underline; font-weight: 800; cursor: pointer; padding: 0; }
  .shop { margin-top: 40px; padding: 16px 12px 12px; }
  .shop > header { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px 10px; gap: 10px; }
  .shop > header b { font-size: 22px; font-weight: 900; }
  .shop > header span { font-weight: 800; }
  .chk { display: grid; gap: 6px; }
  .ci { background: var(--card); color: var(--ink); border-radius: 12px; display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 0 10px; padding: 10px 12px 10px 6px; cursor: pointer; border: 0; text-align: left; width: 100%; }
  .ci .tick { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--ink); justify-self: center; display: grid; place-items: center; font-weight: 900; }
  .ci .nm { font-weight: 900; font-size: 17px; line-height: 1.15; }
  .ci .nm .q { font-weight: 700; color: var(--ink-3); font-size: 15px; margin-left: 4px; }
  .ci .g { grid-column: 2; font-size: 14px; color: var(--ink-2); font-weight: 600; }
  .ci .g .w { color: var(--bad); font-weight: 800; }
  .ci .v { grid-column: 3; grid-row: 1 / 3; font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; }
  .ci.done { opacity: .5; }
  .ci.done .tick { background: var(--ink); color: var(--card); }
  .ci.done .nm { text-decoration: line-through 2.5px; }
  .missing { margin-top: 18px; border: 2px dashed var(--bad); color: var(--bad); border-radius: var(--r); padding: 12px 14px; font-weight: 800; }
  .progress {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 30;
    width: min(560px, calc(100% - 24px)); background: var(--card); border-radius: 999px; padding: 8px 8px 8px 18px; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0, 0, 0, .25);
    display: flex; align-items: center; gap: 12px;
  }
  .progress .bar { flex: 1; height: 8px; border-radius: 99px; background: var(--paper-2); overflow: hidden; }
  .progress .bar i { display: block; height: 100%; background: var(--good); }
  .progress b { font-weight: 900; font-variant-numeric: tabular-nums; }
  @media (max-width: 720px) { .progress { bottom: calc(76px + env(safe-area-inset-bottom)); } }

  /* ── Recepten ─────────────────────────────────────────────────────── */
  .deals { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px; }
  .deal { flex: none; background: var(--card); border-radius: 12px; padding: 8px 12px; box-shadow: 0 2px 0 var(--line); display: grid; gap: 1px; min-width: 150px; }
  .deal .n { font-weight: 800; font-size: 15px; }
  .deal .v { font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; }
  .deal .w { font-size: 13px; font-weight: 700; color: var(--good); }
  .was { font-size: 13px; color: var(--ink-3); text-decoration: line-through; margin-left: 4px; font-weight: 600; }
  .recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px 16px; margin-top: 34px; }
  .rc { position: relative; background: var(--card); border-radius: 10px 10px 20px 20px; box-shadow: 0 2px 0 var(--line), var(--lift); display: flex; flex-direction: column; }
  .rc::before { content: ""; position: absolute; left: 50%; top: -22px; width: 38%; height: 30px; transform: translateX(-50%); border: 7px solid var(--line); border-bottom: 0; border-radius: 40px 40px 0 0; }
  .rc .hd { padding: 16px 16px 10px; border-bottom: 1px dashed var(--line); cursor: pointer; border-radius: 10px 10px 0 0; }
  .rc .hd:hover h3 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .ex { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); border: 1.5px dashed var(--ink-3); border-radius: 6px; padding: 0 6px; }
  .rc h3 { margin: 8px 0 2px; font-size: 21px; font-weight: 900; line-height: 1.15; letter-spacing: -.01em; }
  .rc .meta { color: var(--ink-2); font-size: 14px; font-weight: 600; }
  .rc .save { margin: 10px 0 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .rc .save b { background: var(--good); color: var(--on-ink); border-radius: 999px; padding: 3px 11px; font-size: 16px; font-weight: 900; }
  .rc .save span { font-size: 14px; color: var(--ink-2); font-weight: 700; }
  .rc .more { display: inline-flex; margin-top: 8px; font-size: 14px; font-weight: 800; color: var(--ink-2); }
  .rc ul { list-style: none; margin: 0; padding: 8px 16px; display: grid; gap: 6px; flex: 1; }
  .rc li, .rd .ing li { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: baseline; }
  .rc li .l, .rd .ing li .l { font-weight: 700; }
  .rc li .p, .rd .ing li .p { font-weight: 800; font-variant-numeric: tabular-nums; }
  .rc li .d, .rd .ing li .d { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); }
  .rc li.miss .p { color: var(--bad); }
  .rc .ft { padding: 10px 16px 14px; border-top: 1px dashed var(--line); display: grid; gap: 10px; }
  .chains { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink-2); }
  .chains .best { color: var(--ink); }
  .btn.on { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  @media (max-width: 720px) { .recipes { grid-template-columns: 1fr; } }

  /* ── Sheets: recipe method and corrections. A panel on a desktop, full screen on a phone. ── */
  .scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); }

<script src="catalogue.js"></script>
<script>
  if (!window.CATALOGUE) {
    document.getElementById("main").innerHTML =
      "<h1>Geen prijzen geladen</h1><p class=\"lede\">Run <code>node scripts/catalogue-from-db.ts</code>, " +
      "which writes <code>prototype/catalogue.js</code> next to this page, then reload.</p>";
    throw new Error("catalogue.js missing");
  }
  const data = window.CATALOGUE;

  const euro = (cents) => "€" + (cents / 100).toFixed(2).replace(".", ",");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  // ── Storage: this browser only; the page works without it ─────────────
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private window: session only */ }
  }

  // ── Chains: one colour slot each, defined per theme in CSS ────────────
  const chains = data.chains.map((c, i) => ({ ...c, color: "var(--c" + (i % 8) + ")" }));
  const chainById = (id) => chains.find((c) => c.id === id);
  const tag = (c) => '<span class="ct" style="--c:' + c.color + '">' + esc(c.name) + "</span>";

  // ── Catalogue: positional rows, unpacked once ─────────────────────────
  // Row: [ref, name, packaging, packQuantity, packUnit, unit, shelf, offerPrice, unitPrice, wording, upcoming]
  function stem(w) {
    // Repeated, so singular and plural meet: courgettes -> courgette -> courgett.
    let before;
    do { before = w; if (w.length > 4) w = w.replace(/(jes|je|en|e|s)$/, ""); } while (w !== before);
    return w;
  }
  const products = {}, searchable = {};
  for (const c of chains) {
    products[c.id] = {};
    searchable[c.id] = data.catalogue[c.id].map((r) => {
      const id = c.id + "-" + r[0];
      products[c.id][id] = {
        id, name: r[1], packaging: r[2], packQuantity: r[3], packUnit: r[4], comparisonUnit: r[5],
        shelfPriceCents: r[6], offerPriceCents: r[7], unitPriceCents: r[8], offerWording: r[9], offerUpcoming: r[10] === 1,
      };
      return { id, unit: r[5], words: r[1].toLowerCase().split(/[^\p{L}]+/u).filter(Boolean).map(stem) };
    });
  }

  // ── Reading what was typed ────────────────────────────────────────────
  const UNITS = {
    g: ["kg", 0.001], gr: ["kg", 0.001], gram: ["kg", 0.001], kg: ["kg", 1], kilo: ["kg", 1],
    ml: ["l", 0.001], cl: ["l", 0.01], l: ["l", 1], liter: ["l", 1], litre: ["l", 1],
    x: ["piece", 1], "×": ["piece", 1], st: ["piece", 1], stuk: ["piece", 1], stuks: ["piece", 1],
  };
  const wordsOf = (noun) => noun.toLowerCase().split(/[^\p{L}]+/u).filter((w) => w.length > 1).map(stem);

  /**
   * Every typed word must END some word of the name. A Dutch compound names
   * its kind last: koffiemelk is milk, melkbiscuits are biscuits. Still
   * crude ("appel" ends "aardappel"); that is what Corrections are for.
   */
  const matching = (chainId, unit, words) => searchable[chainId].filter((p) =>
    (unit === null || p.unit === unit) && words.every((w) => p.words.some((n) => n.endsWith(w))));

  /** "500 g rundergehakt" -> { quantity: 0.5, unit: "kg", noun: "rundergehakt" }. */
  function parse(text) {
    const t = text.trim().replace(/\s+/g, " ");
    if (!t) return null;
    let quantity = null, unit = null, noun = t;
    const m = t.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
    if (m) {
      quantity = Number(m[1].replace(",", "."));
      noun = m[2];
      const [first, ...rest] = noun.split(" ");
      const u = UNITS[first.toLowerCase().replace(/\.$/, "")];
      if (u && rest.length) { unit = u[0]; quantity *= u[1]; noun = rest.join(" "); }
    }
    if (!noun || UNITS[noun.toLowerCase()] || !(quantity === null || quantity > 0)) return null;
    let guessed = false;
    if (unit === null) {
      // No unit written. A count ("2 courgettes") means pieces when the chains
      // sell it by the piece; otherwise the unit most matching products use.
      const tally = { kg: 0, l: 0, piece: 0 };
      for (const c of chains) for (const p of matching(c.id, null, wordsOf(noun))) tally[p.unit]++;
      if (quantity !== null && tally.piece > 0) unit = "piece";
      else {
        unit = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0];
        if (tally[unit] === 0) unit = "piece";
        guessed = true;
      }
      if (quantity === null) { quantity = 1; guessed = true; }
    }
    return { text: t, noun, quantity: Math.round(quantity * 1000) / 1000, unit, guessed };
  }
  const qtyText = (i) => i.unit === "piece" ? i.quantity + "×"
    : i.unit === "kg" && i.quantity < 1 ? Math.round(i.quantity * 1000) + " g"
    : i.unit === "l" && i.quantity < 1 ? Math.round(i.quantity * 1000) + " ml" : i.quantity + " " + i.unit;

  // ── State ─────────────────────────────────────────────────────────────
  const SEED = ["1 kg kruimige aardappelen", "250 g champignons", "2 courgettes", "500 g rundergehakt", "400 g broccoli",
    "1 komkommer", "1 l halfvolle melk", "1 kg uien", "350 g pindakaas", "400 g spinazie", "6 eieren", "500 g wortelen"];
  let nextId = 0;
  const newId = () => "i" + Date.now().toString(36) + (nextId++).toString(36);
  let list = load("mealdeal.list.v1", null);
  if (!Array.isArray(list)) list = SEED.map((t) => ({ id: newId(), staple: false, ...parse(t) }));
  const corrections = load("mealdeal.corrections.v1", {}); // "chain|unit|noun" -> productId
  let plan = load("mealdeal.plan.v1", null);                // { kind: "single" | "combo", ids }
  const done = new Set(load("mealdeal.done.v1", []));       // ticked while shopping
  let theme = load("mealdeal.theme.v1", "system");          // "system" | "light" | "dark"
  const PAGE_KEYS = ["recepten", "lijst", "vergelijk", "winkelen"];
  let page = PAGE_KEYS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "lijst";
  let hint = "", openRow = null, sheet = null;              // sheet: { kind: "recipe", id } | { kind: "fix", chainId, itemId }
  const added = new Set(), stepsDone = {};

  function persist() {
    save("mealdeal.list.v1", list); save("mealdeal.corrections.v1", corrections);
    save("mealdeal.plan.v1", plan); save("mealdeal.done.v1", [...done]);
  }

  // ── Resolution ────────────────────────────────────────────────────────
  const correctionKey = (chainId, item) => chainId + "|" + item.unit + "|" + item.noun.toLowerCase();
  const resolved = {};
  /** The ten cheapest by Unit Price; the first is the default Resolution. */
  function candidates(chainId, item) {
    const key = correctionKey(chainId, item);
    // Ties on Unit Price (rounded to a cent, so a 120-pack of bags is 0) go to the cheaper pack.
    resolved[key] ??= matching(chainId, item.unit, wordsOf(item.noun))
      .map((s) => products[chainId][s.id])
      .sort((a, b) => a.unitPriceCents - b.unitPriceCents || a.shelfPriceCents - b.shelfPriceCents)
      .slice(0, 10).map((p) => p.id);
    return resolved[key];
  }
  function chosenId(chainId, item) {
    const fixed = corrections[correctionKey(chainId, item)];
    if (fixed && products[chainId][fixed]) return fixed;
    return candidates(chainId, item)[0] || null;
  }
  const isOffer = (p) => (p.offerPriceCents !== null || !!p.offerWording) && !p.offerUpcoming;
  /** Whole packs, because you cannot buy 0.4 of one. */
  function packsFor(p, quantity, unit) {
    // A pack size in another unit than the item, or a piece count below one,
    // is not usable arithmetic (see issue #3): one pack is all we can say.
    const known = p.packQuantity > 0 && p.packUnit === unit && !(unit === "piece" && p.packQuantity < 1);
    return { known, packs: known ? Math.max(1, Math.ceil(quantity / p.packQuantity)) : 1 };
  }
  function line(chainId, item) {
    const id = chosenId(chainId, item);
    if (!id) return null;
    const p = products[chainId][id];
    const offer = isOffer(p) ? (p.offerWording || "aanbieding") : null;
    const price = offer && p.offerPriceCents ? p.offerPriceCents : p.shelfPriceCents;
    const { known, packs } = packsFor(p, item.quantity, item.unit);
    return { p, offer, packs, cost: packs * price, over: known ? p.packQuantity / item.quantity : 1 };
  }

  function snapshot() {
    const rows = list.map((item) => {
      const by = Object.fromEntries(chains.map((c) => [c.id, line(c.id, item)]));
      const avail = chains.filter((c) => by[c.id]).sort((a, b) => by[a.id].cost - by[b.id].cost);
      return { item, by, avail, min: avail.length ? by[avail[0].id].cost : null, max: avail.length ? by[avail.at(-1).id].cost : null };
    });
    const totals = chains.map((c) => {
      let cost = 0, filled = 0;
      for (const r of rows) if (r.by[c.id]) { filled++; cost += r.by[c.id].cost; }
      return { chain: c, cost, filled, total: rows.length, full: filled === rows.length && rows.length > 0 };
    }).sort((a, b) => b.full - a.full || a.cost - b.cost);
    const best = totals.find((t) => t.full) || null;
    // The best two-chain combination: each item from the cheaper of the pair.
    let combo = null;
    for (let i = 0; i < chains.length; i++) for (let j = i + 1; j < chains.length; j++) {
      const a = chains[i], b = chains[j]; let cost = 0, filled = 0; const from = {};
      for (const r of rows) {
        const la = r.by[a.id], lb = r.by[b.id];
        if (!la && !lb) continue;
        const pick = !lb || (la && la.cost <= lb.cost) ? a : b;
        filled++; from[r.item.id] = pick.id; cost += r.by[pick.id].cost;
      }
      const cand = { ids: [a.id, b.id], cost, filled, from };
      if (!combo || cand.filled > combo.filled || (cand.filled === combo.filled && cand.cost < combo.cost)) combo = cand;
    }
    // Only worth showing when it fills the list, beats one shop, and really uses both.
    if (combo && (combo.filled < rows.length || (best && combo.cost >= best.cost) || new Set(Object.values(combo.from)).size < 2)) combo = null;
    return { rows, totals, best, combo };
  }
  function currentPlan(s) {
    if (plan && plan.kind === "combo" && s.combo && s.combo.ids.join() === plan.ids.join()) return plan;
    if (plan && plan.kind === "single" && chainById(plan.ids[0])) return plan;
    return { kind: "single", ids: [(s.best || s.totals[0]).chain.id] };
  }
  const sourceOf = (r, p, s) => p.kind === "single" ? (r.by[p.ids[0]] ? p.ids[0] : null) : s.combo.from[r.item.id] || null;
  function planCost(s, p) { return s.rows.reduce((n, r) => { const c = sourceOf(r, p, s); return n + (c ? r.by[c].cost : 0); }, 0); }

  function priceLine(r, mini) {
    if (!r.avail.length) return "";
    const span = r.max - r.min, seen = {};
    return '<div class="pl' + (mini ? " mini" : "") + '" aria-hidden="true">' + r.avail.map((c, i) => {
      const x = span ? (r.by[c.id].cost - r.min) / span * 100 : 0;
      const k = Math.round(x); seen[k] = (seen[k] || 0) + 1;
      return '<span class="dot' + (i === 0 ? " min" : "") + '" style="--c:' + c.color + ";left:calc(" + x + "% + " + (seen[k] - 1) * (mini ? 7 : 12) + 'px)" title="' +
        esc(c.name) + " " + euro(r.by[c.id].cost) + '"></span>';
    }).join("") + "</div>";
  }

  // ── Recipes ───────────────────────────────────────────────────────────
  // EXAMPLE recipes: invented, written around what Dirk and Jumbo had on offer
  // in the swept week. Every price, product and offer wording shown comes from
  // the catalogue. Ingredients name the words a product must carry (each must
  // end a word of the name) and words that rule one out, because the general
  // matcher is too crude for short words ("ui" is inside "kaneelsuisse").
  const PET = ["kattenvoer", "hondenvoer", "kat ", "hond"];
  const ONION = { noun: "uien", q: 0.5, unit: "kg", find: ["uien"], not: ["gebakken", "crispy", "soep", "rode"] };
  const MILK = (q) => ({ noun: "halfvolle melk", q, unit: "l", find: ["halfvolle", "melk"], not: ["koffie", "karnemelk", "cups"] });
  const POTATO = { noun: "kruimige aardappelen", q: 1, unit: "kg", find: ["aardappelen", "kruimig"] };
  const MINCE = { noun: "rundergehakt", q: 0.5, unit: "kg", find: ["rundergehakt"], not: ["bal", "schnitzel"] };
  const CHEESE = { noun: "belegen kaas", q: 0.15, unit: "kg", find: ["belegen", "plakken"], not: ["geit", "vegan", "smeer"] };
  const RECIPES = [
    { id: "andijvie", name: "Andijviestamppot met rookworst", persons: 4, minutes: 30, ingredients: [
      POTATO, { noun: "andijvie", q: 0.5, unit: "kg", find: ["andijvie"], not: ["stamppot", "salade"] },
      { noun: "rookworst", q: 0.275, unit: "kg", find: ["rookworst"], not: ["erwtensoep", "stamppot", "broodje", "vegetarisch", "kip"] },
      MILK(0.25), ONION],
      pantry: ["boter", "zout", "peper"], steps: [
      "Schil de aardappelen, snijd ze in gelijke stukken en kook ze in ongeveer 20 minuten gaar in water met een snuf zout.",

      pantry: ["30 g boter", "3 el bloem", "zout", "peper", "nootmuskaat"], steps: [

      "Giet de kaassaus over de bloemkool en serveer met de aardappelen."] },
  ];
  const ingText = (g) => qtyText({ quantity: g.q, unit: g.unit }) + " " + g.noun;
  const ingCache = {};
  /** The cheapest way to buy one ingredient at one chain, Offers included. */
  function ingLine(chainId, g) {
    const key = chainId + "|" + g.noun + "|" + g.q + g.unit;
    if (key in ingCache) return ingCache[key];
    const best = Object.values(products[chainId]).filter((p) => {
      const n = p.name.toLowerCase(), ws = n.split(/[^\p{L}]+/u);
      return p.comparisonUnit === g.unit && g.find.every((f) => ws.some((w) => w.endsWith(f)))
        && ![...(g.not || []), ...PET].some((x) => n.includes(x));
    }).map((p) => {
      const onOffer = isOffer(p);
      const price = onOffer && p.offerPriceCents ? p.offerPriceCents : p.shelfPriceCents;
      const { packs } = packsFor(p, g.q, g.unit);
      return { p, packs, cost: packs * price, onOffer, offer: onOffer ? p.offerWording || "aanbieding" : null,
        was: onOffer && p.offerPriceCents && p.offerPriceCents < p.shelfPriceCents ? packs * p.shelfPriceCents : null };
    }).sort((a, b) => a.cost - b.cost)[0] || null;
    return (ingCache[key] = best);
  }
  function priceRecipe(rc) {
    const at = chains.map((c) => {
      const lines = rc.ingredients.map((g) => ingLine(c.id, g)), have = lines.filter(Boolean);
      return { chain: c, lines, cost: have.reduce((n, l) => n + l.cost, 0), missing: lines.length - have.length,
        deals: have.filter((l) => l.onOffer).length, saving: have.reduce((n, l) => n + (l.was ? l.was - l.cost : 0), 0) };
    }).sort((a, b) => a.missing - b.missing || a.cost - b.cost);
    return { rc, at, best: at[0] };
  }
  const rankedRecipes = () => RECIPES.map(priceRecipe).sort((a, b) => b.best.saving - a.best.saving || b.best.deals - a.best.deals);
  function addRecipe(id) {
    const rc = RECIPES.find((r) => r.id === id); if (!rc) return;
    let n = 0;
    for (const g of rc.ingredients) {
      if (list.some((i) => i.noun === g.noun && i.unit === g.unit)) continue;
      list.unshift({ id: newId(), staple: false, text: ingText(g), noun: g.noun, quantity: g.q, unit: g.unit, guessed: false }); n++;
    }
    added.add(id);
    hint = n ? rc.name + ": " + n + " ingrediënt" + (n === 1 ? "" : "en") + " op je lijst gezet" : rc.name + ": alles stond al op je lijst";
  }
  const ingRow = (g, l, chain) => !l
    ? '<li class="miss"><span class="l">' + esc(ingText(g)) + '</span><span class="p">—</span><span class="d">niet bij ' + esc(chain.name) + "</span></li>"
    : '<li><span class="l">' + esc(ingText(g)) + '</span><span class="p">' + euro(l.cost) + '</span><span class="d">' +
      (l.onOffer ? '<span class="o">' + esc(l.offer) + "</span> " : "") + (l.was ? '<span class="was">' + euro(l.was) + "</span> " : "") +
      esc((l.packs > 1 ? l.packs + "× " : "") + l.p.name) + "</span></li>";

  // ── Pages ─────────────────────────────────────────────────────────────
  const PAGES = {
    recepten: { label: "Recepten", ic: "🍳", render() {
      const priced = rankedRecipes();
      const seen = new Map();
      for (const { at } of priced) for (const x of at) for (const l of x.lines) {
        if (l && l.onOffer && !seen.has(l.p.id)) seen.set(l.p.id, { c: x.chain, l });
      }
      const gain = (l) => l.was ? l.was - l.cost : 0;
      const deals = [...seen.values()].sort((a, b) => gain(b.l) - gain(a.l)).map(({ c, l }) =>
        '<div class="deal"><span class="n">' + esc(l.p.name) + "</span><span>" + tag(c) + '</span><span class="v">' + euro(l.cost) +
        (l.was ? '<span class="was">' + euro(l.was) + "</span>" : "") + '</span><span class="w">' + esc(l.offer) + "</span></div>").join("");
      const cards = priced.map(({ rc, at, best }) =>
        '<article class="rc"><div class="hd" data-act="open-recipe" data-id="' + rc.id + '" role="button" tabindex="0" aria-label="Bereiding van ' + esc(rc.name) + '">' +
        '<span class="ex">voorbeeldrecept</span><h3>' + esc(rc.name) + "</h3>" +
        '<div class="meta">' + rc.persons + " personen · " + rc.minutes + " min · " + euro(Math.round(best.cost / rc.persons)) + " p.p.</div>" +
        '<div class="save">' + (best.saving ? "<b>" + euro(best.saving) + " korting</b>" : "") + "<span>" + best.deals + " van " + rc.ingredients.length + " in de aanbieding bij " + esc(best.chain.name) + "</span></div>" +
        '<span class="more">Bekijk bereiding →</span></div>' +
        "<ul>" + rc.ingredients.map((g, i) => ingRow(g, best.lines[i], best.chain)).join("") + "</ul>" +
        '<div class="ft"><div class="chains">' + at.map((x, i) => '<span class="' + (i ? "" : "best") + '">' + tag(x.chain) + " <b>" + euro(x.cost) + "</b>" + (x.missing ? " · " + x.missing + " mist" : "") + "</span>").join("") + "</div>" +
        '<button class="btn' + (added.has(rc.id) ? " on" : "") + '" data-act="recipe" data-id="' + rc.id + '">' + (added.has(rc.id) ? "✓ Op je lijst" : "Zet op mijn lijst") + "</button></div></article>").join("");
      return "<h1>Recepten van deze week</h1>" +
        '<p class="lede">Gekozen rond wat er nu in de aanbieding is, met de meeste korting bovenaan. Tik een recept voor de bereiding.</p>' +
        '<p class="hint">' + esc(hint) + "</p>" +
        '<div class="sec"><h2>In de aanbieding</h2><span>waar deze recepten op draaien</span></div><div class="deals">' + deals + "</div>" +
        '<div class="recipes">' + cards + "</div>" +
        '<p class="note">De recepten zijn voorbeelden. Prijzen, producten en acties zijn echt, uit de prijzen van ' + esc(chains[0].observedAt) + ".</p>";
    } },

    lijst: { label: "Lijst", ic: "☰", render(s) {
      const card = (r) => {
        const cheapest = r.avail[0];
        const best = cheapest
          ? "<span>goedkoopst " + tag(cheapest) + " <b>" + euro(r.min) + "</b></span>" +
            (r.avail.length > 1 && r.max > r.min ? '<span class="delta">tot +' + euro(r.max - r.min) + " elders</span>"
              : r.avail.length > 1 ? '<span class="delta zero">overal even duur</span>' : "")
          : '<span class="none">nergens te koop</span>';
        return '<div class="it"><div class="nm">' + esc(r.item.noun) +
          '<button class="q" data-act="unit" data-id="' + r.item.id + '" title="Eenheid wisselen">' + qtyText(r.item) + "</button></div>" +
          '<div class="ops"><button data-act="staple" data-id="' + r.item.id + '" aria-pressed="' + r.item.staple + '" title="Vaste boodschap">📌</button>' +
          '<button data-act="remove" data-id="' + r.item.id + '" title="Van de lijst">✕</button></div>' +
          (r.item.guessed ? '<div class="guess">Eenheid geraden: tik het aantal om te wisselen</div>' : "") +
          '<div class="best">' + best + "</div>" + priceLine(r, true) + "</div>";
      };
      const staples = s.rows.filter((r) => r.item.staple), once = s.rows.filter((r) => !r.item.staple);
      const p = currentPlan(s), top = rankedRecipes()[0];
      return "<h1>Boodschappenlijst</h1><p class=\"lede\">Wat er in huis moet komen. Waar het het goedkoopst is, zie je bij Vergelijk.</p>" +
        (top ? '<div class="banner"><span>Deze week: <b>' + esc(top.rc.name) + "</b>, " + top.best.deals + ' ingrediënten in de aanbieding</span><button class="btn" data-act="go" data-id="recepten">' + RECIPES.length + " recepten bekijken</button></div>" : "") +
        '<form class="add"><label for="q" hidden>Op de lijst zetten</label><input id="q" name="q" placeholder="500 g rundergehakt, 2 courgettes, melk…" autocomplete="off"><button>Erbij</button></form>' +
        '<p class="hint' + (hint.startsWith("!") ? " warn" : "") + '">' + esc(hint.replace(/^!/, "")) + "</p>" +
        '<div class="sec"><h2>Deze keer</h2><span>' + once.length + " · gaan eraf na het winkelen</span></div>" +
        (once.length ? '<div class="items">' + once.map(card).join("") + "</div>" : '<p class="lede">Niets extra deze keer.</p>') +
        '<div class="sec"><h2>Vaste boodschappen</h2><span>' + staples.length + " · 📌 blijven op de lijst</span></div>" +
        (staples.length ? '<div class="items">' + staples.map(card).join("") + "</div>" : '<p class="lede">Pin iets met 📌 om het te bewaren.</p>') +
        (s.rows.length ? '<div class="foot"><span>' + s.rows.length + " artikelen · " + p.ids.map((id) => esc(chainById(id).name)).join(" + ") + " <b>" + euro(planCost(s, p)) + "</b></span>" +
          '<span><button class="btn ghost" data-act="go" data-id="vergelijk">Vergelijk winkels</button> <button class="btn" data-act="go" data-id="winkelen">Winkelen</button></span></div>' : "");
    } },

    vergelijk: { label: "Vergelijk", ic: "⚖", render(s) {
      if (!s.rows.length) return '<h1>Niets te vergelijken</h1><p class="lede">Zet eerst iets op je lijst.</p>';
      const p = currentPlan(s), base = s.best ? s.best.cost : null;
      const bag = (t, i) => {
        const c = t.chain, on = p.kind === "single" && p.ids[0] === c.id;
        const diff = base !== null && t.full ? t.cost - base : null;
        return '<button class="bag bagc" style="--c:' + c.color + '" data-act="plan" data-id="' + c.id + '" aria-pressed="' + on + '">' +
          '<span class="rank">#' + (i + 1) + '</span><span class="nm">' + esc(c.name) + "</span>" +
          '<span class="tt">' + (t.full ? "" : "<small>≥</small>") + euro(t.cost) + "</span>" +
          (diff === null ? '<span class="df">' + (t.total - t.filled) + " ontbreekt</span>" : '<span class="df' + (diff ? "" : " zero") + '">' + (diff ? "+" + euro(diff) : "goedkoopst") + "</span>") +
          '<span class="cov">' + s.rows.map((r) => '<i class="' + (r.by[c.id] ? "" : "miss") + '"></i>').join("") + "</span>" +
          '<span class="cv">' + t.filled + " van " + t.total + " te koop" + (t.full ? "" : " · totaal is een ondergrens") + "</span>" +
          '<span class="pick"><i>' + (on ? "✓" : "") + "</i>" + (on ? "Gekozen" : "Kies deze tas") + "</span></button>";
      };
      let combo = "";
      if (s.combo) {
        const [a, b] = s.combo.ids.map(chainById), on = p.kind === "combo";
        const n = (id) => Object.values(s.combo.from).filter((x) => x === id).length;
        combo = '<button class="bag bagc combo" style="--c:var(--ink);--c1x:' + a.color + ";--c2x:" + b.color + '" data-act="combo" aria-pressed="' + on + '">' +
          '<span class="nm">' + esc(a.name) + " + " + esc(b.name) + '</span><span class="tt">' + euro(s.combo.cost) + "</span>" +
          '<span class="df zero">' + euro(base - s.combo.cost) + " minder dan " + esc(s.best.chain.name) + "</span>" +
          '<span class="cv">Twee winkels: ' + n(a.id) + " bij " + esc(a.name) + ", " + n(b.id) + " bij " + esc(b.name) + "</span>" +
          '<span class="pick"><i>' + (on ? "✓" : "") + "</i>" + (on ? "Gekozen" : "Kies deze combinatie") + "</span></button>";
      }
      const rows = s.rows.slice().sort((a, b) => ((b.max ?? 0) - (b.min ?? 0)) - ((a.max ?? 0) - (a.min ?? 0)));
      const diffs = rows.map((r) => {
        const open = openRow === r.item.id, spread = r.avail.length > 1 ? r.max - r.min : 0, missing = chains.length - r.avail.length;
        return '<div class="df-row"><button data-act="row" data-id="' + r.item.id + '" aria-expanded="' + open + '">' +
          '<span class="nm">' + esc(r.item.noun) + '<span class="q">' + qtyText(r.item) + (missing ? " · " + missing + " winkel" + (missing > 1 ? "s" : "") + " niet" : "") + "</span></span>" +
          '<span class="plw">' + priceLine(r) + (r.avail.length ? '<div class="pl-ends"><span class="lo">' + euro(r.min) + " " + esc(r.avail[0].name) + "</span><span>" + (spread ? euro(r.max) : "") + "</span></div>" : "") + "</span>" +
          '<span class="spread">' + (spread ? "+" + euro(spread) : "—") + "<small>" + (spread ? "verschil" : r.avail.length ? "gelijk" : "nergens") + "</small></span></button>" +
          (open ? '<div class="open">' + chains.map((c) => {
            const l = r.by[c.id], fixed = correctionKey(c.id, r.item) in corrections;
            if (!l) return '<div class="pr">' + tag(c) + '<span class="pn">niet te koop</span><span class="v">—</span><span></span><span></span></div>';
            return '<div class="pr">' + tag(c) + '<span class="pn" title="' + esc(l.p.name) + '">' + (l.offer ? '<span class="o">' + esc(l.offer) + "</span> " : "") + esc(l.p.name) + "</span>" +
              '<span class="v">' + euro(l.cost) + "</span>" + (l.cost > r.min ? '<span class="delta">+' + euro(l.cost - r.min) + "</span>" : '<span class="delta zero">laagst</span>') +
              '<button class="fix" data-act="fix" data-id="' + r.item.id + '" data-chain="' + c.id + '">' + (fixed ? "gecorrigeerd" : "ander product") + "</button></div>";
          }).join("") + "</div>" : "") + "</div>";
      }).join("");
      return "<h1>" + (s.best ? "Alles bij " + esc(s.best.chain.name) + ": " + euro(s.best.cost) : "Geen winkel heeft alles") + "</h1>" +
        '<p class="lede">Elke winkel is een tas met jouw hele lijst erin, van goedkoop naar duur. Tik een tas om er te gaan winkelen.</p>' +
        '<div class="rack">' + combo + s.totals.map(bag).join("") + "</div>" +
        '<div class="sec" style="margin-top:38px"><h2>Waar zit het verschil?</h2><span>grootste verschil bovenaan · tik voor alle prijzen en om een product te corrigeren</span></div>' +
        '<div class="legend">' + chains.map(tag).join("") + "<span>· omcirkeld = goedkoopst</span></div>" +
        '<div class="diffs">' + diffs + "</div>" +
        '<p class="note">Prijzen van ' + chains.map((c) => esc(c.name) + " (" + esc(c.store || "landelijk") + ", " + esc(c.observedAt || "?") + ")").join(" en ") +
        ". Per winkel kiezen we het product met de laagste kiloprijs onder de namen die elk woord bevatten. Dat gaat soms mis; daarom kun je corrigeren.</p>";
    } },

    winkelen: { label: "Winkelen", ic: "✓", render(s) {
      if (!s.rows.length) return '<h1>Winkelen</h1><p class="lede">Je lijst is leeg.</p>';
      const p = currentPlan(s);
      const groups = p.ids.map((id) => ({ c: chainById(id), rows: s.rows.filter((r) => sourceOf(r, p, s) === id) })).filter((g) => g.rows.length);
      const nowhere = s.rows.filter((r) => !sourceOf(r, p, s));
      let left = 0, ticked = 0, count = 0, total = 0;
      for (const g of groups) for (const r of g.rows) { const c = r.by[g.c.id].cost; total += c; count++; if (done.has(r.item.id)) ticked++; else left += c; }
      const shops = groups.map(({ c, rows }) => '<section class="bag shop" style="--c:' + c.color + '"><header><b>' + esc(c.name) + "</b><span>" + rows.length + " · " +
        euro(rows.reduce((n, r) => n + r.by[c.id].cost, 0)) + '</span></header><div class="chk">' + rows.map((r) => {
          const l = r.by[c.id], d = done.has(r.item.id);
          return '<button class="ci' + (d ? " done" : "") + '" data-act="tick" data-id="' + r.item.id + '" aria-pressed="' + d + '"><span class="tick">' + (d ? "✓" : "") + "</span>" +
            '<span class="nm">' + esc(r.item.noun) + '<span class="q">' + qtyText(r.item) + "</span></span>" +
            '<span class="g">' + (l.offer ? '<span class="o">' + esc(l.offer) + "</span> " : "") + (l.packs > 1 ? l.packs + "× " : "") + esc(l.p.name) +
            (l.p.packaging ? " · " + esc(l.p.packaging) : "") + (l.over >= 2 ? ' · <span class="w">pak is ' + Math.round(l.over * 10) / 10 + "× wat je nodig hebt</span>" : "") + "</span>" +
            '<span class="v">' + euro(l.cost) + "</span></button>";
        }).join("") + "</div></section>").join("");
      const pct = count ? Math.round(ticked / count * 100) : 0;
      return "<h1>Winkelen</h1>" +
        '<div class="plan"><span>' + (p.kind === "combo" ? "Twee winkels:" : "Alles bij") + " " + p.ids.map((id) => esc(chainById(id).name)).join(" + ") + " · <b>" + euro(total) + "</b></span>" +
        '<button data-act="go" data-id="vergelijk">andere tas kiezen</button></div>' + shops +
        (nowhere.length ? '<div class="missing">Hier niet te koop: ' + nowhere.map((r) => esc(r.item.noun)).join(", ") + "</div>" : "") +
        '<div class="progress"><span><b>' + euro(left) + "</b> nog</span><span class=\"bar\"><i style=\"width:" + pct + '%"></i></span><span>' + ticked + "/" + count + "</span>" +
        (ticked ? '<button class="btn" data-act="finish">Klaar</button>' : "") + "</div>";
    } },
  };

  // ── Sheets ────────────────────────────────────────────────────────────
  function recipeSheet(id) {
    const rc = RECIPES.find((r) => r.id === id); if (!rc) return "";
    const { at, best } = priceRecipe(rc), ticked = stepsDone[rc.id] || new Set();
    return '<div class="scrim" data-act="close"></div><section class="sheet rd" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<header><div><span class="ex">voorbeeldrecept</span><h2 id="sheet-title">' + esc(rc.name) + "</h2>" +
      '<div class="meta">' + rc.persons + " personen · " + rc.minutes + " min · " + euro(Math.round(best.cost / rc.persons)) + " p.p." + (best.saving ? " · " + euro(best.saving) + " korting bij " + esc(best.chain.name) : "") + "</div></div>" +
      '<button class="x" data-act="close" aria-label="Sluiten">✕</button></header>' +
      '<div class="body"><div class="ing"><h3>Ingrediënten</h3><ul>' + rc.ingredients.map((g, i) => ingRow(g, best.lines[i], best.chain)).join("") + "</ul>" +
      '<div class="kast"><b>Uit de kast:</b> ' + rc.pantry.map(esc).join(", ") + "</div>" +
      '<div class="tot chains">' + at.map((x) => tag(x.chain) + " <b>" + euro(x.cost) + "</b>").join(" ") + "</div>" +
      '<button class="btn' + (added.has(rc.id) ? " on" : "") + '" data-act="recipe" data-id="' + rc.id + '">' + (added.has(rc.id) ? "✓ Op je lijst" : "Zet op mijn lijst") + "</button></div>" +
      "<div><h3>Bereiding</h3><ol>" + rc.steps.map((t, i) => '<li><button data-act="step" data-id="' + i + '" class="' + (ticked.has(i) ? "done" : "") + '" aria-pressed="' + ticked.has(i) + '">' +
        '<span class="n">' + (ticked.has(i) ? "✓" : i + 1) + '</span><span class="t">' + esc(t) + "</span></button></li>").join("") +
      '</ol><p class="tip">Tik een stap aan als hij klaar is.</p></div></div></section>';
  }
  function fixSheet(chainId, itemId) {
    const item = list.find((i) => i.id === itemId), chain = chainById(chainId); if (!item || !chain) return "";
    const current = chosenId(chainId, item), ids = candidates(chainId, item).slice();
    if (current && !ids.includes(current)) ids.unshift(current);
    return '<div class="scrim" data-act="close"></div><section class="sheet narrow cd" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<header><div><span class="ct" style="--c:' + chain.color + '">' + esc(chain.name) + '</span><h2 id="sheet-title">' + esc(qtyText(item) + " " + item.noun) + "</h2>" +
      '<div class="meta">Gekozen op de laagste kiloprijs. Kies het product dat je echt bedoelt; dat onthouden we voor de volgende keer.</div></div>' +
      '<button class="x" data-act="close" aria-label="Sluiten">✕</button></header><div class="list">' + ids.map((id) => {
        const p = products[chainId][id], offer = isOffer(p), price = offer && p.offerPriceCents ? p.offerPriceCents : p.shelfPriceCents;
        return '<button class="alt' + (id === current ? " on" : "") + '" data-act="pick" data-id="' + id + '"><span class="n">' + esc(p.name) + '</span><span class="v">' + euro(price) + "</span>" +
          '<span class="m">' + euro(p.unitPriceCents) + ({ kg: "/kg", l: "/l", piece: " per stuk" })[p.comparisonUnit] + (p.packaging ? " · " + esc(p.packaging) : "") +
          (offer ? ' · <span class="o">' + esc(p.offerWording || "aanbieding") + "</span>" : "") + "</span></button>";
      }).join("") + "</div>" + (correctionKey(chainId, item) in corrections ? '<button class="btn ghost reset" data-act="unfix">Terug naar automatisch</button>' : "") + "</section>";
  }

  // ── Wiring ────────────────────────────────────────────────────────────
  const main = document.getElementById("main");
  function applyTheme() {
    if (theme === "system") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = theme;
    document.getElementById("theme").textContent = { system: "◐ Auto", light: "☀ Licht", dark: "☾ Donker" }[theme];
  }
  function render() {
    const s = snapshot();
    const counts = { recepten: RECIPES.length, lijst: s.rows.length, vergelijk: chains.length, winkelen: s.rows.filter((r) => !done.has(r.item.id)).length };
    for (const nav of ["tabs-top", "tabs-bottom"]) document.getElementById(nav).innerHTML = PAGE_KEYS.map((k) =>
      '<button data-act="go" data-id="' + k + '"' + (k === page ? ' aria-current="page"' : "") + '><span class="ic">' + PAGES[k].ic + "</span>" +
      PAGES[k].label + '<span class="n">' + counts[k] + "</span></button>").join("");
    const focused = document.activeElement && document.activeElement.name === "q";
    main.innerHTML = PAGES[page].render(s);
    if (focused) main.querySelector("input[name=q]")?.focus();
    document.getElementById("sheet").innerHTML = !sheet ? "" : sheet.kind === "recipe" ? recipeSheet(sheet.id) : fixSheet(sheet.chainId, sheet.itemId);
    document.body.classList.toggle("locked", !!sheet);
  }

  document.getElementById("theme").addEventListener("click", () => {
    theme = { system: "light", light: "dark", dark: "system" }[theme];
    save("mealdeal.theme.v1", theme); applyTheme();
  });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (PAGE_KEYS.includes(h) && h !== page) { page = h; render(); } });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && sheet) { sheet = null; render(); return; }
    const card = e.target.closest?.('[data-act="open-recipe"][role="button"]');
    if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); sheet = { kind: "recipe", id: card.dataset.id }; render(); }
  });
  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const input = e.target.querySelector("input[name=q]"), parsed = parse(input.value);
    if (!parsed) { hint = "!Niet gelezen. Probeer “500 g rundergehakt” of “2 courgettes”."; render(); return; }
    list.unshift({ id: newId(), staple: false, ...parsed });
    hint = "Toegevoegd: " + qtyText(parsed) + " " + parsed.noun;
    input.value = "";
    persist(); render();
  });
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id, item = list.find((i) => i.id === id);
    switch (b.dataset.act) {
      case "go": page = id; hint = ""; history.replaceState(null, "", "#" + id); window.scrollTo(0, 0); break;
      case "staple": if (item) item.staple = !item.staple; break;
      case "remove": list = list.filter((i) => i.id !== id); done.delete(id); break;
      case "unit": {
        // Cycle kg -> l -> pieces, keeping the number: a guessed unit is usually wrong in kind, not amount.
        if (item) { const order = ["kg", "l", "piece"]; item.unit = order[(order.indexOf(item.unit) + 1) % 3]; item.guessed = false; }
        break;
      }
      case "plan": plan = { kind: "single", ids: [id] }; break;
      case "combo": { const s = snapshot(); if (s.combo) plan = { kind: "combo", ids: s.combo.ids.slice() }; break; }
      case "row": openRow = openRow === id ? null : id; break;
      case "fix": sheet = { kind: "fix", chainId: b.dataset.chain, itemId: id }; break;
      case "pick": { const it = list.find((i) => i.id === sheet.itemId); if (it) corrections[correctionKey(sheet.chainId, it)] = id; sheet = null; break; }
      case "unfix": { const it = list.find((i) => i.id === sheet.itemId); if (it) delete corrections[correctionKey(sheet.chainId, it)]; sheet = null; break; }
      case "tick": done.has(id) ? done.delete(id) : done.add(id); break;
      case "finish": list = list.filter((i) => i.staple || !done.has(i.id)); done.clear(); page = "lijst"; history.replaceState(null, "", "#lijst"); break;
      case "recipe": addRecipe(id); break;
      case "open-recipe": sheet = { kind: "recipe", id }; break;
      case "step": { const set = (stepsDone[sheet.id] ||= new Set()); const n = Number(id); set.has(n) ? set.delete(n) : set.add(n); break; }
      case "close": sheet = null; break;
      default: return;
    }
    persist(); render();
  });

  applyTheme();
  render();
</script>
