<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mealdeal</title>
<!-- Hosted at an unlisted address for one user (#17): keep it out of search. -->
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
  /* ── Tokens ───────────────────────────────────────────────────────────
     Kraft is the light theme and the base. Donker, the dark one, redefines
     only tokens: behind prefers-color-scheme (unless the page is set to
     light) and behind data-theme="dark" (when it is set to dark). No
     component reads a literal colour, so both themes come for free.
     Chain colours are ours, never a chain's brand colours. */
  :root {
    color-scheme: light;
    --paper: #f3e7d6; --paper-2: #ead9c1; --card: #fffaf2; --card-deep: #fffaf2;
    --ink: #2b2118; --ink-2: #6b5a48; --ink-3: #9a8771; --line: #dcc8ab; --on-ink: #f3e7d6;
    --good: #2f7a3f; --good-wash: #d9ecd9; --bad: #b8432f; --bad-wash: #f6dcd4;
    --offer: #ffe9a3; --offer-ink: #2b2118; --scrim: rgba(30, 20, 10, .45);
    --bag-shade: rgba(0, 0, 0, .12); --lift: 0 14px 24px -16px rgba(60, 30, 0, .6);
    --c0: #12805a; --c1: #c4801a; --c2: #7a3fa0; --c3: #4a3ad0; --c4: #901000; --c5: #782860; --c6: #a84000; --c7: #985078;
    --r: 16px;
    --font: Nunito, ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #1c1611; --paper-2: #2b2219; --card: #29211a; --card-deep: #201a14;
      --ink: #f3e7d6; --ink-2: #cdbba4; --ink-3: #917f6b; --line: #3e3328; --on-ink: #1c1611;
      --good: #72c28e; --good-wash: rgba(114, 194, 142, .16); --bad: #f08c75; --bad-wash: rgba(240, 140, 117, .16);
      --offer: rgba(255, 214, 102, .18); --offer-ink: #ffd666; --scrim: rgba(0, 0, 0, .6);
      --bag-shade: rgba(0, 0, 0, .22); --lift: 0 14px 26px -14px rgba(0, 0, 0, .7);
      --c0: #239270; --c1: #c38425; --c2: #9358b8; --c3: #7050f8; --c4: #c00038; --c5: #984080; --c6: #a84000; --c7: #b05888;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #1c1611; --paper-2: #2b2219; --card: #29211a; --card-deep: #201a14;
    --ink: #f3e7d6; --ink-2: #cdbba4; --ink-3: #917f6b; --line: #3e3328; --on-ink: #1c1611;
    --good: #72c28e; --good-wash: rgba(114, 194, 142, .16); --bad: #f08c75; --bad-wash: rgba(240, 140, 117, .16);
    --offer: rgba(255, 214, 102, .18); --offer-ink: #ffd666; --scrim: rgba(0, 0, 0, .6);
    --bag-shade: rgba(0, 0, 0, .22); --lift: 0 14px 26px -14px rgba(0, 0, 0, .7);
    --c0: #239270; --c1: #c38425; --c2: #9358b8; --c3: #7050f8; --c4: #c00038; --c5: #984080; --c6: #a84000; --c7: #b05888;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; }
  body.locked { overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* ── Shell: top tabs on a desktop, a bottom bar on a phone ─────────── */
  .top { max-width: 1080px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px 0; display: flex; align-items: center; gap: 18px; }
  .brand { font-weight: 900; font-size: 24px; letter-spacing: -.02em; }
  .brand i { display: inline-block; width: 22px; height: 18px; margin-right: 6px; vertical-align: -2px; background: var(--ink); border-radius: 3px 3px 7px 7px; position: relative; }
  .brand i::before { content: ""; position: absolute; left: 5px; right: 5px; top: -7px; height: 9px; border: 2.5px solid var(--ink); border-bottom: 0; border-radius: 8px 8px 0 0; }
  .tabs { display: flex; gap: 4px; background: var(--paper-2); border-radius: 999px; padding: 4px; }
  .tabs button { border: 0; background: transparent; border-radius: 999px; padding: 8px 16px; font-weight: 800; cursor: pointer; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
  .tabs button[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
  .tabs .n { font-size: 12px; background: var(--bag-shade); border-radius: 999px; padding: 1px 7px; }
  .tabs .ic { display: none; }
  .theme, .lang { margin-left: auto; border: 0; background: var(--paper-2); color: var(--ink-2); border-radius: 999px; height: 38px; padding: 0 14px; font-weight: 800; cursor: pointer; }
  .lang { margin-left: 0; }
  main { max-width: 1080px; margin: 0 auto; padding: 18px 16px 120px; }
  h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 900; letter-spacing: -.025em; line-height: 1.02; margin: 4px 0 6px; }
  .lede { color: var(--ink-2); margin: 0 0 18px; }
  .note { color: var(--ink-3); font-size: 13px; margin: 22px 0 0; }
  .note.card { margin: 6px 0 14px; }
  /* How old the prices are. Out of date is loud on purpose: a comparison on
     stale prices is a claim we cannot stand behind. */
  .fresh { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 14px; color: var(--ink-2); margin: -8px 0 16px; }
  .fresh .when { font-weight: 800; color: var(--ink); }
  .fresh.stale { background: var(--offer); color: var(--offer-ink); border-radius: 12px; padding: 8px 12px; margin-top: 0; }
  .fresh.stale .when { color: inherit; }
  .fresh .warn { font-weight: 900; }
  .age { font-size: 13px; font-weight: 700; opacity: .9; }
  .age.stale { display: inline-block; justify-self: start; background: var(--offer); color: var(--offer-ink); border-radius: 999px; padding: 1px 9px; opacity: 1; font-weight: 900; }
  @media (max-width: 720px) {
    .top .tabs { display: none; }
    .tabs.bottom {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; border-radius: 0; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      background: var(--card); box-shadow: 0 -1px 0 var(--line), 0 -8px 24px rgba(0, 0, 0, .1); justify-content: space-around;
    }
    .tabs.bottom button { flex: 1; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 12.5px; border-radius: 12px; }
    .tabs.bottom .ic { display: block; font-size: 20px; line-height: 1; }
  }
  @media (min-width: 721px) { .tabs.bottom { display: none; } }

  /* ── Shared pieces ────────────────────────────────────────────────── */
  .ct { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; white-space: nowrap; }
  .ct::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
  .delta { font-weight: 800; font-size: 14px; border-radius: 999px; padding: 2px 9px; background: var(--bad-wash); color: var(--bad); white-space: nowrap; }
  .delta.zero { background: var(--good-wash); color: var(--good); }
  .o { background: var(--offer); color: var(--offer-ink); border-radius: 6px; padding: 0 6px; font-weight: 800; }
  .vd { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 0 6px; margin-left: 4px; color: var(--ink-2); }
  .vd.low { background: var(--good-wash); color: var(--good); }
  .vd.not { background: var(--bad-wash); color: var(--bad); }
  .sug { border: 0; background: none; padding: 0; font: inherit; font-weight: 900; color: inherit; text-decoration: underline; cursor: pointer; }
  .hist { grid-column: 1 / -1; display: grid; gap: 2px; width: 100%; border: 0; background: none; padding: 4px 0 0; font: inherit; color: var(--ink-2); text-align: left; cursor: pointer; }
  .hist svg { width: 100%; height: 28px; display: block; overflow: visible; }
  .hist .cap { font-size: 13px; font-weight: 700; }
  .hist:hover .cap, .hist:focus-visible .cap { color: var(--ink); }
  .chart { position: relative; margin: 8px 0 4px; }
  .chart svg { display: block; overflow: visible; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .tick { fill: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chart .hit { fill: transparent; cursor: crosshair; outline: none; }
  .chart .hit:focus-visible { stroke: var(--ink-3); stroke-width: 1; }
  .chart .xh { stroke: var(--ink-3); stroke-width: 1; }
  .chart .tip { position: absolute; top: 0; pointer-events: none; background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, .18); font-size: 13px; white-space: nowrap; }
  .chart .tip b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .chart .tip .k, .legend .k { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--c); vertical-align: middle; margin-right: 6px; }
  .legend { display: grid; gap: 6px; margin: 4px 0 12px; font-size: 14px; }
  .legend .nm { font-weight: 800; }
  .legend .st { color: var(--ink-2); }
  .hsheet { padding: 4px 20px 20px; }
  .hsheet .note { color: var(--ink-2); font-size: 13px; }
  .hsheet table { border-collapse: collapse; font-size: 13px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .hsheet th, .hsheet td { padding: 3px 10px 3px 0; text-align: right; }
  .hsheet th:first-child, .hsheet td:first-child { text-align: left; }
  .vd.later { background: var(--offer); color: var(--offer-ink); border: 1px dashed var(--offer-ink); }
  .wk { display: inline-flex; background: var(--card); border-radius: 999px; padding: 3px; box-shadow: 0 2px 0 var(--line); margin: 0 0 14px; }
  .wk button { border: 0; background: none; font: inherit; font-weight: 800; color: var(--ink-2); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .wk button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .wk button:disabled { opacity: .45; cursor: default; }
  /* Exact Products (#15): a branded item compared as itself, apart from the bags. */
  .xb { display: inline-block; vertical-align: middle; margin-left: 6px; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 0 6px; background: var(--ink); color: var(--on-ink); }
  .it .xs { grid-column: 1 / -1; display: grid; gap: 3px; font-size: 14px; color: var(--ink-2); margin-top: 4px; }
  .it .xs > span { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
  .it .xs b { color: var(--ink); }
  .likely { font-size: 12px; font-weight: 800; border-radius: 6px; padding: 0 6px; border: 1px dashed var(--ink-3); color: var(--ink-2); }
  .nc { color: var(--ink-3); font-style: italic; }
  .xo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -4px 4px 12px; font-size: 14px; color: var(--ink-2); }
  .xo button, .xbtn { border: 0; background: var(--paper-2); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
  .xbtn { justify-self: start; margin: -2px 0 8px 12px; font-size: 13px; }
  .xt { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 12px; font-size: 15px; }
  .xshop { background: var(--card); border-radius: var(--r); padding: 12px 14px; margin-top: 18px; box-shadow: 0 2px 0 var(--line); }
  .xshop header { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .xshop .ci { color: var(--ink); }
  .xshop .miss { color: var(--ink-3); font-size: 14px; padding: 6px 0; }
  .it .nx { grid-column: 1 / -1; font-size: 14px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .add { display: flex; background: var(--card); border-radius: 999px; padding: 5px; box-shadow: 0 2px 0 var(--line); }
  .add input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 16px; font-size: 17px; font-weight: 700; outline: none; }
  .add button { border: 0; background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 0 20px; font-weight: 800; cursor: pointer; }
  .hint { color: var(--ink-3); font-size: 14px; margin: 8px 4px 0; min-height: 1.4em; }
  .hint.warn { color: var(--bad); font-weight: 700; }
  .sec { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 26px 0 10px; }
  .sec h2 { margin: 0; font-size: 20px; font-weight: 900; }
  .sec span { color: var(--ink-3); font-size: 14px; font-weight: 700; }
  .btn { border: 0; background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 10px 16px; font-weight: 900; cursor: pointer; }
  .btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 2px currentColor; }

  /* The price line: one dot per chain, placed by what the item costs there. */
  .pl { position: relative; height: 26px; margin: 0 10px; }
  .pl::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 3px; border-radius: 3px; background: var(--line); }
  .pl .dot { position: absolute; top: 6px; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2.5px var(--card); }
  .pl .dot.min { width: 19px; height: 19px; top: 4px; margin-left: -9.5px; box-shadow: 0 0 0 2.5px var(--card), 0 0 0 4.5px var(--ink); }
  .pl.mini { height: 14px; margin: 0 6px; }
  .pl.mini::before { top: 6px; height: 2px; }
  .pl.mini .dot { top: 3px; width: 9px; height: 9px; margin-left: -4.5px; box-shadow: 0 0 0 1.5px var(--card); }
  .pl.mini .dot.min { width: 11px; height: 11px; top: 2px; margin-left: -5.5px; box-shadow: 0 0 0 1.5px var(--card), 0 0 0 3px var(--ink); }
  .pl-ends { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--ink-2); }
  .pl-ends .lo { color: var(--good); }

  /* A bag: the chain's colour, a handle, white text. Recipe cards borrow the handle. */
  .bag { position: relative; background: var(--c); color: #fff; border-radius: 10px 10px 22px 22px; box-shadow: inset 0 -8px 0 var(--bag-shade), var(--lift); }
  .bag::before { content: ""; position: absolute; left: 50%; top: -22px; width: 40%; max-width: 200px; height: 30px; transform: translateX(-50%); border: 7px solid var(--c); border-bottom: 0; border-radius: 40px 40px 0 0; }

  /* ── Lijst ────────────────────────────────────────────────────────── */
  .banner { margin: 0 0 14px; background: var(--card); border-radius: var(--r); padding: 12px 14px; box-shadow: 0 2px 0 var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .banner b { font-weight: 900; }
  .banner .btn { background: var(--good); color: var(--on-ink); }
  .drops { margin: 0 0 14px; background: var(--card); border-radius: var(--r); padding: 12px 14px; box-shadow: 0 2px 0 var(--line); }
  .drops h2 { margin: 0 0 6px; font-size: 17px; font-weight: 900; }
  .drops ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .drops li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 14px; }
  .drops li > b:first-child { font-size: 15px; flex-basis: 100%; }
  .drops .note { margin: 8px 0 0; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .it { background: var(--card); border-radius: var(--r); padding: 12px 14px 10px; box-shadow: 0 2px 0 var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .it .nm { font-weight: 900; font-size: 18px; line-height: 1.15; }
  /* Stickers (#32): flat colour, the ink outline, a die-cut edge. */
  .pic { width: 36px; height: 36px; vertical-align: middle; margin: -8px 8px -6px -2px; flex: none; }
  .pic .art { filter: url(#sticker-edge); }
  .pic .a { fill: var(--a); } .pic .b { fill: var(--b); } .pic .c { fill: var(--c, var(--b)); } .pic .d { fill: var(--d); }
  .pic .a, .pic .b, .pic .c { stroke: #2b2118; stroke-width: 2.4; stroke-linejoin: round; }
  .pic .e { fill: none; stroke: #2b2118; stroke-width: 1.5; stroke-linecap: round; }
  .pic .s { fill: none; stroke: #2b2118; stroke-width: 2.6; stroke-linecap: round; }
  .sticker-flood { flood-color: #fffaf2; }
  .df-row .nm .pic { float: left; margin: 0 10px 0 -2px; }
  .ci .pic { width: 30px; height: 30px; margin: -6px 6px -4px 0; }
  .it .q { border: 0; background: var(--paper-2); color: var(--ink-2); border-radius: 8px; padding: 1px 7px; margin-left: 6px; font-weight: 800; font-size: 14px; cursor: pointer; }
  .it .q:hover { color: var(--ink); }
  .it .ops { display: flex; gap: 2px; align-items: start; }
  .it .ops button { border: 0; background: transparent; border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; color: var(--ink-3); }
  .it .ops button:hover { background: var(--paper); color: var(--ink); }
  .it .ops button[aria-pressed="true"] { color: var(--ink); background: var(--paper-2); }
  .it .guess { grid-column: 1 / -1; font-size: 13px; color: var(--bad); font-weight: 700; }
  .nmb { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; text-decoration: underline dotted var(--ink-3); text-underline-offset: 4px; }
  .kinds { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 2px; }
  .kinds > span { width: 100%; font-size: 13px; font-weight: 800; color: var(--ink-2); }
  .kinds button { border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
  .kinds button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
  .cir .kinds { grid-column: 1; background: var(--card); border-radius: var(--r); padding: 8px 12px 10px; margin: 0 0 4px; }
  .it .best { grid-column: 1 / -1; font-size: 14px; color: var(--ink-2); font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .it .best b { color: var(--ink); font-weight: 900; }
  .it .best .none { color: var(--bad); font-weight: 800; }
  .it .pl { grid-column: 1 / -1; margin-top: 4px; }
  .foot {
    margin-top: 22px; background: var(--ink); color: var(--on-ink); border-radius: var(--r); padding: 14px 16px;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
  }
  .foot b { font-size: 22px; font-weight: 900; }
  .foot .btn { background: var(--on-ink); color: var(--ink); }
  .foot .btn.ghost { background: transparent; color: var(--on-ink); }

  /* ── Vergelijk ────────────────────────────────────────────────────── */
  .rack { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 30px 14px; margin-top: 34px; }
  .bagc { border: 0; text-align: left; cursor: pointer; padding: 18px 16px 14px; display: grid; gap: 4px; }
  .bagc .rank { position: absolute; top: 12px; right: 14px; font-weight: 900; font-size: 13px; background: rgba(255,255,255,.22); border-radius: 999px; padding: 2px 9px; }
  .bagc .nm { font-weight: 900; font-size: 19px; padding-right: 40px; }
  .bagc .tt { font-weight: 900; font-size: 34px; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .bagc .tt small { font-size: 18px; opacity: .85; margin-right: 2px; }
  .bagc .df { justify-self: start; font-weight: 900; font-size: 15px; background: #fff; color: #b8432f; border-radius: 999px; padding: 2px 10px; }
  .bagc .df.zero { color: #2f7a3f; }
  .bagc .cov { display: flex; gap: 2px; margin-top: 8px; }
  .bagc .cov i { flex: 1; height: 6px; border-radius: 2px; background: rgba(255,255,255,.85); }
  .bagc .cov i.miss { background: rgba(0,0,0,.28); }
  .bagc .cv { font-size: 13px; font-weight: 700; opacity: .9; }
  .bagc .pick { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
  .bagc .pick i { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid #fff; display: grid; place-items: center; font-style: normal; font-size: 13px; }
  .bagc[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 4px; }
  .bagc[aria-pressed="true"] .pick i { background: #fff; color: #2b2118; }
  .bagc.combo { background: linear-gradient(90deg, var(--c1x) 0 50%, var(--c2x) 50% 100%); }
  .bagc.combo::before { border-color: var(--ink); }
  @media (max-width: 720px) {
    .rack { grid-template-columns: 1fr; gap: 26px; }
    .bagc { grid-template-columns: 1fr auto; align-items: center; padding: 14px 14px 12px; }
    .bagc .nm { grid-column: 1; padding-right: 0; } .bagc .tt { grid-column: 2; grid-row: 1 / 3; text-align: right; font-size: 30px; }
    .bagc .df { grid-column: 1; } .bagc .cov, .bagc .cv, .bagc .pick { grid-column: 1 / -1; }
    .bagc .rank { display: none; }
  }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink-2); margin: 6px 0 12px; }
  .diffs { display: grid; gap: 8px; }

<script>
  if (!window.CATALOGUE) {
    document.getElementById("main").innerHTML =
      "<h1>Geen prijzen geladen</h1><p class=\"lede\">Run <code>node scripts/catalogue-from-db.ts</code>, " +
      "which writes <code>prototype/catalogue.js</code> next to this page, then reload.</p>";
    throw new Error("catalogue.js missing");
  }
  if (!window.CATALOGUE.columns) {
    document.getElementById("main").innerHTML =
      "<h1>Prijzen te oud voor deze pagina</h1><p class=\"lede\">Deze <code>catalogue.js</code> is gemaakt voor de Ingrediënten er waren. " +
      "Draai <code>node scripts/catalogue-from-db.ts</code> opnieuw, of haal de nieuwste op met <code>./scripts/pull-catalogue.sh</code>.</p>";
    throw new Error("catalogue.js predates columns");
  }
  const data = window.CATALOGUE;

  // ── Storage: this browser only; the page works without it ─────────────
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private window: session only */ }
  }

  // ── Language (#25) ────────────────────────────────────────────────────
  // Until the pill is tapped, the browser's own order of languages decides:
  // the first the page has, else English, which more visitors read than
  // Dutch. A tap stores a choice. Every text the page writes is tr(Dutch,
  // English); Product names and Offer wording stay as the Chain wrote them
  // (ADR-0002). Romanian (#26) adds a third argument.
  const LANGS = ["nl", "en"];
  function browserLang() {
    for (const l of navigator.languages || [navigator.language || ""]) { const base = String(l).slice(0, 2).toLowerCase(); if (LANGS.includes(base)) return base; }
    return "en";
  }
  let lang = load("mealdeal.lang.v1", null);
  if (!LANGS.includes(lang)) lang = browserLang();
  const tr = (nl, en) => lang === "en" ? en : nl;
  const locale = () => tr("nl-NL", "en-US");
  /** "do 15 okt" / "Thu, 15 Oct": the day before the month in English too. */
  function dateText(day, withWeekday = true) {
    if (lang === "nl") return day.toLocaleDateString("nl-NL", withWeekday ? { weekday: "short", day: "numeric", month: "short" } : { day: "numeric", month: "short" });
    const dm = day.getDate() + " " + day.toLocaleDateString("en-US", { month: "short" });
    return withWeekday ? day.toLocaleDateString("en-US", { weekday: "short" }) + ", " + dm : dm;
  }

  const euro = (cents) => "€" + (lang === "nl" ? (cents / 100).toFixed(2).replace(".", ",") : (cents / 100).toFixed(2));
  // An item's sticker (#32): its Ingredient's own, else its aisle's.
  const AISLE_OF = new Map(window.CATALOGUE.vocabulary.map((v) => [v.id, v.aisle]));
  const pic = (item) => window.IMAGES.sticker(item.ingredient, AISLE_OF.get(item.ingredient));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  // ── Chains: one colour slot each, defined per theme in CSS ────────────
  // Each Chain keeps its colour whichever Chains a catalogue holds: by
  // position, Plus arriving between Jumbo and Vomar would have repainted
  // Vomar. Every pair was checked for colour-blind readers (README).
  const COLOUR_SLOT = { dirk: 0, jumbo: 1, vomar: 2, plus: 3, lidl: 4, hoogvliet: 5, dekamarkt: 6, aldi: 7 };
  // Painted on the catalogue's own Chains, which Basket pricing (resolve.js) hands back in its rows.
  data.chains.forEach((c, i) => { c.color = "var(--c" + (COLOUR_SLOT[c.id] ?? 4 + (i % 4)) + ")"; });
  const chains = data.chains;
  const chainById = (id) => chains.find((c) => c.id === id);
  /** "Dirk, Jumbo en Vomar" / "Dirk, Jumbo and Vomar". */
  const andList = (xs) => xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + tr(" en ", " and ") + xs[xs.length - 1];
  /** Chains whose Offers are not online, so their prices are Shelf Prices (Vomar). Older catalogues lack the field. */
  const noOffers = chains.filter((c) => c.offers === false);
  /**
   * Chains that put only their Offers online (Lidl): a hundred-odd Products,
   * not an assortment. Never a bag of their own, which would only ever say
   * what is missing, and an item they do not list is not "not for sale"
   * there. Their Offers still compete item by item, and in two-shop plans.
   */
  const bagChains = chains.filter((c) => !c.offersOnly), offersOnly = chains.filter((c) => c.offersOnly);
  /**
   * Prices that need a Chain's card or app (Lidl Plus) count as paid, as if
   * you held every one: said beside the prices wherever they are totted up.
   */
  const carded = chains.filter((c) => c.card);
  const cardNote = () => carded.length ? '<p class="note card">' + tr("Gerekend alsof je ", "Counted as if you have ") +
    andList(carded.map((c) => "<b>" + esc(c.card) + "</b>")) + tr(" hebt: aanbiedingen die alleen met " + (carded.length > 1 ? "een klantenkaart of app" : "de app") +
    " gelden, tellen mee als je prijs. Zonder betaal je daar de gewone prijs.", ": offers that need " + (carded.length > 1 ? "a loyalty card or app" : "the app") +
    " count as your price. Without it, you pay the regular price there.") + "</p>" : "";
  const tag = (c) => '<span class="ct" style="--c:' + c.color + '">' + esc(c.name) + "</span>";

  // ── Freshness: which day each Chain's prices are from ─────────────────
  const STALE_AFTER_DAYS = 2;
  const sweptOn = (c) => { if (!c.observedAt) return null; const [y, m, d] = c.observedAt.split("-").map(Number); return new Date(y, m - 1, d); };
  /** Whole calendar days between the Sweep and today, in the viewer's own time zone. */
  function ageDays(c) {
    const day = sweptOn(c); if (!day) return null;
    const now = new Date();
    return Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - day) / 86400000);
  }
  const isStale = (c) => { const a = ageDays(c); return a === null || a > STALE_AFTER_DAYS; };
  function ageText(c) {
    const a = ageDays(c);
    if (a === null) return tr("datum onbekend", "date unknown");

    return (a <= 0 ? tr("vandaag", "today") : a === 1 ? tr("gisteren", "yesterday") : a === 2 ? tr("eergisteren", "2 days ago") : a + tr(" dagen oud", " days old")) + " (" + date + ")";
  }
  /** One line per page, near the prices: every Chain's date, loud when any is out of date. */

      (stale.length ? '<span class="warn">' + tr("Mogelijk niet meer actueel: ", "May be out of date: ") + stale.map((c) => esc(c.name)).join(", ") +
        tr((stale.length > 1 ? " zijn" : " is") + " ouder dan " + STALE_AFTER_DAYS + " dagen.", (stale.length > 1 ? " are" : " is") + " older than " + STALE_AFTER_DAYS + " days.") + "</span>" : "") + offline + "</p>";

  const bagAge = (c) => '<span class="age' + (isStale(c) ? " stale" : "") + '">' + tr("prijzen ", "prices ") + esc(ageText(c)) + (isStale(c) ? tr(" · verouderd", " · out of date") : "") + "</span>";

  // ── Catalogue: positional rows, unpacked once ─────────────────────────
  // Row: [ref, name, packaging, packQuantity, packUnit, unit, shelf, offerPrice, unitPrice, wording, endsOn,

    kindsOf(item).map((v) => '<button data-act="kind" data-id="' + item.id + '" data-v="' + v.id + '" aria-pressed="' + (item.variant === v.id) + '">' + esc(R.label(item.ingredient, v.id, lang)) + "</button>").join("") +
    '<button data-act="kind" data-id="' + item.id + '" data-v="" aria-pressed="' + !!item.anyKind + '">' + tr("Maakt niet uit", "Any kind") + "</button></div>";
  const qtyText = (i) => i.unit === "piece" ? i.quantity + "×"
    : i.unit === "kg" && i.quantity < 1 ? Math.round(i.quantity * 1000) + " g"
    : i.unit === "l" && i.quantity < 1 ? Math.round(i.quantity * 1000) + " ml" : i.quantity + " " + i.unit;

  // ── State ─────────────────────────────────────────────────────────────
  const SEED = ["1 kg kruimige aardappelen", "250 g champignons", "2 courgettes", "500 g rundergehakt", "400 g broccoli",
    "1 komkommer", "1 l halfvolle melk", "1 kg uien", "350 g pindakaas", "400 g spinazie", "6 eieren", "500 g wortelen"];
  let nextId = 0;
  const newId = () => "i" + Date.now().toString(36) + (nextId++).toString(36);
  let list = load("mealdeal.list.v1", null);
  if (!Array.isArray(list)) list = SEED.map((t) => ({ id: newId(), staple: false, ...parse(t) }));
  // An item saved before Ingredients (#14) is read again from its own text,
  // keeping its place on the list and whether it is a staple.
  list = list.map((i) => ("ingredient" in i || i.exact ? i : { id: i.id, staple: i.staple, ...(parse(i.text || "") || i) }));
  // An amount the page guessed is guessed again as it now reads: "brood"
  // saved as 1.25 loaves is one. The kind and name chosen since are kept.
  list = list.map((i) => {
    const again = i.ingredient && i.guessed && i.text && parse(i.text);
    return again && again.ingredient === i.ingredient ? { ...i, quantity: again.quantity, unit: again.unit, guessed: again.guessed } : i;
  });
  const corrections = load("mealdeal.corrections.v1", {}); // "chain|i|ingredient|variant" -> productId
  // A Correction saved per typed noun ("dirk|kg|rundergehakt") now applies to
  // its Ingredient, so it holds for every item and recipe that needs it.

  }
  let plan = load("mealdeal.plan.v1", null);                // { kind: "single" | "combo", ids }
  const done = new Set(load("mealdeal.done.v1", []));       // ticked while shopping
  let theme = load("mealdeal.theme.v1", "system");          // "system" | "light" | "dark"
  let week = load("mealdeal.week.v1", "nu");                // "nu" | "volgende": whose Offers Recepten and Lijst show
  const PAGE_KEYS = ["recepten", "bladeren", "lijst", "vergelijk", "winkelen"];
  let page = PAGE_KEYS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "lijst";
  let exactOffer = null;                                    // { itemId, matches }: Exact Products the item just typed may mean
  let hint = "", openRow = null, sheet = null;              // sheet: { kind: "recipe", id } | { kind: "fix", chainId, itemId } | { kind: "report", ... }
  const added = new Set(), stepsDone = {};
  const RECIPES_SHOWN = 8; let showAllRecipes = false;

  let browse = { view: "verschil", aisle: "alle", sort: "verschil", ...load("mealdeal.browse.v1", {}) };
  let shopView = load("mealdeal.shopview.v1", "rijen");     // Winkelen as "rijen" | "tegels" (#41)
  let browseOpen = null, browseShown = 0;
  let kindOpen = null;                                      // the List item whose kind is being changed (#43)

  function persist() {

    save("mealdeal.browse.v1", browse); save("mealdeal.shopview.v1", shopView);
  }

  // ── Resolution ────────────────────────────────────────────────────────
  const correctionKey = R.correctionKey;
  const resolved = {};
  /** The ten cheapest per unit; the first is the default Resolution. */
  function candidates(chainId, item) {

  }

    const fixed = R.correctedProduct(chainId, item, corrections);
    return fixed ? fixed.id : candidates(chainId, item)[0] || null;
  }

  // ── Basket pricing: prototype/resolve.js, shared with the digest ──────

  // Offers paid. Vergelijk and Winkelen always show this week: that is where

  if (!hasNextWeek) week = "nu"; // a remembered choice outlives the catalogue that offered it

  const nextFrom = () => { const days = Object.values(R.nextStarts).sort(); return days.length ? dayText(days[0]) : ""; };

  /** Whether an Offer is a real low (#18), as resolve.js judges it; with no history, nothing is claimed. */
  function verdict(p) {
    const v = R.verdict(p);
    if (!v) return "";
    const days = v.days === 1 ? tr("1 dag", "1 day") : v.days + tr(" dagen", " days");
    return {
      "shelf-up": '<span class="vd not">' + tr("normale prijs hoger dan recent: ", "regular price higher than lately: ") + euro(v.lowCents) + tr(" in ", " in ") + days + "</span>",
      "shelf-same": '<span class="vd">' + tr("normale prijs niet verhoogd in ", "regular price not raised in ") + days + "</span>",
      lowest: '<span class="vd low">' + tr("laagste prijs in ", "lowest price in ") + days + "</span>",
      "not-lower": '<span class="vd not">' + tr("niet lager dan recent: ", "no lower than lately: ") + euro(v.lowCents) + " in " + days + "</span>",
    }[v.kind];
  }
  /** An Offer's wording, then when it starts if it has not, or else whether it is a real low. */
  function offerChip(p, o) {
    const when = o.startsOn ? '<span class="vd later">' + tr("vanaf ", "from ") + esc(o.startsOn ? dayText(o.startsOn) : "") + "</span>"
      : o.continues ? '<span class="vd">' + tr("loopt al", "already running") + "</span>" + verdict(p) : verdict(p);
    return '<span class="o">' + esc(o.wording) + "</span>" + when;
  }
  const weekSwitch = () => '<div class="wk" role="group" aria-label="' + tr("Aanbiedingen van", "Offers of") + '">' +
    '<button data-act="week" data-id="nu" aria-pressed="' + (week === "nu") + '">' + tr("Deze week", "This week") + "</button>" +
    '<button data-act="week" data-id="volgende" aria-pressed="' + (week === "volgende") + '"' + (hasNextWeek ? "" : " disabled") + ">" + tr("Volgende week", "Next week") + "</button></div>";
  /** An item at one Chain: the Resolution, or the Correction, in whole packs. */
  const line = (chainId, item, w = "nu") => R.line(chainId, item, { week: w, corrections });

  // ── Klopt niet (#38) ────────────────────────────────────────────────
  // A ⚑ on every Product row: one tap records what the person saw, filled in
  // by the page, and a choice of what is wrong. Reports wait in this browser
  // until they are accepted, so one made with no signal goes when there is.
  // The ids go into the report as they are, in Dutch, whatever the page's language.
  const REPORT_WHAT = () => [["verkeerd product", tr("Verkeerd product", "Wrong product")], ["prijs klopt niet", tr("Prijs klopt niet", "Wrong price")],
    ["niet in de winkel", tr("Niet in de winkel", "Not in the store")], ["anders", tr("Iets anders", "Something else")]];
  const REPORT_QUEUE = "mealdeal.reports.v1";
  /** Where the person is: the page, Bladeren's view, and the item they typed or the Ingredient. */
  const where = (text) => PAGES[page].label + (page === "bladeren" ? " · " + browse.view : "") + (text ? " · " + text : "");
  const flag = (p, cents, context) => '<button class="kn" data-act="report" data-chain="' + esc(p.chainId) + '" data-id="' + esc(p.id) + '" data-cents="' + (cents ?? "") +

      '<header><div><span class="ct" style="--c:' + chain.color + '">' + esc(chain.name) + '</span><h2 id="sheet-title">' + tr("Klopt niet?", "Something wrong?") + "</h2>" +
      '<div class="meta">' + esc(p.name) + (sh.cents !== null ? " · " + euro(sh.cents) : "") + tr(" · prijzen van ", " · prices from ") + esc(chain.observedAt || "?") + "</div></div>" +
      '<button class="x" data-act="close" aria-label="' + tr("Sluiten", "Close") + '">✕</button></header><div class="body">';

      failed: tr("Niet verstuurd: dat lukt nu niet.", "Not sent: that is not possible right now.") })[sh.sent] + "</p>" +
      '<button class="btn" data-act="close">' + tr("Sluiten", "Close") + "</button></div></section>";
    return head + '<div class="choices" role="group" aria-label="' + tr("Wat klopt er niet?", "What is wrong?") + '">' + REPORT_WHAT().map(([id, label]) =>

      '<label class="note" for="report-note">' + tr("Toelichting, als je wilt", "Details, if you like") + '</label><textarea id="report-note" name="report-note" maxlength="500" placeholder="' +
      tr("Bijvoorbeeld: dit is half-om-half, geen rundergehakt", "For example: this is beef and pork, not ground beef") + '">' + esc(sh.note) + "</textarea>" +
      '<button class="btn" data-act="report-send"' + (sh.what ? "" : " disabled") + ">" + tr("Versturen", "Send") + "</button>" +

  // ── Exact Products (#15) ────────────────────────────────────────────

  // its own totals, and never added to a bag's total, which compares

  /** Turns a list item into one Exact Product, keeping a piece count typed as the number of packs. */
  function makeExact(itemId, exactId) {

  }
  /** One exact item at one Chain: its price, not comparable without EANs, or the Product likely the same. */
  function exactCell(r, c) {
    if (c.eans === false) {

        ? ' <span class="likely">' + tr("waarschijnlijk hetzelfde", "probably the same") + "</span> " + esc(l.p.name) + " " + euro(l.cost) + '<span class="nc">' + tr("telt niet mee", "not counted") + "</span>"
        : ' <span class="nc">' + tr("niet vergelijkbaar: " + esc(c.name) + " publiceert geen EAN", "not comparable: " + esc(c.name) + " publishes no EAN") + "</span>") + "</span>";

      (r.avail.length > 1 && l.cost === r.min ? ' <span class="delta zero">' + tr("laagst", "lowest") + "</span>" : r.avail.length > 1 ? ' <span class="delta">+' + euro(l.cost - r.min) + "</span>" : "") +
      (l.p.name !== r.item.noun ? ' <span class="nc">' + esc(l.p.name) + "</span>" : "") + " " + flag(l.p, l.cost, where(r.item.noun)) + "</span>";
  }
  const exactCard = (r) => '<div class="it"><div class="nm">' + esc(r.item.noun) + '<span class="xb">' + tr("exact product", "exact product") + "</span>" +

    '<div class="ops"><button data-act="staple" data-id="' + r.item.id + '" aria-pressed="' + r.item.staple + '" title="' + tr("Vaste boodschap", "Staple") + '">📌</button>' +
    '<button data-act="remove" data-id="' + r.item.id + '" title="' + tr("Van de lijst", "Remove from list") + '">✕</button></div>' +
    '<div class="xs">' + chains.map((c) => exactCell(r, c)).join("") + "</div></div>";
  const exactNote = () => '<p class="note">' + tr("Een exact product is hetzelfde merkartikel in dezelfde verpakking bij elke winkel, herkend aan dezelfde streepjescode (EAN). " +
    "Het wordt apart vergeleken en telt niet mee in de tassen, die per soort product vergelijken en vaak een huismerk kiezen.",
    "An exact product is the same brand item in the same pack at every store, recognized by the same barcode (EAN). " +
    "It is compared separately and does not count toward the bags, which compare by kind of product and often pick a store brand.") +
    (noEanChains.length ? " " + andList(noEanChains.map((c) => esc(c.name))) + tr(" publiceert geen EAN's: wat daar waarschijnlijk hetzelfde is, op merk, naam en verpakking, tonen we wel, maar telt nergens mee.",
      (noEanChains.length > 1 ? " publish" : " publishes") + " no EANs: what is probably the same there, by brand, name and pack, is shown but counted nowhere.") : "") + "</p>";

  const snapshot = () => R.compare(list, { corrections });
  function currentPlan(s) {

    }).join("") + "</div>";
  }

  // ── Recipes ───────────────────────────────────────────────────────────
  // EXAMPLE recipes: invented, written around what Dirk and Jumbo had on offer

  /** [id, name] per aisle, in the order a shop is walked, named in the page's language. */

  function browseIndex() {

  // ── Sheets ────────────────────────────────────────────────────────────
  // ── Price history (#16) ───────────────────────────────────────────────
  // An item's Daily Price per Chain per day: the lowest price per unit among
  // the Products satisfying it (resolve.js). A day nothing was observed is a
  // gap in the line, never bridged.
  const UNIT_TEXT = () => ({ kg: "per kg", l: "per liter", piece: tr("per stuk", "per piece") });
  const shortDay = (iso) => { const [y, m, d] = iso.split("-").map(Number); return dateText(new Date(y, m - 1, d), false); };
  function historyOf(item) {
    return chains.map((c) => ({ chain: c, ...R.dailyPrices(c.id, item) })).filter((h) => h.days.some(Boolean));
  }
  /** Runs of consecutive observed days, as [index, cents] pairs: one line each. */
  function runs(days) {
    const out = []; let cur = null;
    days.forEach((d, i) => { if (d) { (cur ??= []).push([i, d.cents]); } else if (cur) { out.push(cur); cur = null; } });
    if (cur) out.push(cur);
    return out;
  }
  /** The compact line on a list item: a trend, so no axes and no numbers. */
  function sparkline(item) {
    const hs = historyOf(item); if (!hs.length) return "";
    const n = hs[0].dates.length, all = hs.flatMap((h) => h.days.filter(Boolean).map((d) => d.cents));
    const lo = Math.min(...all), hi = Math.max(...all), y = (v) => hi === lo ? 16 : 28 - ((v - lo) / (hi - lo)) * 24 - 2;
    const x = (i) => n === 1 ? 150 : (i / (n - 1)) * 300;
    const lines = hs.map((h) => runs(h.days).map((run) => run.length === 1
      ? '<line x1="' + (x(run[0][0]) - 4) + '" x2="' + (x(run[0][0]) + 4) + '" y1="' + y(run[0][1]) + '" y2="' + y(run[0][1]) + '" stroke="' + h.chain.color + '" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
      : '<polyline fill="none" stroke="' + h.chain.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="' + run.map(([i, v]) => x(i) + "," + y(v)).join(" ") + '"/>').join("")).join("");
    const measured = hs[0].dates.filter((_, i) => hs.some((h) => h.days[i])).length;
    return '<button class="hist" data-act="history" data-id="' + item.id + '" aria-label="' + tr("Prijsverloop van ", "Price history of ") + esc(nounOf(item)) + '">' +
      '<svg viewBox="0 0 300 32" preserveAspectRatio="none" aria-hidden="true">' + lines + "</svg>" +
      '<span class="cap">' + tr("Prijsverloop · " + measured + (measured === 1 ? " dag" : " dagen") + " gemeten ›", "Price history · " + measured + (measured === 1 ? " day" : " days") + " measured ›") + "</span></button>";
  }
  let chartState = null; // what the open chart's crosshair reads
  function niceTicks(lo, hi) {
    const span = hi - lo || hi || 100, step0 = span / 3, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((f) => f * mag).find((s) => s >= step0) || mag * 10;
    const out = []; for (let v = Math.floor(lo / step) * step; v <= hi + step / 2; v += step) out.push(Math.round(v));
    return out;
  }
  function historySheet(itemId) {
    const item = list.find((i) => i.id === itemId); if (!item) return "";
    const hs = historyOf(item), dates = hs[0] ? hs[0].dates : [], unit = UNIT_TEXT()[item.unit] || "";
    const head = '<div class="scrim" data-act="close"></div><section class="sheet narrow" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<header><div><h2 id="sheet-title">' + esc(qtyText(item) + " " + nounOf(item)) + '</h2><div class="meta">' + tr("Laagste prijs " + unit + " per dag, per winkel", "Lowest price " + unit + " per day, per store") + "</div></div>" +
      '<button class="x" data-act="close" aria-label="' + tr("Sluiten", "Close") + '">✕</button></header><div class="hsheet">';
    if (!hs.length) { chartState = null; return head + '<p class="note">' + tr("Nog geen prijzen gemeten voor dit artikel.", "No prices measured for this item yet.") + "</p></div></section>"; }
    const W = Math.max(260, Math.min(window.innerWidth - 32, 520) - 40), H = 200, m = { l: 48, r: 14, t: 14, b: 26 };
    const all = hs.flatMap((h) => h.days.filter(Boolean).map((d) => d.cents));
    const ticks = niceTicks(Math.min(...all) * 0.95, Math.max(...all) * 1.05), lo = ticks[0], hi = ticks.at(-1);
    const n = dates.length, x = (i) => m.l + (n === 1 ? (W - m.l - m.r) / 2 : (i / (n - 1)) * (W - m.l - m.r));
    const y = (v) => m.t + (1 - (v - lo) / (hi - lo || 1)) * (H - m.t - m.b);
    chartState = { hs, dates, x, W, H, m, n, unit };
    const grid = ticks.map((t) => '<line class="grid" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>' +
      '<text class="tick" x="' + (m.l - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + euro(t) + "</text>").join("");
    const xl = [0, n - 1].filter((v, i, a) => a.indexOf(v) === i).map((i) => '<text class="tick" x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="' + (n === 1 ? "middle" : i === 0 ? "start" : "end") + '">' + shortDay(dates[i]) + "</text>").join("");
    const marks = hs.map((h) => {
      const lines = runs(h.days).map((run) => run.length > 1
        ? '<polyline fill="none" stroke="' + h.chain.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' + run.map(([i, v]) => x(i) + "," + y(v)).join(" ") + '"/>' : "").join("");
      // Dots: an Offer day, a day standing alone between gaps, and the latest day.
      const last = h.days.findLastIndex(Boolean);
      const dots = h.days.map((d, i) => d && (d.offer || i === last || (!h.days[i - 1] && !h.days[i + 1]))
        ? '<circle cx="' + x(i) + '" cy="' + y(d.cents) + '" r="4" fill="' + h.chain.color + '" stroke="var(--paper)" stroke-width="2"/>' : "").join("");
      return lines + dots;
    }).join("");
    const legend = '<div class="legend">' + hs.map((h) => {
      const seen = h.days.filter(Boolean), last = h.days.findLast(Boolean);
      return '<div><span class="k" style="--c:' + h.chain.color + '"></span><span class="nm">' + esc(h.chain.name) + "</span> " +
        '<span class="st">' + tr("laatst ", "latest ") + euro(last.cents) + (seen.length > 1 ? tr(" · laagste ", " · lowest ") + euro(Math.min(...seen.map((d) => d.cents))) + tr(" · hoogste ", " · highest ") + euro(Math.max(...seen.map((d) => d.cents))) : "") + "</span></div>";
    }).join("") + "</div>";
    const table = '<details><summary class="note">' + tr("Als tabel", "As a table") + "</summary><table><thead><tr><th>" + tr("Dag", "Day") + "</th>" + hs.map((h) => "<th>" + esc(h.chain.name) + "</th>").join("") + "</tr></thead><tbody>" +
      dates.map((d, i) => "<tr><td>" + shortDay(d) + "</td>" + hs.map((h) => "<td>" + (h.days[i] ? euro(h.days[i].cents) + (h.days[i].offer ? " *" : "") : "—") + "</td>").join("") + "</tr>").join("") + "</tbody></table></details>";
    return head + legend +
      '<div class="chart"><svg width="' + W + '" height="' + H + '" role="img" aria-label="' + tr("Laagste prijs " + unit + " per dag voor ", "Lowest price " + unit + " per day for ") + esc(nounOf(item)) + '">' + grid + xl + marks +
      '<line class="xh" x1="0" x2="0" y1="' + m.t + '" y2="' + (H - m.b) + '" visibility="hidden"/>' +
      '<rect class="hit" tabindex="0" aria-label="' + tr("Verschuif met de pijltjes", "Move with the arrow keys") + '" x="' + m.l + '" y="' + m.t + '" width="' + (W - m.l - m.r) + '" height="' + (H - m.t - m.b) + '"/></svg>' +
      '<div class="tip" hidden></div></div>' +
      '<p class="note">' + tr(n + (n === 1 ? " dag" : " dagen") + " sinds de eerste meting. Een gat in een lijn: die dag niet gemeten. Een stip: een aanbieding (* in de tabel). Prijzen gaan niet verder terug dan de eerste dag dat ze zijn vastgelegd.",
        n + (n === 1 ? " day" : " days") + " since the first measurement. A gap in a line: not measured that day. A dot: an offer (* in the table). Prices go back no further than the first day they were recorded.") + "</p>" +
      table + "</div></section>";
  }
  /** The crosshair: snaps to the nearest day and lists every Chain's price on it. */
  function showDay(chartEl, i) {
    const st = chartState; if (!st) return;
    i = Math.max(0, Math.min(st.n - 1, i)); st.at = i;
    const line = chartEl.querySelector(".xh"), tip = chartEl.querySelector(".tip"), px = st.x(i);
    line.setAttribute("x1", px); line.setAttribute("x2", px); line.setAttribute("visibility", "visible");
    tip.textContent = "";
    const day = document.createElement("div"); day.textContent = shortDay(st.dates[i]); day.className = "note"; tip.append(day);
    for (const h of st.hs) {
      const row = document.createElement("div"), key = document.createElement("span"), val = document.createElement("b"), nm = document.createElement("span");
      key.className = "k"; key.style.setProperty("--c", h.chain.color);
      val.textContent = h.days[i] ? euro(h.days[i].cents) : "—";
      nm.textContent = " " + h.chain.name + (h.days[i] ? (h.days[i].offer ? tr(" · aanbieding", " · on sale") : "") : tr(" · niet gemeten", " · not measured"));
      row.append(key, val, nm); tip.append(row);
    }
    tip.hidden = false;
    tip.style.left = Math.min(Math.max(px - tip.offsetWidth / 2, 0), st.W - tip.offsetWidth) + "px";
    tip.style.top = (st.m.t - tip.offsetHeight - 6 < -40 ? st.m.t : -tip.offsetHeight - 6) + "px";
  }
  document.addEventListener("pointermove", (e) => {

  document.addEventListener("keydown", (e) => {

  });
  document.addEventListener("focusin", (e) => { if (e.target.closest && e.target.closest(".chart .hit") && chartState) showDay(e.target.closest(".chart"), chartState.at ?? chartState.n - 1); });

  });
  document.getElementById("lang").addEventListener("click", () => {
    lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
    save("mealdeal.lang.v1", lang); hint = ""; applyLang(); render();
  });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (PAGE_KEYS.includes(h) && h !== page) { page = h; render(); } });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && sheet) { sheet = null; render(); return; }
    const card = e.target.closest?.('[data-act="open-recipe"][role="button"]');
    if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); sheet = { kind: "recipe", id: card.dataset.id }; render(); }
  });
  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const input = e.target.querySelector("input[name=q]"), parsed = parse(input.value);
    if (!parsed) { hint = tr("!Niet gelezen. Probeer “500 g rundergehakt” of “2 courgettes”.", "!Could not read that. Try “500 g ground beef” or “2 zucchini”."); render(); return; }
    const fresh = { id: newId(), staple: false, ...parsed };
    list.unshift(fresh);
    hint = tr("Toegevoegd: ", "Added: ") + qtyText(parsed) + " " + parsed.noun;
    const matches = R.exactMatches(input.value);
    exactOffer = matches.length ? { itemId: fresh.id, matches } : null;
    input.value = "";
    persist(); render();
  });
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id, item = list.find((i) => i.id === id);
    switch (b.dataset.act) {
      case "week": week = id === "volgende" && hasNextWeek ? "volgende" : "nu"; break;
      case "go": page = id; hint = ""; exactOffer = null; history.replaceState(null, "", "#" + id); window.scrollTo(0, 0); break;
      case "staple": if (item) item.staple = !item.staple; break;
      case "remove": list = list.filter((i) => i.id !== id); done.delete(id); break;
      case "unit": {
        // Cycle kg -> l -> pieces, keeping the number: a guessed unit is usually wrong in kind, not amount.
        // An Ingredient compares in its own unit, so only an unrecognised item cycles.
        if (item && !item.ingredient) { const order = ["kg", "l", "piece"]; item.unit = order[(order.indexOf(item.unit) + 1) % 3]; item.guessed = false; }
        break;
      }
      case "plan": plan = { kind: "single", ids: [id] }; break;
      case "combo": { const s = snapshot(); if (s.combo) plan = { kind: "combo", ids: s.combo.ids.slice() }; break; }
      case "row": openRow = openRow === id ? null : id; break;
      case "kind-open": kindOpen = kindOpen === id ? null : id; break;
      case "kind": {
        // Keeps the amount and Preferences: only which Variant, and so the name, changes.
        if (!item || !kindsOf(item)) break;
        const v = b.dataset.v || null;
        if (v) { item.variant = v; delete item.anyKind; } else { item.variant = null; item.anyKind = true; }
        item.noun = R.label(item.ingredient, v, lang);
        kindOpen = null;
        break;
      }
      case "fix": sheet = { kind: "fix", chainId: b.dataset.chain, itemId: id }; break;
      case "pick": { const it = list.find((i) => i.id === sheet.itemId); if (it) corrections[correctionKey(sheet.chainId, it)] = id; sheet = null; break; }
      case "unfix": { const it = list.find((i) => i.id === sheet.itemId); if (it) delete corrections[correctionKey(sheet.chainId, it)]; sheet = null; break; }
      case "make-exact": makeExact(b.dataset.item, id); exactOffer = null; sheet = null; break;
      case "packs": if (item && item.exact) item.quantity = item.quantity % 9 + 1; break;
      case "tick": done.has(id) ? done.delete(id) : done.add(id); break;
      case "shop-view": shopView = id; break;
      case "finish": list = list.filter((i) => i.staple || !done.has(i.id)); done.clear(); page = "lijst"; history.replaceState(null, "", "#lijst"); break;
      case "recipe": addRecipe(id); break;
      case "all-recipes": showAllRecipes = true; break;
      case "open-recipe": sheet = { kind: "recipe", id }; break;
      case "history": sheet = { kind: "history", itemId: id }; break;
      case "suggest": {
        // Read the item again with the suggested name in place of the typo, keeping its quantity.
        const name = item && R.suggest(item.noun), text = name && item.text.toLowerCase().replace(item.noun.toLowerCase(), name);
        const fixed = text && parse(text);
        if (fixed) { Object.assign(item, fixed, { id: item.id, staple: item.staple }); delete item.suggestion; hint = tr("Aangepast: ", "Changed: ") + qtyText(fixed) + " " + fixed.noun; }
        break;
      }
      case "step": { const set = (stepsDone[sheet.id] ||= new Set()); const n = Number(id); set.has(n) ? set.delete(n) : set.add(n); break; }
      case "browse-view": browse.view = id; browseOpen = null; browseShown = 0; break;
      case "browse-sort": browse.sort = id; browseShown = 0; break;
      case "browse-aisle": browse.aisle = id; browseOpen = null; browseShown = 0; break;
      case "browse-row": browseOpen = browseOpen === id ? null : id; break;
      case "browse-more": browseShown += BROWSE_PAGE; break;
      case "browse-add": {
        const d = R.vocabulary.get(id), parsed = d && ingredientItem(d);
        if (!parsed || onList(d)) break;
        list.unshift({ id: newId(), staple: false, ...parsed }); hint = tr("Op je lijst: ", "On your list: ") + qtyText(parsed) + " " + nounOf(parsed);
        break;
      }
      case "make-exact-new": {
        const g = R.exact.get(id); if (!g) break;
        if (!list.some((i) => i.exact === g.id)) list.unshift({ id: newId(), staple: false, exact: g.id, text: g.name, noun: g.name, quantity: 1, unit: "piece",
          guessed: false, ingredient: null, variant: null, preferences: {} });
        hint = tr("Op je lijst, als exact product: ", "On your list, as an exact product: ") + g.name;
        break;
      }
      case "report": sheet = { kind: "report", chainId: b.dataset.chain, pid: id, cents: b.dataset.cents === "" ? null : Number(b.dataset.cents), context: b.dataset.ctx, what: null, note: "", sent: null }; break;
      case "report-what": sheet.what = id; break;
      case "report-send": {
        const sh = sheet, p = products[sh.chainId][sh.pid], chain = chainById(sh.chainId);
        save(REPORT_QUEUE, [...load(REPORT_QUEUE, []), { what: sh.what, chain: sh.chainId, ref: p.id.slice(sh.chainId.length + 1), name: p.name,
          ingredient: p.ingredient, variant: p.variant, cents: sh.cents, observedAt: chain.observedAt, context: sh.context, note: sh.note, lang }]);
        b.disabled = true;
        flushReports().then((how) => { if (sheet === sh) { sh.sent = how || "sent"; render(); } });
        return;
      }
      case "close": sheet = null; break;
      default: return;
    }
    persist(); render();
  });

  applyLang();
  persist(); // keeps a list or Correction migrated on load (#14)
  render();

  // Offline support needs a server; opened from disk the page works without it.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* the page still works online */ });
  }
  document.addEventListener("input", (e) => { if (e.target.name === "report-note" && sheet && sheet.kind === "report") sheet.note = e.target.value; });
  flushReports(); // anything reported with no signal last time
  addEventListener("online", () => { flushReports(); render(); });
  addEventListener("offline", render);
</script>
