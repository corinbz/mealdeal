<!--
  PROTOTYPE, throwaway. Three concepts, each a different organising idea, each
  with all three jobs (list, compare, shop), each built for many chains and a
  phone first. Switch with the bar at the top or ?variant=A..C.

    A  Ranglijst    — shops ranked like a race: position, total, gap to the leader;
                      every item gets a podium
    B  Prijsraster  — items × shops, each cell coloured cheap→dear within its row;
                      the colour is where the difference is
    C  Samensteller — per item, a row of shop chips sorted by price; tap where you
                      buy it, a running receipt counts shops and money

  Dirk and Jumbo are real. "6" adds four EXAMPLE chains with invented names and
  prices derived from the real ones, marked "vb" everywhere — only to test scale.
  In-memory state. Open from disk after `node scripts/catalogue-from-db.ts`.
-->

<script>
  if (!window.CATALOGUE) { document.getElementById("root").textContent = "Run node scripts/catalogue-from-db.ts first."; throw new Error("no catalogue"); }
  const data = window.CATALOGUE;

  // ── Core, as in basket.html ─────────────────────────────────────────
  const euro = (c) => "€" + (c / 100).toFixed(2).replace(".", ",");
  const plus = (c) => "+" + euro(c);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  function stem(w) { let b; do { b = w; if (w.length > 4) w = w.replace(/(jes|je|en|e|s)$/, ""); } while (w !== b); return w; }
  const wordsOf = (noun) => noun.toLowerCase().split(/[^\p{L}]+/u).filter((w) => w.length > 1).map(stem);
  const products = {}, searchable = {};
  for (const c of data.chains) {
    products[c.id] = {};
    searchable[c.id] = data.catalogue[c.id].map((r) => {
      const id = c.id + "-" + r[0];
      products[c.id][id] = { id, name: r[1], packaging: r[2], packQuantity: r[3], packUnit: r[4], comparisonUnit: r[5],
        shelfPriceCents: r[6], offerPriceCents: r[7], unitPriceCents: r[8], offerWording: r[9], offerUpcoming: r[10] === 1 };
      return { id, unit: r[5], words: r[1].toLowerCase().split(/[^\p{L}]+/u).filter(Boolean).map(stem) };
    });
  }
  const matching = (cid, unit, words) => searchable[cid].filter((p) =>
    (unit === null || p.unit === unit) && words.every((w) => p.words.some((n) => n.endsWith(w))));
  const UNITS = { g: ["kg", .001], gr: ["kg", .001], gram: ["kg", .001], kg: ["kg", 1], kilo: ["kg", 1], ml: ["l", .001], cl: ["l", .01],
    l: ["l", 1], liter: ["l", 1], x: ["piece", 1], "×": ["piece", 1], st: ["piece", 1], stuk: ["piece", 1], stuks: ["piece", 1] };
  function parse(text) {
    const t = text.trim().replace(/\s+/g, " "); if (!t) return null;
    let quantity = null, unit = null, noun = t;
    const m = t.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
    if (m) {
      quantity = Number(m[1].replace(",", ".")); noun = m[2];
      const [first, ...rest] = noun.split(" "); const u = UNITS[first.toLowerCase().replace(/\.$/, "")];
      if (u && rest.length) { unit = u[0]; quantity *= u[1]; noun = rest.join(" "); }
    }
    if (!noun || UNITS[noun.toLowerCase()] || !(quantity === null || quantity > 0)) return null;
    if (unit === null) {
      const tally = { kg: 0, l: 0, piece: 0 };
      for (const c of data.chains) for (const p of matching(c.id, null, wordsOf(noun))) tally[p.unit]++;
      if (quantity !== null && tally.piece > 0) unit = "piece";
      else { unit = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0]; if (!tally[unit]) unit = "piece"; }
      if (quantity === null) quantity = 1;
    }
    return { noun, quantity: Math.round(quantity * 1000) / 1000, unit };
  }
  const resolved = {};
  function realLine(cid, item) {
    const key = cid + "|" + item.unit + "|" + item.noun;
    resolved[key] ??= matching(cid, item.unit, wordsOf(item.noun)).map((s) => products[cid][s.id])
      .sort((a, b) => a.unitPriceCents - b.unitPriceCents || a.shelfPriceCents - b.shelfPriceCents)[0] || null;
    const p = resolved[key]; if (!p) return null;
    const offer = (p.offerPriceCents !== null || p.offerWording) && !p.offerUpcoming ? (p.offerWording || "actie") : null;
    const price = offer && p.offerPriceCents ? p.offerPriceCents : p.shelfPriceCents;
    const known = p.packQuantity > 0 && p.packUnit === item.unit;
    const packs = known ? Math.max(1, Math.ceil(item.quantity / p.packQuantity)) : 1;
    return { p, offer, packs, cost: packs * price, over: known ? p.packQuantity / item.quantity : 1 };
  }
  const qtyText = (i) => i.unit === "piece" ? i.quantity + "×" : (i.unit === "kg" && i.quantity < 1 ? i.quantity * 1000 + " g"
    : i.unit === "l" && i.quantity < 1 ? i.quantity * 1000 + " ml" : i.quantity + " " + i.unit);

  // ── Chains: two real, four EXAMPLES with invented names, only to test scale ──
  const COLOURS = ["#1f7a5c", "#b03a64", "#2f62b3", "#d07a1c", "#6a4fb0", "#178a96"];
  const REAL = data.chains.map((c, i) => ({ ...c, color: COLOURS[i], sim: false }));
  const EXAMPLES = [
    { id: "x1", name: "Kade", base: 0.94, miss: 0.08 }, { id: "x2", name: "Buurtsuper", base: 1.18, miss: 0.2 },
    { id: "x3", name: "Groothal", base: 0.86, miss: 0.14 }, { id: "x4", name: "Markt Negen", base: 1.04, miss: 0.04 },
  ].map((c, i) => ({ ...c, color: COLOURS[i + 2], sim: true }));
  const hash = (s) => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return ((h >>> 0) % 10000) / 10000; };
  function simLine(ch, item, reals) {
    const base = reals.filter(Boolean).sort((a, b) => a.cost - b.cost)[0];
    if (!base || hash(ch.id + "|m|" + item.noun) < ch.miss) return null;
    const f = ch.base * (0.82 + 0.36 * hash(ch.id + "|f|" + item.noun));
    return { p: { name: "Voorbeeldproduct " + item.noun, packaging: base.p.packaging }, offer: null, packs: base.packs,
      cost: Math.max(19, Math.round(base.cost * f)), over: base.over };
  }
  const tag = (c) => '<span class="tag" style="--c:' + c.color + '">' + esc(c.name) + (c.sim ? ' <span class="vb">vb</span>' : "") + "</span>";

  // ── State (in memory) ───────────────────────────────────────────────
  let nid = 0;
  let list = ["1 kg kruimige aardappelen", "250 g champignons", "2 courgettes", "500 g rundergehakt", "400 g broccoli",
    "1 komkommer", "1 l halfvolle melk", "1 kg uien", "350 g pindakaas", "400 g spinazie", "6 eieren", "500 g wortelen"]
    .map((t) => ({ id: "i" + nid++, staple: false, ...parse(t) }));
  for (const n of ["halfvolle melk", "eieren", "pindakaas", "uien"]) list.find((i) => i.noun === n).staple = true;
  const qs = new URLSearchParams(location.search);
  let variant = ["A", "B", "C"].includes(qs.get("variant")) ? qs.get("variant") : "A";
  let page = ["lijst", "vergelijk", "winkelen"].includes(qs.get("page")) ? qs.get("page") : "vergelijk";
  let chainCount = qs.get("chains") === "2" ? 2 : 6;
  // How items are sourced. base: "single" (one shop), "combo" (best pair) or "cheap" (each item's cheapest).
  // pick: per-item overrides (C sets these).
  let plan = { base: "single", shop: null };
  const pick = {};
  const done = new Set();
  let openLoss = null, hint = "";

  const allChains = () => chainCount === 6 ? [...REAL, ...EXAMPLES] : REAL;
  const byId = (id) => [...REAL, ...EXAMPLES].find((c) => c.id === id);

  function snapshot() {
    const chains = allChains();
    const rows = list.map((item) => {
      const reals = REAL.map((c) => realLine(c.id, item));
      const by = {}; REAL.forEach((c, i) => { by[c.id] = reals[i]; });
      for (const c of chains) if (c.sim) by[c.id] = simLine(c, item, reals);
      const avail = chains.filter((c) => by[c.id]).sort((a, b) => by[a.id].cost - by[b.id].cost);
      return { item, by, avail, min: avail.length ? by[avail[0].id].cost : null, max: avail.length ? by[avail.at(-1).id].cost : null };
    });
    const totals = chains.map((c) => {
      let cost = 0, filled = 0;
      for (const r of rows) if (r.by[c.id]) { filled++; cost += r.by[c.id].cost; }
      return { chain: c, cost, filled, total: rows.length, full: filled === rows.length && rows.length > 0 };
    }).sort((a, b) => b.full - a.full || a.cost - b.cost);
    const best = totals.find((t) => t.full) || null;
    let combo = null;
    for (let i = 0; i < chains.length; i++) for (let j = i + 1; j < chains.length; j++) {
      const a = chains[i], b = chains[j]; let cost = 0, filled = 0; const from = {};
      for (const r of rows) {
        const la = r.by[a.id], lb = r.by[b.id]; if (!la && !lb) continue;
        filled++; const p = !lb || (la && la.cost <= lb.cost) ? a : b; from[r.item.id] = p.id; cost += r.by[p.id].cost;
      }
      const cand = { ids: [a.id, b.id], cost, filled, from };
      if (!combo || cand.filled > combo.filled || (cand.filled === combo.filled && cand.cost < combo.cost)) combo = cand;
    }
    if (combo && (combo.filled < rows.length || (best && combo.cost >= best.cost) || new Set(Object.values(combo.from)).size < 2)) combo = null;
    return { chains, rows, totals, best, combo };
  }
  /** Where an item is bought under the current plan, or null. */
  function sourceOf(r, s) {
    const p = pick[r.item.id];
    if (p && r.by[p]) return p;
    if (plan.base === "cheap") return r.avail[0]?.id || null;
    if (plan.base === "combo" && s.combo) return s.combo.from[r.item.id] || null;
    const shop = plan.shop && s.chains.some((c) => c.id === plan.shop) ? plan.shop : (s.best || s.totals[0]).chain.id;
    return r.by[shop] ? shop : null;
  }
  function planTotals(s) {
    const per = {}; let total = 0, missing = 0;
    for (const r of s.rows) { const c = sourceOf(r, s); if (!c) { missing++; continue; } per[c] = (per[c] || 0) + r.by[c].cost; total += r.by[c].cost; }
    return { per, total, missing, shops: Object.keys(per) };
  }
  const pages = (labels) => ["lijst", "vergelijk", "winkelen"].map((k, i) => ({ k, label: labels[i] }));
  function nav(labels, icons) {
    const items = pages(labels);
    const b = (cls) => '<nav class="nav ' + cls + '">' + items.map(({ k, label }, i) =>
      '<button data-act="go" data-id="' + k + '"' + (k === page ? ' aria-current="page"' : "") + '><span class="ic">' + icons[i] + "</span>" + label + "</button>").join("") + "</nav>";
    return [b("top"), b("bottom")];
  }
  const addForm = (ph) => '<form class="add"><input name="q" placeholder="' + ph + '" autocomplete="off"><button>Erbij</button></form><p class="hint">' + esc(hint) + "</p>";

  // ════════════════════════════════════════════════════════════════════
  // A · RANGLIJST
  // ════════════════════════════════════════════════════════════════════
  function A(s) {
    const [navTop, navBottom] = nav(["Lijst", "Stand", "Winkelen"], ["☰", "🏁", "✓"]);
    const head = '<div class="A-head"><div class="A-brand"><b>M</b>ealdeal</div>' + navTop + "</div>";
    let body = "";
    const pt = planTotals(s);
    if (page === "vergelijk") {
      const lead = s.best;
      const maxGap = Math.max(1, ...s.totals.filter((t) => t.full).map((t) => t.cost - lead.cost));
      const chosen = (id) => plan.base === "single" && sourceOfShop(s) === id;
      const row = (t, pos) => {
        const gap = lead && t.full ? t.cost - lead.cost : null;
        const isLead = lead && t.chain.id === lead.chain.id;
        return '<button class="A-row' + (isLead ? " lead" : "") + '" style="--c:' + t.chain.color + '" data-act="shop" data-id="' + t.chain.id + '" aria-pressed="' + chosen(t.chain.id) + '">' +
          '<span class="pos">' + (t.full ? pos : "–") + '</span><span class="bar"></span><span class="nm">' + esc(t.chain.name) + (t.chain.sim ? '<span class="vb">vb</span>' : "") + "</span>" +
          '<span class="cov' + (t.full ? "" : " bad") + '">' + t.filled + "/" + t.total + '</span><span class="tot">' + (t.full ? "" : "≥") + euro(t.cost) + "</span>" +
          '<span class="gap">' + (isLead ? "LEIDER" : gap !== null ? plus(gap) : (t.total - t.filled) + " mist") + "</span>" +
          (gap ? '<span class="gapbar"><i style="width:' + Math.round(gap / maxGap * 100) + '%"></i></span>' : "") + "</button>" +
          (openLoss === t.chain.id && !isLead && lead ? loss(t) : "");
      };
      const loss = (t) => {
        const worst = s.rows.filter((r) => r.by[t.chain.id] && r.by[lead.chain.id]).map((r) => ({ r, d: r.by[t.chain.id].cost - r.by[lead.chain.id].cost }))
          .filter((x) => x.d > 0).sort((a, b) => b.d - a.d).slice(0, 3);
        return '<div class="A-loss">Verliest het meest op ' + worst.map((x) => "<b>" + esc(x.r.item.noun) + "</b> " + plus(x.d)).join(", ") + ".</div>";
      };
      const full = s.totals.filter((t) => t.full), part = s.totals.filter((t) => !t.full);
      let combo = "";
      if (s.combo && lead) {
        const [a, b] = s.combo.ids.map(byId);
        combo = '<button class="A-row combo" style="--c1:' + a.color + ";--c2:" + b.color + '" data-act="combo" aria-pressed="' + (plan.base === "combo") + '">' +
          '<span class="pos">DUO</span><span class="bar"></span><span class="nm">' + esc(a.name) + " + " + esc(b.name) + "</span>" +
          '<span class="cov">2 winkels</span><span class="tot">' + euro(s.combo.cost) + '</span><span class="gap" style="color:var(--good)">−' + euro(lead.cost - s.combo.cost).slice(1) + "</span></button>";
      }
      const pods = s.rows.slice().sort((a, b) => (b.max - b.min) - (a.max - a.min)).map((r) => {
        if (!r.avail.length) return '<div class="A-pod"><div class="it">' + esc(r.item.noun) + "<small>nergens te koop</small></div></div>";
        const top = r.avail.slice(0, 3), rest = r.avail.length - 3;
        return '<div class="A-pod"><div class="it">' + esc(r.item.noun) + "<small>" + qtyText(r.item) + (r.avail.length > 1 ? " · verschil " + euro(r.max - r.min) : "") + "</small></div><ol>" +
          top.map((c, i) => '<li class="' + (i ? "" : "first") + '"><span class="p">' + (i + 1) + "</span>" + tag(c) + ' <span class="v">' + euro(r.by[c.id].cost) + "</span>" +
            (i ? ' <span class="d">' + plus(r.by[c.id].cost - r.min) + "</span>" : "") + "</li>").join("") +
          (rest > 0 ? '<li class="more">+' + rest + " duurder, tot " + plus(r.max - r.min) + "</li>" : "") + "</ol></div>";
      }).join("");
      body = '<h1 class="A-h1">' + (lead ? esc(lead.chain.name) + " leidt" : "Geen winnaar") + '</h1><p class="A-sub">' + (lead ? "Je hele lijst voor " + euro(lead.cost) + ". Achterstand per winkel, tik om te kiezen; tik nog eens voor waar hij verliest." : "Geen enkele winkel heeft alles.") + "</p>" +
        '<div class="A-board">' + combo + full.map((t, i) => row(t, i + 1)).join("") + "</div>" +
        (part.length ? '<div class="A-divider">Niet compleet — totaal is een ondergrens</div><div class="A-board">' + part.map((t) => row(t, 0)).join("") + "</div>" : "") +
        '<div class="A-sec"><h2>Podium per artikel</h2><span>grootste verschil eerst</span></div>' + pods;
    } else if (page === "lijst") {
      const li = (r) => {
        const w = r.avail[0], second = r.avail[1];
        return '<div class="A-li"><span class="nm">' + esc(r.item.noun) + "<small>" + qtyText(r.item) + "</small></span>" +
          '<span class="win">' + (w ? '<span class="p1">P1</span>' + tag(w) + ' <span class="v">' + euro(r.min) + "</span>" + (second ? '<span class="d">P2 ' + plus(r.by[second.id].cost - r.min) + "</span>" : "") : '<span class="d">nergens te koop</span>') + "</span>" +
          '<span class="ops"><button data-act="staple" data-id="' + r.item.id + '" aria-pressed="' + r.item.staple + '" title="Vaste boodschap">📌</button><button data-act="remove" data-id="' + r.item.id + '" title="Weg">✕</button></span></div>';
      };
      const once = s.rows.filter((r) => !r.item.staple), st = s.rows.filter((r) => r.item.staple);
      body = '<h1 class="A-h1">Je lijst</h1><p class="A-sub">Per artikel: wie wint (P1) en hoeveel de nummer twee achterligt.</p>' + addForm("500 g rundergehakt, 2 courgettes…") +
        '<div class="A-sec"><h2>Deze keer</h2><span>' + once.length + "</span></div>" + once.map(li).join("") +
        '<div class="A-sec"><h2>Vast</h2><span>' + st.length + " · blijven staan</span></div>" + st.map(li).join("") +
        '<div class="A-cta"><span>' + pt.shops.map((id) => esc(byId(id).name)).join(" + ") + " · <b>" + euro(pt.total) + '</b></span><button data-act="go" data-id="vergelijk">Bekijk de stand</button></div>';
    } else body = shopPage(s, pt, "A");
    return '<div class="wrap">' + head + body + "</div>" + navBottom;
  }
  const sourceOfShop = (s) => plan.shop && s.chains.some((c) => c.id === plan.shop) ? plan.shop : (s.best || s.totals[0]).chain.id;

  // Winkelen, shared structure, each concept's classes
  function shopPage(s, pt, V) {
    const groups = pt.shops.map((id) => ({ c: byId(id), rows: s.rows.filter((r) => sourceOf(r, s) === id) }));
    const nowhere = s.rows.filter((r) => !sourceOf(r, s));
    let left = 0, ticked = 0, n = 0;
    for (const g of groups) for (const r of g.rows) { n++; if (done.has(r.item.id)) ticked++; else left += r.by[g.c.id].cost; }
    const h1 = V === "A" ? '<h1 class="A-h1">Winkelen</h1>' : V === "B" ? '<h1 class="B-h1">Winkelen</h1>' : '<h1 class="C-h1">Winkelen</h1>';
    const sub = '<p class="' + V + '-sub">' + groups.length + " winkel" + (groups.length > 1 ? "s" : "") + " · " + euro(pt.total) + (nowhere.length ? " · " + nowhere.length + " nergens in je plan" : "") + "</p>";
    const shops = groups.map(({ c, rows }) => '<section class="' + V + '-shop" style="--c:' + c.color + '"><header><b>' + esc(c.name) + (c.sim ? ' <span class="vb">vb</span>' : "") + "</b><span>" + rows.length + " · " + euro(pt.per[c.id]) + "</span></header>" +
      rows.map((r) => {
        const l = r.by[c.id], d = done.has(r.item.id);
        return '<button class="' + V + "-ci" + (d ? " done" : "") + '" data-act="tick" data-id="' + r.item.id + '"><span class="t">' + (d ? "✓" : "") + '</span><span class="nm">' + esc(r.item.noun) + " · " + qtyText(r.item) + "</span>" +
          '<span class="g">' + (l.offer ? esc(l.offer) + " · " : "") + (l.packs > 1 ? l.packs + "× " : "") + esc(l.p.name) + (l.p.packaging ? " · " + esc(l.p.packaging) : "") + '</span><span class="v">' + euro(l.cost) + "</span></button>";
      }).join("") + "</section>").join("");
    const pct = n ? Math.round(ticked / n * 100) : 0;
    const prog = V === "A" ? '<div class="A-lap"><b>' + ticked + "/" + n + '</b><span class="tr"><i style="width:' + pct + '%"></i></span><span>' + euro(left) + " te gaan</span>" + (ticked ? '<button data-act="finish">Finish</button>' : "") + "</div>"
      : V === "B" ? '<div class="B-prog"><span>' + ticked + "/" + n + '</span><span class="tr"><i style="width:' + pct + '%"></i></span><span>' + euro(left) + "</span>" + (ticked ? '<button data-act="finish">Klaar</button>' : "") + "</div>"
      : "";
    return h1 + sub + shops + prog;
  }

  // ════════════════════════════════════════════════════════════════════
  // B · PRIJSRASTER
  // ════════════════════════════════════════════════════════════════════
  const heat = (t) => { // 0 cheap → 1 dear: mint → sand → coral
    const stops = [[143, 214, 184], [242, 221, 140], [240, 165, 143]];
    const x = Math.max(0, Math.min(1, t)) * 2, i = Math.min(1, Math.floor(x)), f = x - i;
    const [a, b] = [stops[i], stops[i + 1]];
    return "rgb(" + a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(",") + ")";
  };
  function B(s) {
    const [navTop, navBottom] = nav(["Lijst", "Raster", "Winkelen"], ["☰", "▦", "✓"]);
    const head = '<div class="B-head"><div class="B-brand"><span></span> mealdeal</div>' + navTop + "</div>";
    const pt = planTotals(s);
    let body = "";
    if (page === "vergelijk") {
      const cols = s.totals; // ranked
      const base = s.best ? s.best.cost : null;
      const selShop = plan.base === "single" ? sourceOfShop(s) : null;
      const th = cols.map((t) => {
        const d = base !== null && t.full ? t.cost - base : null;
        return '<th><button class="B-col" style="--c:' + t.chain.color + '" data-act="shop" data-id="' + t.chain.id + '" aria-pressed="' + (selShop === t.chain.id) + '">' +
          '<span class="n">' + esc(t.chain.name) + (t.chain.sim ? ' <span class="vb">vb</span>' : "") + '</span><span class="t">' + (t.full ? "" : "≥") + euro(t.cost) + "</span>" +
          '<span class="d' + (d === 0 ? " z" : "") + '">' + (d === null ? t.total - t.filled + " mist" : d ? plus(d) : "laagst") + '</span><span class="cv">' + t.filled + "/" + t.total + "</span></button></th>";
      }).join("");
      const rows = s.rows.map((r) => '<tr><th class="rh">' + esc(r.item.noun) + "<small>" + qtyText(r.item) + "</small></th>" + cols.map((t) => {
        const l = r.by[t.chain.id];
        if (!l) return '<td class="B-cell no' + (selShop === t.chain.id ? " sel" : "") + '">—</td>';
        const x = r.max > r.min ? (l.cost - r.min) / (r.max - r.min) : 0;
        return '<td class="B-cell' + (l.cost === r.min ? " min" : "") + (selShop === t.chain.id ? " sel" : "") + '" style="background:' + heat(x) + '" title="' + esc(t.chain.name + " · " + l.p.name) + '">' + euro(l.cost).slice(1) + "</td>";
      }).join("") + "</tr>").join("");
      const combo = s.combo && s.best ? (() => { const [a, b] = s.combo.ids.map(byId); return '<div class="B-combo"><span>Twee winkels: ' + tag(a) + " + " + tag(b) + " = <b>" + euro(s.combo.cost) + "</b>, " + euro(s.best.cost - s.combo.cost) + " minder dan alleen " + esc(s.best.chain.name) + '</span><button data-act="combo" aria-pressed="' + (plan.base === "combo") + '">' + (plan.base === "combo" ? "Gekozen" : "Kies combinatie") + "</button></div>"; })() : "";
      body = '<h1 class="B-h1">' + (s.best ? esc(s.best.chain.name) + " is het goedkoopst voor je lijst" : "Geen winkel heeft alles") + '</h1><p class="B-sub">Elke rij is één artikel, gekleurd van goedkoop naar duur binnen die rij. Omkaderd is het laagste. Tik een winkel om te kiezen.</p>' +
        '<div class="B-legend"><span>goedkoop</span><i></i><span>duur</span><span>· gestreept = niet te koop</span></div>' +
        '<div class="B-scroll"><table class="B-grid"><thead><tr><th class="rh" style="vertical-align:bottom">Artikel</th>' + th + "</tr></thead><tbody>" + rows + "</tbody></table></div>" + combo;
    } else if (page === "lijst") {
      const order = s.totals.map((t) => t.chain);
      const li = (r) => '<div class="B-li"><span class="nm">' + esc(r.item.noun) + "<small>" + qtyText(r.item) + '</small></span><span class="strip">' + order.map((c) => {
        const l = r.by[c.id]; if (!l) return '<i class="no" title="' + esc(c.name) + ': niet te koop"></i>';
        const x = r.max > r.min ? (l.cost - r.min) / (r.max - r.min) : 0;
        return '<i class="' + (l.cost === r.min ? "min" : "") + '" style="background:' + heat(x) + '" title="' + esc(c.name) + " " + euro(l.cost) + '"></i>';
      }).join("") + (r.avail.length ? "<span>laagst <b>" + euro(r.min) + "</b> " + esc(r.avail[0].name) + (r.avail.length > 1 ? " · tot " + plus(r.max - r.min) : "") + "</span>" : "<span>nergens te koop</span>") +
        '</span><span class="ops"><button data-act="staple" data-id="' + r.item.id + '" aria-pressed="' + r.item.staple + '" title="Vaste boodschap">📌</button><button data-act="remove" data-id="' + r.item.id + '" title="Weg">✕</button></span></div>';
      const once = s.rows.filter((r) => !r.item.staple), st = s.rows.filter((r) => r.item.staple);
      body = '<h1 class="B-h1">Boodschappenlijst</h1><p class="B-sub">Elk blokje is een winkel, in de volgorde van het raster. Groen is goedkoop voor dat artikel.</p>' + addForm("500 g rundergehakt, 2 courgettes…") +
        '<div class="B-sec">Deze keer · ' + once.length + "</div>" + once.map(li).join("") + '<div class="B-sec">Vast · ' + st.length + "</div>" + st.map(li).join("") +
        '<div class="B-cta"><span>' + pt.shops.map((id) => tag(byId(id))).join(" + ") + " · <b>" + euro(pt.total) + '</b></span><span><button class="ghost" data-act="go" data-id="vergelijk">Raster</button> <button data-act="go" data-id="winkelen">Winkelen</button></span></div>';
    } else body = shopPage(s, pt, "B");
    return '<div class="wrap">' + head + body + "</div>" + navBottom;
  }

  // ════════════════════════════════════════════════════════════════════
  // C · SAMENSTELLER
  // ════════════════════════════════════════════════════════════════════
  function C(s) {
    const [navTop, navBottom] = nav(["Lijst", "Samenstellen", "Winkelen"], ["☰", "🧺", "✓"]);
    const head = '<div class="C-head"><div class="C-brand">meal<span>deal</span></div>' + navTop + "</div>";
    const pt = planTotals(s);
    let body = "";
    const overrides = Object.keys(pick).filter((id) => list.some((i) => i.id === id)).length;
    const mode = overrides ? "eigen" : plan.base;
    const bon = (() => {
      const ranked = pt.shops.map((id) => [id, pt.per[id]]).sort((a, b) => b[1] - a[1]);
      const cheapAll = s.rows.reduce((n, r) => n + (r.min ?? 0), 0);
      const extra = pt.total - cheapAll;
      return '<div class="C-bon"><span class="shops">' + ranked.map(([id, v]) => '<span style="--c:' + byId(id).color + '">' + esc(byId(id).name) + " " + euro(v) + "</span>").join("") + "</span>" +
        '<span class="sum"><b>' + euro(pt.total) + "</b><small>" + pt.shops.length + " winkel" + (pt.shops.length > 1 ? "s" : "") + "</small></span>" +
        (pt.shops.length > 2 ? '<span class="warn">' + pt.shops.length + " winkels is veel ritten. Kies 'Max. 2 winkels' om te bundelen.</span>"
          : extra > 0 ? '<span class="save">' + plus(extra) + " boven het absolute minimum (alles overal het goedkoopst)</span>" : '<span class="save">Dit is het absolute minimum.</span>') + "</div>";
    })();
    if (page === "vergelijk") {
      const modes = [["single", "Eén winkel"], ["combo", "Max. 2 winkels"], ["cheap", "Overal het goedkoopst"]].map(([k, l]) =>
        '<button data-act="mode" data-id="' + k + '" aria-pressed="' + (mode === k) + '">' + l + "</button>").join("") + (overrides ? '<button aria-pressed="true" data-act="mode" data-id="single">Eigen keuze · ' + overrides + " — reset</button>" : "");
      const items = s.rows.map((r) => {
        const at = sourceOf(r, s);
        const chips = r.avail.map((c) => {
          const d = r.by[c.id].cost - r.min;
          return '<button class="C-chip' + (c.id === at ? " on" : "") + '" style="--c:' + c.color + '" data-act="pick" data-id="' + r.item.id + '" data-shop="' + c.id + '">' +
            '<span class="dot"></span><span class="n">' + esc(c.name) + (c.sim ? " vb" : "") + '</span><span class="v' + (d ? "" : " z") + '">' + (d ? plus(d) : euro(r.min)) + "</span></button>";
        }).join("") + s.chains.filter((c) => !r.by[c.id]).map((c) => '<span class="C-chip no" style="--c:' + c.color + '"><span class="dot"></span><span class="n">' + esc(c.name) + '</span><span class="v">—</span></span>').join("");
        const got = at ? r.by[at].cost : null;
        return '<div class="C-it"><div class="top"><span class="nm">' + esc(r.item.noun) + "<small>" + qtyText(r.item) + "</small></span>" +
          '<span class="got">' + (got !== null ? euro(got) + (got > r.min ? "<small>" + plus(got - r.min) + " t.o.v. laagst</small>" : '<small class="z">laagst</small>') : "—") + "</span></div>" +
          '<div class="C-chips">' + chips + "</div></div>";
      }).join("");
      body = '<h1 class="C-h1">Waar haal je wat?</h1><p class="C-sub">Per artikel staan de winkels op prijs. Tik waar je het koopt; de bon onderaan rekent mee.</p>' +
        '<div class="C-modes">' + modes + "</div>" + items + bon;
    } else if (page === "lijst") {
      const li = (r) => { const at = sourceOf(r, s); return '<div class="C-li"><span class="nm">' + esc(r.item.noun) + "<small>" + qtyText(r.item) + '</small><div class="from">' + (at ? esc(byId(at).name) + " · " + euro(r.by[at].cost) : "nergens te koop") + "</div></span>" +
        '<button data-act="staple" data-id="' + r.item.id + '" aria-pressed="' + r.item.staple + '" title="Vaste boodschap">📌</button><button data-act="remove" data-id="' + r.item.id + '" title="Weg">✕</button></div>'; };
      const once = s.rows.filter((r) => !r.item.staple), st = s.rows.filter((r) => r.item.staple);
      body = '<h1 class="C-h1">Boodschappenlijst</h1><p class="C-sub">Wat er in huis moet. Waar je het haalt, stel je samen op de volgende pagina.</p>' + addForm("500 g rundergehakt, 2 courgettes…") +
        '<div class="C-sec">Deze keer <span>' + once.length + "</span></div>" + once.map(li).join("") + '<div class="C-sec">Vast <span>' + st.length + " · 📌 blijven staan</span></div>" + st.map(li).join("") + bon;
    } else {
      body = shopPage(s, pt, "C") + bon.replace('class="C-bon"', 'class="C-bon"') ;
      const ticked = [...done].length;
      if (ticked) body += '<div style="text-align:center;margin-top:18px"><button data-act="finish" style="border:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 18px;font-weight:800;cursor:pointer">Klaar met winkelen (' + ticked + ")</button></div>";
    }
    return '<div class="wrap">' + head + body + "</div>" + navBottom;
  }

  // ── Wiring ──────────────────────────────────────────────────────────
  const VARIANTS = { A: ["Ranglijst", A], B: ["Prijsraster", B], C: ["Samensteller", C] };
  const root = document.getElementById("root");
  function render() {
    document.body.dataset.v = variant;
    document.getElementById("vlabel").textContent = variant + " · " + VARIANTS[variant][0];
    for (const b of document.querySelectorAll("[data-chains]")) b.setAttribute("aria-pressed", String(Number(b.dataset.chains) === chainCount));
    const focused = document.activeElement && document.activeElement.name === "q";
    root.innerHTML = VARIANTS[variant][1](snapshot());
    if (focused) root.querySelector("input[name=q]")?.focus();
    const u = new URL(location.href); u.searchParams.set("variant", variant); u.searchParams.set("page", page); u.searchParams.set("chains", chainCount);
    try { history.replaceState(null, "", u); } catch { /* file:// */ }
  }
  const keys = Object.keys(VARIANTS);
  const go = (d) => { variant = keys[(keys.indexOf(variant) + d + keys.length) % keys.length]; render(); };
  document.getElementById("prev").onclick = () => go(-1);
  document.getElementById("next").onclick = () => go(1);
  document.addEventListener("keydown", (e) => { if (e.target.closest("input")) return; if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1); });
  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const input = e.target.querySelector("input[name=q]"), p = parse(input.value);
    if (!p) { hint = "Niet gelezen — probeer “500 g rundergehakt”."; render(); return; }
    list.unshift({ id: "i" + nid++, staple: false, ...p }); hint = "Toegevoegd: " + qtyText(p) + " " + p.noun; input.value = ""; render();
  });
  document.addEventListener("click", (e) => {
    const ch = e.target.closest("[data-chains]"); if (ch) { chainCount = Number(ch.dataset.chains); render(); return; }
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id;
    switch (b.dataset.act) {
      case "go": page = id; window.scrollTo(0, 0); break;
      case "staple": { const it = list.find((i) => i.id === id); if (it) it.staple = !it.staple; break; }
      case "remove": list = list.filter((i) => i.id !== id); done.delete(id); delete pick[id]; break;
      case "shop":
        if (plan.base === "single" && plan.shop === id) openLoss = openLoss === id ? null : id;
        plan = { base: "single", shop: id }; for (const k in pick) delete pick[k]; break;
      case "combo": plan = { base: "combo", shop: null }; for (const k in pick) delete pick[k]; break;
      case "mode": plan = { base: id, shop: null }; for (const k in pick) delete pick[k]; break;
      case "pick": pick[id] = b.dataset.shop; break;
      case "tick": done.has(id) ? done.delete(id) : done.add(id); break;
      case "finish": list = list.filter((i) => i.staple || !done.has(i.id)); done.clear(); page = "lijst"; break;
    }
    render();
  });
  render();
</script>
