# Serves the basket page from Cloudflare Pages at an unlisted address, so it
# opens on a phone in the shop (#17). Each deploy ships the page with the
# catalogue the morning refresh last published.
#
# Skipped until scripts/setup-pages.sh has created the Pages project and set
# PAGES_PROJECT and the CLOUDFLARE_API_TOKEN secret.
name: Deploy the app

on:
  # Every published catalogue. A failed refresh published nothing.
  workflow_run:
    workflows: ["Refresh the catalogue"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["prototype/basket.html", "prototype/sw.js", "prototype/words.js", "prototype/resolve.js", "prototype/images.js", "prototype/recipes.js", "functions/**", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: app
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.PAGES_PROJECT != '' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Assemble the site
        run: |
          mkdir site
          cp prototype/basket.html site/index.html
          cp prototype/sw.js site/sw.js
          cp prototype/words.js site/words.js
          cp prototype/resolve.js site/resolve.js
          cp prototype/images.js site/images.js
          cp prototype/recipes.js site/recipes.js
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/catalogue/latest.js" site/catalogue.js --only-show-errors
          # The price history (#16). Until a refresh has published one, the
          # page gets none, and shows no history rather than failing.
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/catalogue/prices.js" site/prices.js --only-show-errors 2>/dev/null \
            || echo "window.PRICES = null;" > site/prices.js
          # Unlisted is not private, but it should not be found: no search
          # engine indexes it. The page, its catalogue and the service worker
          # are revalidated on every visit, so the phone never shows yesterday's
          # prices while today's are published.
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-cache\n' > site/_headers
          ls -la site
          # "Klopt niet" reports (#38): functions/api/report.ts, deployed with
          # the site, stores each in the archive's bucket under reports/. The
          # bucket's name stays a secret, so the binding is written here.
          {
            echo 'name = "${{ vars.PAGES_PROJECT }}"'
            echo 'pages_build_output_dir = "site"'
            echo 'compatibility_date = "2026-09-01"'
            echo '[[r2_buckets]]'
            echo 'binding = "REPORTS"'
            echo 'bucket_name = "${{ secrets.R2_BUCKET }}"'
          } > wrangler.toml

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.151.0 pages deploy site --project-name "${{ vars.PAGES_PROJECT }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

      - name: Check the deployed page loads today's catalogue
        run: |
          url="https://${{ vars.PAGES_PROJECT }}.pages.dev"
          sleep 10
          curl -fsS "$url/" | grep -q 'src="catalogue.js"'
          curl -fsS "$url/catalogue.js" | grep -o '"observedAt":"[0-9-]*"' | sort -u
          # The report function answers, and refuses what is not a report: nothing is stored.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/api/report" -d '{}')" = 400
          echo "Live at $url"
