# Records what each Chain's public endpoint said today, and uploads it to
# object storage. See docs/archive.md for why this runs daily and why it must
# not be allowed to silently archive nothing.
name: Archive chain prices

on:
  # The morning's run is started at 04:30 UTC by the scheduler Worker
  # (scheduler/dispatch.ts), because GitHub's own cron started it 5 hours late on
  # 2026-10-14 and 2026-10-15. 04:30 UTC is 06:30 in Amsterdam in summer, 05:30
  # in winter: both after Dirk's own ~04:01 local refresh. This cron is only
  # the backup for a Worker that did not fire. It archives just the Chains not
  # yet done today, so when the Worker did its job it costs about a minute.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: Chain to archive
        type: choice
        # missing: only the Chains whose archive for today is absent from R2
        # or fails archive:check, as a scheduled run does.
        options: [aldi, dekamarkt, dirk, hoogvliet, jumbo, lidl, plus, vomar, all, missing]
        default: dirk
      max_product_steps:
        description: Limit product steps (leave empty for a full run)
        type: string
        default: ""

# A scheduled run and a manual one must never interleave: they would write to
# the same date directory and race on the manifest. Later runs wait.
concurrency:
  group: archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Which Chains this run archives. A manual run names one, or all. A scheduled
  # run, or chain=missing, takes every Chain whose manifest for today is absent
  # from R2 or fails archive:check, so a backup that fires after the morning's
  # run went well archives nothing.
  plan:
    runs-on: ${{ fromJSON(vars.ARCHIVE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      chains: ${{ steps.plan.outputs.chains }}
    env:
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The list must match the archive watch's (archive-watch.yml).
      - name: Choose the Chains
        id: plan
        env:
          CHOICE: ${{ inputs.chain || 'missing' }}
        run: |
          all="aldi dekamarkt dirk hoogvliet jumbo lidl plus vomar"
          case "$CHOICE" in
            all) chains="$all" ;;
            missing)
              date=$(date -u +%F)
              chains=""
              for chain in $all; do
                if aws s3 cp "s3://${{ secrets.R2_BUCKET }}/$date/$chain/manifest.json" "manifest-$chain.json" \
                     --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" --only-show-errors 2>/dev/null \
                   && npm run --silent archive:check -- --manifest "manifest-$chain.json" >/dev/null 2>&1; then
                  echo "$chain: already archived for $date"
                else
                  echo "$chain: missing or incomplete for $date"
                  chains="$chains $chain"
                fi
              done ;;
            *) chains="$CHOICE" ;;
          esac
          json=$(printf '%s\n' $chains | jq -R . | jq -sc 'map(select(. != ""))')
          echo "chains=$json" >> "$GITHUB_OUTPUT"
          echo "Archiving: $json"

  archive:
    needs: plan
    if: needs.plan.outputs.chains != '[]'

    # One job per Chain, in parallel. A full Sweep of Dirk, Jumbo or Plus takes
    # most of an hour, so back to back they would overrun the timeout, and a Chain
    # whose edge refuses us must not cost another its day. Vomar takes about
    # two minutes, Hoogvliet three, DekaMarkt about ten, Aldi four requests,
    # Lidl one. The plan job above picks the Chains.
    strategy:
      fail-fast: false
      matrix:
        chain: ${{ fromJSON(needs.plan.outputs.chains) }}

    # GitHub's own runners, unless the repository variable ARCHIVE_RUNNER names
    # others, such as ["self-hosted","pi"] for the owner's Raspberry Pi. A full
    # day is about 100 runner minutes and a private repository gets 2,000 free a
    # month, so the hosted runner cannot carry the schedule all month (#24).
    # scripts/setup-pi-runner.sh sets the variable; deleting it switches back.
    runs-on: ${{ fromJSON(vars.ARCHIVE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 90

    env:
      CHAIN: ${{ matrix.chain }}
      # Jumbo tarpits our honest agent string. On 2026-10-13 the project owner
      # chose to send a browser one for Jumbo, then to do so on the daily
      # schedule too. See "Jumbo" in docs/archive.md. Aldi, DekaMarkt,
      # Dirk, Hoogvliet, Lidl, Plus and Vomar accept the honest default and are never
      # sent this.
      JUMBO_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
      # R2 is S3-compatible, so the AWS CLI can talk to it: it comes with
      # GitHub's runners, and scripts/setup-pi-runner.sh installs it on the Pi. These two settings are not optional: recent AWS CLI versions send
      # integrity checksum headers that R2 rejects outright.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Fail before touching a Chain if the upload could not possibly work.
      # Archiving a day and then dropping it on the floor is worse than not
      # running: it looks like success and the day cannot be re-recorded.
      - name: Check storage credentials are present
        run: |
          missing=""
          for name in R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see docs/archive.md"
            exit 1
          fi
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Record today's date
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Stop before writing anything if the bucket is near R2's free tier, and
      # warn at half of it. R2 has no spending cap, so a bug that uploads in a
      # loop would otherwise only show up on the invoice. See src/archive/usage.ts.
      - name: Check the bucket stays inside R2's free tier
        run: |
          aws s3api list-objects-v2 \
            --bucket "${{ secrets.R2_BUCKET }}" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --output json > bucket-listing.json
          npm run --silent archive:usage -- bucket-listing.json

      # Pull back any partial archive for today before running. The archiver
      # skips steps whose file already exists, so a retried run resumes
      # instead of re-requesting everything a failed attempt already got.
      - name: Restore any partial archive for today
        continue-on-error: true
        run: |
          aws s3 sync \
            "s3://${{ secrets.R2_BUCKET }}/${{ steps.today.outputs.date }}/$CHAIN/" \
            "archive/${{ steps.today.outputs.date }}/$CHAIN/" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --only-show-errors

      - name: Archive
        run: |
          args="--chain $CHAIN --date ${{ steps.today.outputs.date }}"
          if [ -n "${{ inputs.max_product_steps }}" ]; then
            args="$args --max-product-steps ${{ inputs.max_product_steps }}"
          fi
          if [ "$CHAIN" = jumbo ]; then
            npm run archive -- $args --user-agent "$JUMBO_USER_AGENT"
          else
            npm run archive -- $args
          fi

      # Upload even if the archive run failed part-way: a partial day is worth
      # keeping, both for the data and so the next attempt can resume from it.
      - name: Upload to R2
        if: always()
        run: |
          if [ ! -d "archive/${{ steps.today.outputs.date }}/$CHAIN" ]; then
            echo "::warning::Nothing was archived, so there is nothing to upload"
            exit 0
          fi
          aws s3 sync \
            "archive/${{ steps.today.outputs.date }}/$CHAIN/" \
            "s3://${{ secrets.R2_BUCKET }}/${{ steps.today.outputs.date }}/$CHAIN/" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --only-show-errors
          echo "Uploaded $(find "archive/${{ steps.today.outputs.date }}/$CHAIN" -type f | wc -l) files"

      # The manifests are tiny and are the only thing worth reading when a run
      # looks wrong, so keep them attached to the run itself.
      - name: Keep manifests on the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifests-${{ steps.today.outputs.date }}-${{ matrix.chain }}
          path: archive/*/${{ matrix.chain }}/manifest.json
          if-no-files-found: warn
          retention-days: 30

      # Last, and deliberately after the upload: a run that recorded almost
      # nothing must go red even though every step above succeeded.
      - name: Check the archive is not empty
        if: always()
        run: |
          status=0
          for manifest in archive/${{ steps.today.outputs.date }}/$CHAIN/manifest.json; do
            [ -e "$manifest" ] || continue
            npm run --silent archive:check -- --manifest "$manifest" || status=1
          done
          exit $status
